<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Compass (Beta)</title>
<!-- 加到 iPhone 主畫面用:全螢幕、自己的圖示、不出現 Safari 網址列 -->
<meta name="theme-color" content="#eef0f4">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Compass">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<!-- 開啟時不要白閃:底色先塗上,字型不擋首次繪製(先用系統字,載完再換) -->
<style>html{background:#eef0f4;}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Manrope:wght@500;600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Manrope:wght@500;600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet"></noscript>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/demo.css">
</head>
<body>
<main class="wrap">
 <!-- 整個上半部收進同一張白卡,內部用分隔線切段(依設計稿) -->
 <div class="shell">
  <header>
    <div class="brandcol">
      <h1>Compass (Beta)</h1>
      <div class="sub"><span id="datadate">-</span> 更新</div>
    </div>
    <!-- 兩面板切換:股票面板 / 槓桿風險。槓桿資料是本機檔,線上讀不到就整組隱藏 -->
    <div id="panelToggle" class="ptog" hidden>
      <button data-panel="stock" class="on">股票面板</button>
      <button data-panel="risk">槓桿風險</button>
      <button data-panel="expense" id="assetTogBtn" hidden>資產支出</button>
      <button data-panel="expense" id="expenseTogBtn" hidden>支出</button>
    </div>
    <div class="hright">
    <button id="todoBtn" class="refresh" aria-label="To-Do" title="To-Do">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11"/><path d="M9 12h11"/><path d="M9 18h11"/><path d="M3.5 6l1 1 2-2"/><path d="M3.5 12l1 1 2-2"/><path d="M3.5 18l1 1 2-2"/></svg>
      <span class="bdg" id="todoBadge" hidden></span>
    </button>
    <button id="refreshBtn" class="refresh" aria-label="重新整理" title="重新整理">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg>
    </button>
    </div>
  </header>

  <!-- 分頁列與訊號列只屬於股票面板,切到槓桿面板時整段隱藏 -->
  <div id="stockChrome">
   <!-- 導覽只有一層:分頁列本身就是四段,底下不再有篩選列(2026-08-25 改) -->
   <div class="tabs">
    <button data-seg="all" class="active">全部</button>
    <button data-seg="eu">大盤 ETF</button>
    <button data-seg="stock">個股</button>
    <!-- 規則入口:桌面在分頁列右端(手機的入口在脈搏卡裡,所以手機隱藏這顆) -->
    <button class="tabrules" id="rulesTop">規則 ↗</button>
   </div>
   <div id="topstrip" class="topstrip"></div>
  </div>
 </div>

  <!-- .main 在手機是 display:contents(等於不存在),桌面才變成 1232px 版心容器 -->
  <div class="main">
  <div id="stockPanel">
   <div id="status" class="loading" role="status">讀取資料中…</div>
   <div id="paneCol">
    <div id="macro" class="pane"></div>
   </div>
   <!-- 桌面右欄:脈搏卡 + 今日訊號。手機不顯示(訊號在 #topstrip 的脈搏卡裡) -->
   <aside id="rail"></aside>
  </div>
  <div id="riskPanel" hidden></div>
  <div id="afHead" hidden></div>
  <div id="assetPanel" hidden></div>
  <div id="expensePanel" hidden></div>

  <footer>Compass (Beta) · 示範資料</footer>
  </div>
</main>

<!-- 手機底部分頁列(桌面隱藏):把頂部的分頁與面板切換收成單手可按的一排。
     槓桿那格只有讀得到槓桿資料時才出現。 -->
<nav class="tabbar" id="tabbar" aria-label="主要分頁">
  <button data-go="stock" class="on" aria-label="股票面板">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M5 20v-8"/><path d="M12 20V5"/><path d="M19 20v-6"/></svg>
    <span>股票</span></button>
  <button data-go="risk" id="tabbarRisk" aria-label="槓桿風險" hidden>
    <span class="tb-ic">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M4 18a8 8 0 0 1 16 0"/><path d="M12 18l3.5-6"/></svg>
      <i class="tb-dot" id="tabbarRiskDot"></i>
    </span>
    <span>槓桿</span></button>
  <button data-go="asset" id="tabbarAsset" aria-label="資產" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5V12l6 3.5"/></svg>
    <span>資產</span></button>
  <button data-go="expense" id="tabbarExpense" aria-label="支出" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M3 7.5h18v12H3z"/><path d="M3 11h18"/><path d="M7 15.5h3"/></svg>
    <span>支出</span></button>
</nav>

<div id="chartModal" class="modal"><div class="sheet" id="chartSheet" role="dialog" aria-modal="true" aria-label="走勢圖"></div></div>
<div id="rulesModal" class="modal"><div class="sheet" id="rulesSheet" role="dialog" aria-modal="true" aria-label="看板規則"></div></div>
<div id="todoModal" class="modal"><div class="sheet" id="todoSheet" role="dialog" aria-modal="true" aria-label="To-Do"></div></div>

<!-- 槓桿快照:本機檔(gitignore),線上讀不到就 404,槓桿面板自動隱藏。裡面是 window.MANUAL_SNAPSHOTS -->
<script src="leverage-data.js"></script>
<script src="asset-data.js"></script>
<script src="expense-data.js"></script>
<script src="js/core.js"></script>
<script src="js/stocks.js"></script>
<script src="js/todo.js"></script>
<script src="js/perf.js"></script>
<script src="js/risk.js"></script>
<script src="js/asset.js"></script>
<script src="js/expense.js"></script>
<script src="js/chart.js"></script>
<script src="js/app.js"></script>
</body>
</html>
