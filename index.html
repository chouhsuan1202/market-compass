<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Market Compass</title>
<!-- 加到 iPhone 主畫面用:全螢幕、自己的圖示、不出現 Safari 網址列 -->
<meta name="theme-color" content="#eef0f4">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Compass">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* 色彩系統依完稿規格(2026-08-11 上色版) */
  :root{
    color-scheme:light;
    --bg:#eef0f4; --card:#fff; --line:#edeff2; --line2:#e3e6ea;
    --ink:#101418; --muted:#6b7280; --faint:#9aa1ab;
    --up:#0b7a55; --up2:#12a670; --upbg:#e7f6ef; --dn:#c2373b; --dn2:#e5484d; --dnbg:#fdeeee;
    --dot-up:#12a670; --dot-dn:#e5484d; --dot-na:#cbd5e1;
    --add:#1d4ed8; --addbg:#eef4ff;
    --green:#0e9f6e; --yellow:#f59e0b; --red:#e5484d;
    --nearbg:#fff4e5; --nearink:#b45309;
    --cline:#12a670;
    --num:"Manrope",system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  /* hidden 屬性一定要贏。像 #riskPanel{display:flex} 這種帶 id 的Rules優先度比瀏覽器
     內建的 [hidden]{display:none} 高,會讓「隱藏」失效(Leverage面板曾因此掛在Stocks下面)。 */
  [hidden]{display:none !important;}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Noto Sans TC","Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;
    font-size:15px;line-height:1.45;}
  /* 版心 900px(依設計稿),手機仍是滿版 */
  .wrap{max-width:900px;margin:0 auto;padding:14px 12px calc(28px + env(safe-area-inset-bottom));}
  /* 整體放大 120%(依需求)。手機維持原大小,避免橫向捲動 */
  @media(min-width:760px){ .wrap{zoom:1.2;} }
  /* 上半部(標題+分頁+訊號)收在同一張白卡,各段用分隔線 */
  .shell{background:var(--card);border:1px solid var(--line);border-radius:14px;
    overflow:hidden;margin-bottom:14px;}
  header{display:flex;justify-content:space-between;align-items:flex-start;
    padding:14px 16px;border-bottom:1px solid var(--line);}
  header h1{font-size:19px;margin:0 0 2px;}
  .sub{color:var(--muted);font-size:12px;margin-bottom:0;}
  .refresh{border:1px solid var(--line);background:var(--card);color:var(--muted);
    width:34px;height:34px;border-radius:50%;font-size:17px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;flex:none;margin-top:2px;}
  .refresh:active{background:var(--line);}
  .refresh.spinning svg{animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* 標題列右側:Leverage Risk連結 + 更新鈕 */
  .hright{display:flex;gap:8px;align-items:center;flex:none;margin-top:2px;}
  .crossLink{font-size:12.5px;font-weight:700;padding:8px 11px;border-radius:9px;
    border:1px solid var(--line);background:var(--card);color:var(--muted);
    text-decoration:none;white-space:nowrap;}
  .crossLink:active{background:#eceef1;}

  /* 分頁:文字加底線,不再是佔一整列的大膠囊 */
  .tabs{display:flex;gap:22px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--card);}
  .tabs button{flex:none;font-size:13px;font-weight:600;padding:11px 0;border:none;
    background:none;color:var(--muted);cursor:pointer;box-shadow:inset 0 -2px 0 transparent;}
  .tabs button:hover{color:var(--ink);}
  .tabs button.active{color:var(--ink);font-weight:700;box-shadow:inset 0 -2px 0 var(--ink);}

  .loading{text-align:center;padding:44px 0;color:var(--muted);}

  /* ── Ticker清單:分隔線列(完稿) ── */
  .num{font-family:var(--num);font-variant-numeric:tabular-nums;}
  .blist{background:var(--card);border:1px solid var(--line2);border-radius:16px;
    padding:2px 20px 8px;margin-bottom:14px;box-shadow:0 1px 2px rgba(16,20,24,.05);}
  .bhead{display:grid;grid-template-columns:1fr 250px 116px;gap:20px;align-items:center;
    padding:12px 2px 9px;border-bottom:1px solid var(--line2);
    font-size:10.5px;letter-spacing:.06em;color:var(--faint);font-weight:600;}
  .bhead .c2{text-align:center;} .bhead .c3{text-align:right;}
  .brow{display:grid;grid-template-columns:1fr 250px 116px;gap:20px;align-items:center;
    padding:14px 2px;border-bottom:1px solid var(--line);}
  .brow:last-child{border-bottom:none;}
  .brow.clickable{cursor:pointer;}
  .brow.clickable:hover{background:#fafbfc;margin:0 -20px;padding-left:22px;padding-right:22px;
    grid-template-columns:1fr 250px 116px;}
  .brow-id{display:flex;flex-direction:column;gap:6px;min-width:0;}
  .brow-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .brow-t{font-size:15px;font-weight:700;color:var(--ink);letter-spacing:.01em;}
  .brow-note{font-size:11.5px;color:var(--faint);}
  .brow-p{display:flex;align-items:baseline;gap:11px;flex-wrap:wrap;}
  .brow-p .px{font-size:18px;font-weight:600;color:#3f4652;}
  .brow-day{font-size:12px;font-weight:500;}
  .brow-day.up,.brow-yr b.up{color:var(--up);} .brow-day.dn,.brow-yr b.dn{color:var(--dn);}
  .brow-yr{font-size:12px;color:var(--faint);}
  .brow-yr b{font-weight:700;}
  .brow-interp{font-size:12.5px;color:var(--muted);line-height:1.5;}
  .brow-ma{display:flex;flex-direction:column;gap:7px;align-items:flex-end;}
  .brow-pe{font-size:11px;letter-spacing:.03em;color:var(--faint);min-height:13px;}
  .brow-st{display:flex;justify-content:flex-end;}
  .brow-badge{height:30px;padding:0 13px;border-radius:9px;display:inline-flex;align-items:center;
    font-size:12.5px;font-weight:700;background:var(--card);border:1px solid #d9dde3;color:#3f4652;white-space:nowrap;}
  .brow-badge.full{background:var(--green);border-color:var(--green);color:#fff;}
  /* 窄螢幕:三欄撐不開,改成堆疊(代號Price在上,MA點+Status在下一列) */
  @media(max-width:720px){
    .blist{padding:2px 14px 6px;}
    .bhead{display:none;}
    .brow{grid-template-columns:1fr;gap:11px;padding:13px 2px;}
    .brow.clickable:hover{margin:0;padding-left:2px;padding-right:2px;grid-template-columns:1fr;background:none;}
    .brow-ma{flex-direction:row;align-items:center;justify-content:space-between;gap:12px;}
    .brow-ma .dots{gap:16px;flex:1;justify-content:space-between;}
    .brow-pe{order:2;min-height:0;}
    .brow-st{justify-content:flex-start;}
    .brow-ma+.brow-st{margin-top:-2px;}
  }
  /* 舊 index card(指數 fallback 用) */
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
  .icard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 12px 11px;}
  .icard.span2{grid-column:1 / -1;}
  .icard.clickable{cursor:pointer;}
  .fb.hold{color:#fff;background:var(--up);}
  .icard .top{display:flex;align-items:baseline;justify-content:space-between;gap:6px;}
  .icard .short{font-size:16px;font-weight:800;}
  .icard .full{font-size:11px;color:var(--faint);}
  .icard .px{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;margin:4px 0 1px;}
  .icard .yr{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;}
  .icard .yr .lbl{color:var(--faint);font-weight:500;}
  .icard .mid{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin:2px 0 3px;}
  .icard .dots{display:flex;gap:7px;}
  .icard .rcol{display:flex;flex-direction:column;align-items:flex-end;gap:8px;}
  .icard .foot{display:flex;align-items:center;justify-content:space-between;margin-top:6px;}
  .icard .sc{font-size:12px;color:var(--muted);}
  .icard .sc b{font-size:15px;}
  .mapill{display:inline-block;color:#fff;font-weight:800;font-size:12px;padding:4px 10px;border-radius:8px;}
  /* 2x/3x等內建Leverage產品的警示標記,提醒每日重設耗損 */
  .levtag{display:inline-block;margin-left:6px;font-size:10.5px;font-weight:800;color:#9a3412;
    background:#ffedd5;border:1px solid #fb923c;padding:2px 7px;border-radius:6px;vertical-align:middle;}
  .icard .interp{font-size:11px;color:var(--muted);margin-top:7px;line-height:1.4;}
  .fb{display:inline-block;margin-top:6px;font-size:10.5px;color:#92600a;background:#fef3c7;
    border-radius:6px;padding:2px 6px;}
  .naidx{color:var(--faint);font-size:12px;padding:6px 0;}

  /* dot */
  /* MA點:Above=實心綠+光暈,Below=空心紅環,no data=灰(完稿) */
  .brow-ma .dots{display:flex;gap:22px;}
  .dot{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:#8b929c;line-height:1;font-weight:600;font-family:var(--num);}
  .dot i{width:16px;height:16px;border-radius:50%;display:block;box-sizing:border-box;}
  .dot.up i{background:var(--dot-up);box-shadow:0 0 0 4px rgba(18,166,112,.13);}
  .dot.dn i{background:var(--card);border:2.5px solid var(--dot-dn);}
  .dot.na i{background:var(--card);border:2.5px solid var(--dot-na);}

  /* traffic light rule */
  .rule{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:13px 14px;margin-bottom:12px;}
  .lamp{flex:none;width:16px;height:16px;border-radius:50%;box-shadow:0 0 0 4px rgba(0,0,0,.05);}
  .lamp.green{background:var(--green);} .lamp.yellow{background:var(--yellow);} .lamp.red{background:var(--red);}
  .lamp.gray{background:var(--dot-na);}
  .rule .msg{font-size:15px;font-weight:700;}
  .rule .why{font-size:11.5px;color:var(--muted);margin-top:2px;}

  /* 篩選列:Market=All/歐洲/台灣,Stocks & Watchlist=All/Bullish/Bearish */
  /* 篩選:小圓角 chip 靠左,不再是佔滿一列的分段控制項(依設計稿) */
  .filterbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;padding:0 2px;}
  .filterbar .fbtn{flex:none;border:1px solid var(--line);background:var(--card);color:var(--muted);
    font:inherit;font-size:11.5px;font-weight:600;padding:4px 12px;border-radius:20px;cursor:pointer;
    display:inline-flex;align-items:center;gap:5px;white-space:nowrap;}
  .filterbar .fbtn:hover{color:var(--ink);}
  .filterbar .fbtn .fn{font-size:11.5px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--faint);}
  .filterbar .fbtn.on{border-color:var(--ink);color:var(--ink);font-weight:700;}
  .filterbar .fbtn.on .fn{color:var(--ink);}
  .filterbar .fbtn.bull.on .fn{color:var(--up);}
  .filterbar .fbtn.bear.on .fn{color:var(--dn);}

  /* 訊號區在 shell 內,不需要自己的框 & 圓角 */
  .topstrip{margin-bottom:0;}
  .topstrip .sig{border:none;border-radius:0;margin-bottom:0;padding:12px 16px;}
  .topstrip .sig{margin-bottom:0;padding:10px 12px;}
  .topstrip .sig h3{font-size:12px;}
  .topstrip .sig .sigtxt,.topstrip .sig .noneline{font-size:13px;}

  /* signals */
  .sig{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:11px;}
  .sig h3{margin:0 0 8px;font-size:14px;color:var(--muted);font-weight:600;}
  /* VIX + NDX 併一行 */
  .metaline{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:12px;color:var(--muted);
    padding-bottom:9px;margin-bottom:9px;border-bottom:1px solid var(--line);}
  .metaline .mk{font-weight:700;color:var(--ink);}
  .metaline b{font-variant-numeric:tabular-nums;color:var(--ink);font-size:13px;}
  .metaline .msep{width:1px;height:12px;background:var(--line);margin:0 3px;}
  .metaline .mwhy{font-size:11.5px;}
  /* 訊號摘要列:數 chip + More */
  .sigsum{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .sigchips{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0;}
  .sigsum .sigt{font-size:12.5px;font-weight:700;margin-right:2px;}
  .sc{font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:2px 10px;
    font-variant-numeric:tabular-nums;}
  .sc.on{color:var(--ink);border-color:var(--ink);font-weight:700;}
  .sigmore{margin-left:auto;background:none;border:none;color:var(--muted);font:inherit;font-size:11.5px;
    cursor:pointer;padding:2px 0;}
  .sigmore:hover{color:var(--ink);}
  .sighl{font-size:12px;color:var(--muted);line-height:1.7;margin-top:7px;}
  .sighl b{color:var(--ink);}
  .sigacts{margin-left:auto;display:flex;gap:14px;align-items:center;}
  .sigacts .sigmore{margin-left:0;}
  /* Rules面板 */
  .rules{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);}
  .rules .rh{font-size:12px;font-weight:700;margin:10px 0 5px;}
  .rules .rh:first-child{margin-top:0;}
  .rules .rh span{font-weight:400;color:var(--faint);font-size:11px;margin-left:6px;}
  .rules table{width:100%;border-collapse:collapse;}
  .rules td{font-size:11.5px;color:var(--muted);padding:4px 0;vertical-align:top;
    border-bottom:1px solid var(--line);line-height:1.55;}
  .rules td:first-child{width:150px;padding-right:12px;white-space:nowrap;color:var(--ink);}
  .rules td b{color:var(--ink);}
  .rules .rt-a{color:#5b21b6;} .rules .rt-c{color:#0f766e;}
  .rules .rnote{margin-top:10px;font-size:11.5px;color:var(--muted);line-height:1.6;
    background:var(--bg);border-radius:8px;padding:9px 11px;}
  .sigfull[hidden]{display:none;}
  .sigfull{margin-top:4px;}
  .sigdiv{height:1px;background:var(--line);margin:6px 0 2px;}
  /* 訊號列裡的Ticker名:Watchlist用淺色,不再寫「(持)」 */
  .sigtxt .sy{font-weight:600;}
  .sigtxt .sy.wl{color:var(--muted);font-weight:500;}
  .sigrow{display:flex;gap:10px;align-items:center;padding:6px 0;}
  .tag{font-size:12px;font-weight:800;padding:4px 10px;border-radius:8px;flex:none;min-width:62px;text-align:center;color:#fff;}
  .tag.b{background:var(--up);} .tag.s{background:var(--dn);}
  .tag.n{background:var(--nearbg);color:var(--nearink);}
  /* Add訊號:Below60MA/120MA/240MA,越深越強(完稿改藍) */
  .tag.a{background:var(--add);}
  .addrow{align-items:flex-start;}
  .addit{display:inline-flex;align-items:baseline;gap:5px;background:var(--addbg);color:var(--add);
    border-radius:7px;padding:2px 9px;margin:0 6px 4px 0;font-size:13px;}
  .addit .lv{font-size:9px;letter-spacing:1px;color:var(--add);}
  .addbadge{display:inline-flex;align-items:center;gap:4px;margin-left:2px;font-size:11px;font-weight:600;color:var(--add);
    background:var(--addbg);padding:1px 8px;border-radius:6px;vertical-align:middle;line-height:1.7;}
  /* Trim訊號:漲多了,Add的鏡像(完稿改紅) */
  .tag.c{background:var(--dn);}
  .cutit{display:inline-flex;align-items:baseline;gap:5px;background:var(--dnbg);color:var(--dn);
    border-radius:7px;padding:2px 9px;margin:0 6px 4px 0;font-size:13px;}
  .cutit .lv{font-size:9px;letter-spacing:1px;color:var(--dn);}
  .cutbadge{display:inline-flex;align-items:center;gap:4px;margin-left:2px;font-size:11px;font-weight:600;color:var(--dn);
    background:var(--dnbg);padding:1px 8px;border-radius:6px;vertical-align:middle;line-height:1.7;}
  .sigtxt{font-size:14px;}
  .noneline{color:var(--muted);font-size:14px;}
  .vixnote{display:flex;align-items:center;gap:8px;margin-top:9px;padding-top:9px;
    border-top:1px dashed var(--line);font-size:12.5px;color:var(--muted);}
  .vixnote .vixk{font-weight:600;}
  .vixnote b{font-variant-numeric:tabular-nums;font-size:14px;color:var(--ink);}
  .vixtag{color:#fff;font-weight:800;font-size:11px;padding:2px 9px;border-radius:7px;}

  /* stock list */
  .blk{margin-bottom:16px;}
  .blk h2{font-size:12px;color:var(--muted);font-weight:600;margin:0 0 7px;padding-left:2px;}
  .grphd{font-size:12px;color:var(--ink);font-weight:700;margin:12px 0 6px;padding-left:2px;}
  .row{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:7px 11px;margin-bottom:5px;cursor:pointer;}
  .row .head{display:flex;align-items:center;gap:9px;}
  .row .id{flex:1;min-width:0;}
  .row .sym{font-size:14.5px;font-weight:800;}
  .row .grp{font-size:10px;color:var(--faint);display:block;margin-top:0;line-height:1.3;}
  .row .dots{display:flex;gap:7px;flex:none;}
  .row .rt{flex:none;text-align:right;min-width:72px;}
  .row .rt .px{font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--ink);line-height:1.25;}
  /* 240MA%  &  Above數 併成一行,省掉一整行高度 */
  .row .sub{display:flex;align-items:baseline;justify-content:flex-end;gap:5px;line-height:1.2;}
  .row .yr{font-size:12.5px;font-weight:800;font-variant-numeric:tabular-nums;}
  .row .yr.up{color:var(--up);} .row .yr.dn{color:var(--dn);} .row .yr.na{color:var(--faint);}
  .row .sc{font-size:10.5px;color:var(--muted);}
  /* 判讀文字移進More區,Less時不佔高度 */
  .row .detail .rowip{grid-column:1 / -1;font-size:11px;color:var(--muted);line-height:1.4;margin:0 0 2px;}
  .row .grp .pe,.grp{white-space:nowrap;}

  /* EarningsTime表:一天一張卡,同天sh票合併 */
  .ecard{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:9px 12px;margin-bottom:6px;}
  .ecard-top{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .edate{display:flex;align-items:baseline;gap:6px;line-height:1.1;}
  .edate b{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;}
  .edate span{font-size:11px;color:var(--faint);}
  .emeta{flex:none;display:flex;align-items:center;gap:6px;}
  .echips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .echip{display:inline-flex;align-items:baseline;gap:5px;font-size:13px;font-weight:700;color:var(--ink);
    background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:4px 9px;text-decoration:none;}
  .echip:active{background:var(--line);}
  .echip .ecode{font-size:10px;color:var(--faint);font-weight:500;}
  .echip .elink{font-size:10px;color:var(--faint);font-weight:700;}
  .ebadge{font-size:11.5px;font-weight:700;color:var(--muted);background:var(--bg);
    border-radius:7px;padding:3px 9px;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .ebadge.today{color:#fff;background:var(--red);}
  .ebadge.soon{color:var(--nearink);background:var(--nearbg);}
  .ebadge.past{color:var(--faint);background:transparent;padding:3px 0;}
  .eest{font-size:10px;color:var(--faint);border:1px solid var(--line);border-radius:6px;padding:1px 5px;}
  .row .note{font-size:11px;color:var(--faint);display:block;margin-top:2px;}
  .row.err{opacity:.6;}
  .row .nd{color:var(--faint);font-size:12px;}

  /* expand detail */
  .detail{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);
    grid-template-columns:1fr 1fr;gap:8px;}
  .row.open .detail{display:grid;}
  .mrow{background:var(--bg);border-radius:9px;padding:7px 9px;}
  .mrow.up{background:var(--upbg);} .mrow.dn{background:var(--dnbg);}
  .mrow .ml{font-size:11px;color:var(--muted);}
  .mrow .mv{font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;}
  .mrow .md{font-size:11px;font-weight:700;}
  .mrow.up .md{color:var(--up);} .mrow.dn .md{color:var(--dn);}
  .caret{font-size:11px;color:var(--faint);margin-left:2px;}

  footer{color:var(--muted);font-size:12px;margin-top:22px;text-align:center;line-height:1.6;}

  /* ---------- 點擊彈窗:走勢線圖 ---------- */
  .modal{position:fixed;inset:0;z-index:100;display:none;align-items:flex-end;justify-content:center;
    background:rgba(20,22,28,.45);}
  .modal.show{display:flex;}
  .sheet{background:var(--card);width:100%;max-width:680px;max-height:92vh;overflow-y:auto;
    border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));
    box-shadow:0 -8px 40px rgba(0,0,0,.22);}
  @media(min-width:560px){ .modal{align-items:center;} .sheet{border-radius:18px;} }
  .shead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:4px;}
  .shead .stitle{font-size:19px;font-weight:800;line-height:1.2;font-family:var(--num);letter-spacing:-.01em;}
  .shead .ssub{font-size:12px;color:var(--faint);margin-top:5px;}
  .shead .rt{text-align:right;display:flex;align-items:flex-start;gap:12px;}
  .shead .sprice{font-size:26px;font-weight:800;font-family:var(--num);font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.02em;}
  .shead .schg{font-size:12px;font-weight:500;font-family:var(--num);font-variant-numeric:tabular-nums;margin-top:5px;}
  .schg.up{color:var(--up);} .schg.dn{color:var(--dn);}
  .trendtag{font-size:11px;font-weight:500;padding:3px 8px;border-radius:6px;margin-left:8px;vertical-align:middle;}
  .trendtag.up{background:var(--upbg);color:var(--up);} .trendtag.dn{background:var(--dnbg);color:var(--dn);}
  .sclose{border:none;background:#f1f3f5;color:var(--muted);width:30px;height:30px;border-radius:50%;
    font-size:14px;line-height:1;cursor:pointer;flex:none;}
  .chartbox{margin:10px 0 0;}
  .chartbox svg{width:100%;height:auto;display:block;}
  .cline{fill:none;stroke:var(--cline);stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round;}
  .carea{fill:url(#cgrad);stroke:none;}
  .cdot{fill:var(--cline);}
  .cglow{fill:var(--cline);opacity:.18;}
  /* Avg cost標記:紅色虛線 + 兩端紅點 + 標籤 */
  .bline{stroke:#dc2626;stroke-width:1.3;stroke-dasharray:4 4;}
  .bdot{fill:#dc2626;}
  .blabel{font-size:10.5px;font-weight:700;fill:#dc2626;font-variant-numeric:tabular-nums;}
  /* Avg cost收成一個 chip,不再是紅字疊三行 */
  .costchip{display:inline-flex;align-items:baseline;gap:6px;margin-top:5px;font-size:11px;
    color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:3px 9px;
    font-variant-numeric:tabular-nums;white-space:nowrap;}
  .costchip b{color:var(--ink);font-weight:800;}
  .costchip .bq{width:6px;height:6px;border-radius:50%;background:#dc2626;display:inline-block;}
  /* 彈窗底部:解讀句 + Above n/5 */
  .sfoot{display:flex;align-items:center;gap:10px;margin-top:14px;}
  .sfoot .sinterp{margin-top:0;flex:1;}
  .sfoot .sscore{flex:none;font-size:11px;font-weight:800;border:1px solid var(--ink);border-radius:6px;
    padding:3px 9px;font-variant-numeric:tabular-nums;}
  .clabel{font-size:10.5px;fill:var(--faint);font-variant-numeric:tabular-nums;}
  .cnodata{padding:44px 0;text-align:center;color:var(--muted);}
  .cdates{display:flex;justify-content:space-between;font-size:10.5px;color:var(--faint);margin-top:3px;}
  /* W期切換:滿寬 segmented control(完稿) */
  .segs{display:flex;margin:16px 0 0;}
  .segrow{display:flex;gap:4px;background:#f4f6f8;border-radius:11px;padding:4px;flex:1;}
  .segrow button{flex:1;border:none;background:transparent;color:var(--muted);font-size:12.5px;font-weight:500;
    padding:7px 0;border-radius:8px;cursor:pointer;}
  .segrow button.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(16,20,24,.12);}
  /* 五條MA一排五格:白底細框,顏色只在數值,Status小標籤(完稿) */
  .macards{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:16px;}
  .mac{border:1px solid #e8eaee;border-radius:11px;padding:11px 6px 10px;text-align:center;
    display:flex;flex-direction:column;align-items:center;gap:5px;}
  .mac.crossed{border-color:var(--ink);border-width:1.5px;}
  .mac .macv{font-size:15px;font-weight:700;}
  .mac .macv.up{color:var(--up);} .mac .macv.dn{color:var(--dn);} .mac .macv.na{color:var(--faint);}
  .mac .macl{font-size:11px;color:var(--faint);}
  .mac .macs{font-size:10px;line-height:1;}
  .mac .macs.muted{color:#aab0b9;}
  .mac .macs.on{padding:2px 7px;border-radius:5px;font-weight:500;}
  .mac .macs.on.up{background:var(--upbg);color:var(--up);}
  .mac .macs.on.dn{background:var(--dnbg);color:var(--dn);}
  .sinterp{font-size:12.5px;color:var(--muted);margin-top:14px;line-height:1.5;}

  /* ── 手機 app 模式(加到主畫面用) ──
     桌面完全不受影響:底部分頁列只在窄螢幕出現,頂部分頁 & 面板切換則收起來。 */
  .tabbar{display:none;}
  @media(max-width:720px){
    .tabbar{
      display:flex;position:fixed;left:0;right:0;bottom:0;z-index:60;
      background:rgba(255,255,255,.93);
      -webkit-backdrop-filter:saturate(180%) blur(16px);backdrop-filter:saturate(180%) blur(16px);
      border-top:1px solid var(--line2);
      padding:5px 2px calc(3px + env(safe-area-inset-bottom));
    }
    .tabbar button{
      flex:1;border:none;background:none;cursor:pointer;padding:5px 0 3px;
      display:flex;flex-direction:column;align-items:center;gap:4px;
      color:var(--faint);font:500 10px/1 "Noto Sans TC",sans-serif;
      -webkit-tap-highlight-color:transparent;
    }
    /* 選中=墨色粗描邊粗體,未選=灰細描邊。不用底色膠囊,顏色留給MA點 & 漲跌(設計稿 1e) */
    .tabbar button svg{width:23px;height:23px;stroke-width:1.7;display:block;}
    .tabbar button.on{color:var(--ink);font-weight:700;}
    .tabbar button.on svg{stroke-width:2.3;}
    .tabbar button:active{opacity:.55;}
    /* Leverage那格掛Status點:不進Leverage頁也知道現在安不Safe */
    .tb-ic{position:relative;display:block;line-height:0;}
    .tb-dot{position:absolute;top:-1px;right:-3px;width:7px;height:7px;border-radius:50%;
      border:1.5px solid var(--card);background:var(--green);display:block;}
    .tb-dot.warn{background:var(--yellow);} .tb-dot.danger{background:var(--red);}
    /* 內容不要被底部列蓋住 */
    .wrap{padding-top:8px;padding-bottom:calc(78px + env(safe-area-inset-bottom));}
    /* 頂部的分頁列 & 面板切換已移到底部,收起來 */
    .tabs{display:none;}
    #panelToggle{display:none !important;}
    footer{display:none;}
    /* 標題列收成一行,不要折行吃掉半個螢幕 */
    header{padding:12px 15px 11px;align-items:center;}
    header h1{font-size:17px;white-space:nowrap;letter-spacing:-.01em;}
    .sub{font-size:10.5px;white-space:nowrap;}
    .shell{border-radius:16px;}
    /* 彈窗改成貼底的 sheet,留出底部列的高度 */
    .sheet{max-height:88vh;padding-bottom:calc(24px + env(safe-area-inset-bottom));}
  }
  /* 主畫面 app(standalone)時,Status列區域要自己撐開 */
  @media(display-mode:standalone){
    .wrap{padding-top:calc(8px + env(safe-area-inset-top));}
  }

  /* ══════ 手機版 redesign(依 2026-08-13 設計稿 1a–1e) ══════
     手機不再沿用桌面的三欄卡片,改成:
       · 頂部收成一張「脈搏卡」(VIX/NDX + Today + 一句摘要)
       · Ticker列壓到 56px,MA的 5/20/60/120/240 標籤移到表頭只印一次
       · 判讀句、Above n/5、P/E All移進點開的走勢彈窗
     桌面(>720px)完全不受影響。 */
  @media(max-width:720px){
    /* 頂部改成貼在畫面上,捲動時 VIX/NDX  & 訊號一直看得到 */
    .shell{background:none;border:none;border-radius:0;overflow:visible;margin-bottom:0;
      position:sticky;top:0;z-index:30;
      padding-top:calc(8px + env(safe-area-inset-top));
      background:linear-gradient(var(--bg) 82%,rgba(238,240,244,0));}
    header{background:none;border-bottom:none;padding:2px 4px 8px;}
    header h1{font-size:17px;font-weight:900;letter-spacing:-.01em;}
    .sub{font-size:10.5px;}
    .refresh{width:26px;height:26px;font-size:13px;}
    .refresh svg{width:13px;height:13px;}
    .wrap{padding-top:0;}

    /* 脈搏卡:訊號區在手機上收成一張白卡 */
    /* 脈搏卡 v2(設計稿 2a):VIX 升成 26px 大數字,NDX MAStatus獨立右欄,
       兩欄之間一條細分隔線,一眼分清兩個訊源。 */
    .topstrip .sig{background:var(--card);border:1px solid var(--line2);border-radius:16px;
      padding:13px 14px 12px;margin-bottom:0;box-shadow:0 1px 2px rgba(16,20,24,.05);}
    .p2-top{display:flex;align-items:stretch;}
    .p2-l{flex:none;width:96px;}
    .p2-r{flex:1;min-width:0;}
    .p2-div{flex:none;width:1px;background:var(--line);margin:1px 11px;}
    .p2-lbl{font-size:10.5px;color:var(--muted);font-weight:600;}
    .p2-v{display:flex;align-items:baseline;gap:7px;margin-top:3px;}
    .p2-v b{font-family:var(--num);font-size:26px;font-weight:800;letter-spacing:-.02em;
      line-height:1;font-variant-numeric:tabular-nums;}
    .p2-v2{display:flex;align-items:center;gap:7px;margin-top:3px;white-space:nowrap;min-width:0;}
    /* 更窄的機身(iPhone SE/mini)文字先讓步,Status籤不能被切掉 */
    .p2-v2 b{font-size:15px;font-weight:800;letter-spacing:-.01em;min-width:0;
      overflow:hidden;text-overflow:ellipsis;}
    .p2-v2 .p2-chip{flex:none;}
    .p2-chip{font-size:10.5px;font-weight:700;border-radius:6px;padding:2px 8px;white-space:nowrap;}
    .p2-chip.up{color:var(--up);background:var(--upbg);}
    .p2-chip.warn{color:var(--nearink);background:var(--nearbg);}
    .p2-chip.dn{color:var(--dn);background:var(--dnbg);}
    /* 訊號列:三顆最關鍵的 chip 留在首行,Near併進「More」 */
    .sigsum{gap:6px;flex-wrap:nowrap;margin-top:12px;padding-top:11px;
      border-top:1px solid var(--line);white-space:nowrap;}
    .sigchips{display:contents;}
    .sigsum .sigt{font-size:12.5px;font-weight:700;flex:none;}
    .sc{font-size:12px;padding:3px 10px;border-radius:20px;flex:none;border:1px solid var(--line);
      color:var(--muted);}
    .sc b{color:var(--ink);}
    .sc.on{color:var(--add);background:var(--addbg);border-color:#dbe6ff;font-weight:700;}
    .sigacts{gap:9px;flex:none;margin-left:auto;}
    .sigmore{font-size:10.5px;color:var(--faint);}
    .sighl{font-size:11.5px;margin-top:8px;line-height:1.55;}

    /* 篩選 chip 列 */
    .filterbar{gap:6px;margin:9px 0 0;padding:0 2px 9px;flex-wrap:nowrap;
      overflow-x:auto;scrollbar-width:none;}
    .filterbar::-webkit-scrollbar{display:none;}
    .filterbar .fbtn{font-size:11.5px;padding:3px 11px;flex:none;}

    /* ── Ticker清單(手機專用結構) ── */
    .blk{margin-bottom:0;}
    .blk h2{display:none;}                 /* 分區標題改印在清單卡內 */
    .mlist{background:var(--card);border:1px solid var(--line2);border-radius:16px;
      padding:0 14px 4px;box-shadow:0 1px 2px rgba(16,20,24,.05);margin-bottom:10px;}
    .mhead{display:flex;align-items:center;gap:10px;padding:10px 0 7px;
      border-bottom:1px solid var(--line2);}
    .mhead .mh-t{flex:1;font-size:10px;letter-spacing:.06em;color:var(--faint);font-weight:600;}
    .mhead .mh-yr{flex:none;width:52px;text-align:right;font-size:9px;letter-spacing:.05em;
      color:var(--faint);font-weight:600;}
    .mdots{display:flex;gap:9px;flex:none;}
    .mhead .mdots i{width:13px;text-align:center;font-size:8.5px;color:var(--faint);
      font-weight:600;font-family:var(--num);font-style:normal;}
    .mgrp{font-size:11px;font-weight:700;color:var(--muted);padding:9px 0 2px;}
    .mline{display:flex;align-items:center;gap:10px;padding:10px 0;
      border-bottom:1px solid var(--line);cursor:pointer;}
    .mline:last-child{border-bottom:none;}
    .mline:active{background:#fafbfc;}
    .mrow-id{flex:1;min-width:0;}
    /* 行高壓到 1.2,兩行加上下 padding 剛好 56px(設計稿 1b) */
    .mrow-t{display:flex;align-items:center;gap:6px;min-width:0;line-height:1.2;}
    .mrow-t b{font-size:14.5px;font-weight:700;color:var(--ink);}
    .mrow-sub{font-size:9.5px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;
      white-space:nowrap;}
    .mrow-p{display:flex;align-items:baseline;gap:7px;margin-top:2px;line-height:1.2;}
    .mrow-p .px{font-family:var(--num);font-weight:600;font-size:12.5px;color:#3f4652;
      font-variant-numeric:tabular-nums;}
    .mrow-p .chg{font-size:11px;font-weight:600;}
    .mrow-p .chg.up{color:var(--up);} .mrow-p .chg.dn{color:var(--dn);}
    .mrow-yr{flex:none;width:52px;text-align:right;font-family:var(--num);font-weight:700;
      font-size:12px;font-variant-numeric:tabular-nums;}
    .mrow-yr.up{color:var(--up);} .mrow-yr.dn{color:var(--dn);} .mrow-yr.na{color:var(--faint);}
    /* MA點:13px,Above=實心綠加光暈,Below=空心紅環,no data=空心灰 */
    .mline .mdots i{width:13px;height:13px;border-radius:50%;box-sizing:border-box;display:block;}
    .mline .mdots i.up{background:var(--dot-up);box-shadow:0 0 0 3px rgba(18,166,112,.14);}
    .mline .mdots i.dn{background:var(--card);border:2.5px solid var(--dot-dn);}
    .mline .mdots i.na{background:var(--card);border:2.5px solid var(--dot-na);}
    /* 列上的小籤 */
    .mtag{font-size:9px;font-weight:700;border-radius:5px;padding:1px 6px;flex:none;}
    .mtag.add{color:var(--add);background:var(--addbg);}
    .mtag.cut{color:var(--dn);background:var(--dnbg);}
    .mtag.lev{color:#9a3412;background:#ffedd5;border:1px solid #fdba74;padding:0 5px;}
    /* 清單底下的圖例 */
    .mlegend{display:flex;gap:14px;align-items:center;flex-wrap:wrap;
      font-size:11px;color:var(--muted);padding:2px 4px 4px;}
    .mlegend span{display:inline-flex;align-items:center;gap:6px;}
    .mlegend i{width:11px;height:11px;border-radius:50%;box-sizing:border-box;display:block;}
    .mlegend i.up{background:var(--dot-up);}
    .mlegend i.dn{background:var(--card);border:2.5px solid var(--dot-dn);}
    .mlegend i.na{background:var(--card);border:2.5px solid var(--dot-na);}
    .mempty{padding:26px 0;text-align:center;color:var(--faint);font-size:12.5px;}

    /* ── 走勢彈窗(設計稿 1c) ── */
    .sheet{padding:8px 16px calc(30px + env(safe-area-inset-bottom));border-radius:18px 18px 0 0;}
    .grab{width:36px;height:4px;border-radius:2px;background:var(--line2);margin:0 auto 10px;}
    .mshead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
    .mshead .t{display:flex;align-items:center;gap:8px;}
    .mshead .t b{font-family:var(--num);font-size:19px;font-weight:800;letter-spacing:-.01em;}
    .mshead>div:first-child{min-width:0;}
    .mshead .sub{font-size:11.5px;color:var(--faint);margin-top:4px;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .mshead .rt{display:flex;align-items:flex-start;gap:10px;flex:none;}
    .mshead .chg{white-space:nowrap;}
    .mshead .px{font-family:var(--num);font-size:24px;font-weight:800;letter-spacing:-.02em;
      font-variant-numeric:tabular-nums;line-height:1;}
    .mshead .chg{font-family:var(--num);font-size:11.5px;margin-top:4px;}
    .mshead .chg.up{color:var(--up);} .mshead .chg.dn{color:var(--dn);}
    .mshead .sclose{width:28px;height:28px;font-size:12px;}
    .mtrend{font-size:10.5px;font-weight:500;border-radius:6px;padding:2px 7px;}
    .mtrend.up{background:var(--upbg);color:var(--up);}
    .mtrend.dn{background:var(--dnbg);color:var(--dn);}
    /* Bought摘要 & 明細 */
    .mbuy-sum{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);
      border:1px solid var(--line);border-radius:6px;padding:3px 9px;margin-top:10px;
      font-variant-numeric:tabular-nums;}
    .mbuy-sum i{width:6px;height:6px;border-radius:50%;background:#dc2626;flex:none;}
    .mbuy-sum b{color:var(--ink);font-weight:800;}
    .mbuy-sum b.up{color:var(--up);} .mbuy-sum b.dn{color:var(--dn);}
    .mbuy-list{margin-top:8px;border-top:1px dashed var(--line);}
    .mbrow{display:flex;align-items:center;gap:8px;padding:7px 0;font-size:11.5px;
      border-bottom:1px solid var(--line);}
    .mbrow:last-child{border-bottom:none;}
    .mbrow i{width:6px;height:6px;border-radius:50%;background:#dc2626;flex:none;}
    .mbrow .d{color:var(--muted);font-family:var(--num);}
    .mbrow .p{margin-left:auto;font-family:var(--num);font-weight:700;font-variant-numeric:tabular-nums;}
    .mbrow .q{color:var(--faint);width:44px;text-align:right;}
    /* MA格:顯示MAPrice,Status用小籤 */
    .mmacards{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:12px;}
    .mmac{border:1px solid #e8eaee;border-radius:11px;padding:9px 4px;text-align:center;
      display:flex;flex-direction:column;gap:4px;align-items:center;}
    .mmac .l{font-size:10.5px;color:var(--faint);}
    .mmac .v{font-family:var(--num);font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;}
    .mmac .v.up{color:var(--up);} .mmac .v.dn{color:var(--dn);} .mmac .v.na{color:var(--faint);}
    .mmac .s{font-size:9.5px;border-radius:5px;padding:2px 6px;}
    .mmac .s.up{background:var(--upbg);color:var(--up);}
    .mmac .s.dn{background:var(--dnbg);color:var(--dn);}
    .mmac .s.na{color:var(--faint);}
    .msfoot{display:flex;align-items:center;gap:10px;margin-top:13px;}
    .msfoot .ip{flex:1;font-size:12.5px;color:var(--muted);line-height:1.5;}
    .msfoot .sc5{flex:none;font-size:11px;font-weight:800;border:1px solid var(--ink);
      border-radius:6px;padding:3px 9px;font-family:var(--num);}

    /* ── Leverage Risk頁 v2(設計稿 1a):順序改成 ①Total Exposure ②Loan Ratio ③Headroom ④持倉配置。
       字級收成四階(54/22/13/10.5),每張卡只有一個大數字。 ── */
    #riskPanel{gap:10px;}
    .rkm{background:var(--card);border:1px solid var(--line2);border-radius:16px;padding:14px;
      box-shadow:0 1px 2px rgba(16,20,24,.05);}
    .rkm.hero{padding:16px 14px 14px;}
    .rkm-top{display:flex;align-items:center;gap:8px;}
    .rkm-top .t{font-size:13px;font-weight:700;color:var(--muted);}

/* ---------- helpers ---------- */
function maByK(r,k){ return (r&&r.mas)?r.mas.find(m=>m.k===k):null; }
function dotCls(m){ if(!m||m.v==null) return "na"; return m.above?"up":"dn"; }
function dotsHtml(r){
  return [5,20,60,120,240].map(k=>{
    const m=maByK(r,k); const lbl=({5:"5",20:"20",60:"60",120:"120",240:"240"})[k];
    return `<span class="dot ${dotCls(m)}"><i></i>${lbl}</span>`;
  }).join("");
}
function yrHtml(r){
  const m=maByK(r,240);
  if(!m||m.v==null) return `<span class="yr na">—</span>`;
  const cls=m.above?"up":"dn", s=m.diff>=0?"+":"";
  return `<span class="yr ${cls}">${s}${m.diff.toFixed(1)}%</span>`;
}

/* ---------- 中文解讀（移植舊版邏輯，原封不動） ---------- */
function interpret(r){
  const m=r.mas; if(!m||r.valid===0) return "";

  const a5=a(5),a20=a(20),a60=a(60),a120=a(120),a240=a(240);
  const all=[a5,a20,a60,a120,a240].filter(x=>x!==null);

    if(a120===true) return "Under the 60MA but holding the 120MA.";

  return "Short history, the 240MA has not formed yet.";
}

// Market紅綠燈邏輯（只看 NDX 60/240MA  &  VIX）：回傳 {level,msg,why} 供Market分頁紅綠燈卡使用
function macroLevel(){
  const ndx=DATA["^NDX"], vix=DATA["^VIX"];
  const a=k=>{ const m=maByK(ndx,k); return (m&&m.v!=null)?m.above:null; };
  const a60=a(60), a240=a(240);
  const vixVal=(vix&&!vix.error&&vix.price!=null)?vix.price:null;
  const vixMissing=vixVal==null;
  const vixHigh=vixVal!=null&&vixVal>30;
  const ndxTag=(ndx&&ndx.fallback)?`(showing ${ndx.src})`:"";
  const vixNote=vixMissing?"(VIX no data)":"";
  let level,msg,why;
  if(vixHigh){ level="red"; msg="De-risk";
    why=`VIX ${vixVal.toFixed(1)} > 30`+(a240===false?" and NDX below the 240MA":""); }
  else if(a240===null){ level="gray"; msg="No data"; why=`NDX 240MA has not formed yet ${vixNote}`; }
  else if(a240===false){ level="red"; msg="De-risk"; why=`NDX Below240MA 240MA ${ndxTag} ${vixNote}`; }
  else if(a60===null){ level="gray"; msg="No data"; why=`NDX not enough data for the 60MA ${vixNote}`; }
  else if(a60===true){ level="green"; msg="Leverage OK"; why=`NDX above the 60MA and the 240MA ${ndxTag} ${vixNote}`; }
  else { level="yellow"; msg="Hold"; why=`NDX above the 240MA but under the 60MA 60MA ${ndxTag} ${vixNote}`; }
  why=why.replace(/\s+/g," ").trim();
  return {level,msg,why};
}

function allTracked(){ return [...(WL.market_holdings||[]), ...(WL.holdings||[]), ...(WL.watch||[])]; }

function crossSignals(){
  const bull=[], bear=[];
  allTracked().forEach(h=>{

    r.mas.forEach(m=>{ if(m.cross==="bull") bull.push({s:h.s,l:m.label});
                       else if(m.cross==="bear") bear.push({s:h.s,l:m.label}); });

  return {bull,bear};

function nearSignals(){

  const NM={60:"60MA",120:"120MA",240:"240MA"};
  allTracked().forEach(h=>{
    const r=DATA[h.s]; if(!r||r.error||!r.mas) return;

      arr.push({s:h.s,lbl:NM[m.k]}); });

}
// 訊號區的Ticker名:省略「(持)」文字,持有 & Watch改用深淺區分,滑過有 title
function symPlain(s){

// 合併同一Ticker的多條MA,並省略重複的「線」字(5MA+20MA → W/M)

/* Add訊號:持有部位Below60MA/120MA/240MA就是Add點,跌得越深訊號越強。
   只看持有的部位(Market + Stocks),Watchlist還沒進場不談Add。 */
const ADD_LV={60:{n:1,lbl:"60MA"},120:{n:2,lbl:"120MA"},240:{n:3,lbl:"240MA"}};
// 單一Ticker的Add判定,給卡片標記用(未持有回傳 null)
function addLevelOf(sym){
  const held=(WL.market_holdings||[]).some(h=>h.s===sym);   // Add and Trim only apply to Market holdings, not Stocks
  if(!held) return null;
  const r=DATA[sym];
  if(!r||r.error||!r.mas) return null;
  let best=null;
  [60,120,240].forEach(k=>{
    const m=maByK(r,k);
    if(!m||m.v==null||m.above) return;
    if(!best||ADD_LV[k].n>best.lv) best={k,lv:ADD_LV[k].n,lbl:ADD_LV[k].lbl,diff:m.diff};
  });
  return best;
}
function addBadgeFor(sym){
  const a=addLevelOf(sym);
  return a?`<span class="addbadge" title="Below${a.lbl} ${a.diff.toFixed(1)}%">Add ${"●".repeat(a.lv)}</span>`:"";
}

/* Trim訊號:Add的鏡像。要求「Above所有MA」(趨勢還在)且240MA乖To 拉開,
   漲多了才減。已經回檔BelowMA的不算Trim,那是Add區。
   門檻依 2026-08 持sh乖To 分布設定,要調整改這裡。 */
const CUT_TH=[{d:80,n:3},{d:60,n:2},{d:40,n:1}];
function cutLevelOf(sym){
  const held=(WL.market_holdings||[]).some(h=>h.s===sym);   // Add and Trim only apply to Market holdings, not Stocks
  if(!held) return null;
  const r=DATA[sym];
  if(!r||r.error||!r.mas||r.valid===0) return null;
  if(r.score!==r.valid) return null;                 // not above every MA, so not a Trim
  const m=maByK(r,240);
  if(!m||m.v==null) return null;
  const hit=CUT_TH.find(t=>m.diff>=t.d);
  return hit?{lv:hit.n,diff:m.diff,th:hit.d}:null;
}
function cutBadgeFor(sym){
  const c=cutLevelOf(sym);
  return c?`<span class="cutbadge" title="Above every MA, +${c.diff.toFixed(1)}% over the 240MA">Trim ${"●".repeat(c.lv)}</span>`:"";
}
function cutSignals(){
  const held=(WL.market_holdings||[]);   // Add and Trim only apply to Market holdings, not Stocks
  return held.map(h=>{
    const c=cutLevelOf(h.s);
    return c?{s:h.s,dn:h.dn||h.s,...c}:null;
  }).filter(Boolean).sort((a,b)=>b.lv-a.lv||b.diff-a.diff);
}
function cutSignalsHtml(){
  const list=cutSignals();
  if(!list.length) return "";
  const txt=list.map(x=>
    `<span class="cutit"><b>${x.dn}</b> 240MA +${x.diff.toFixed(0)}%<span class="lv">${"●".repeat(x.lv)}</span></span>`
  ).join("");
  return `<div class="sigrow addrow"><span class="tag c">Trim ⤒</span><span class="sigtxt">${txt}</span></div>`;
}
function addSignals(){
  const held=(WL.market_holdings||[]);   // Add and Trim only apply to Market holdings, not Stocks
  const out=[];
  held.forEach(h=>{
    const r=DATA[h.s];
    if(!r||r.error||!r.mas) return;
    let best=null;
    [60,120,240].forEach(k=>{
      const m=maByK(r,k);
      if(!m||m.v==null||m.above) return;              // already above it, so not an Add
      if(!best||ADD_LV[k].n>best.lv) best={k,lv:ADD_LV[k].n,lbl:ADD_LV[k].lbl,diff:m.diff};
    });
    if(best) out.push({s:h.s,dn:h.dn||h.s,...best});
  });
  return out.sort((a,b)=>b.lv-a.lv||a.diff-b.diff);   // strongest signal first, then deepest drop within the same level
}
function addSignalsHtml(){
  const list=addSignals();
  if(!list.length) return "";
  const txt=list.map(x=>
    `<span class="addit"><b>${x.dn}</b> Below${x.lbl}<span class="lv">${"●".repeat(x.lv)}</span></span>`
  ).join("");
  return `<div class="sigrow addrow"><span class="tag a">Add ⤓</span><span class="sigtxt">${txt}</span></div>`;
}

/* NDX 相對 60/240 MA的短句,給手機脈搏卡用(設計稿 2a:「Above 60MA·240MA」) */
function ndxMaText(){
  const ndx=DATA["^NDX"];
  const a=k=>{ const m=maByK(ndx,k); return (m&&m.v!=null)?m.above:null; };
  const up=[], dn=[];
  [[60,"60MA"],[240,"240MA"]].forEach(([k,lbl])=>{
    const v=a(k); if(v===true) up.push(lbl); else if(v===false) dn.push(lbl);
  });
  if(!up.length&&!dn.length) return "No data";
  // 兩條同方向時併寫成「Above 60·240MA」,窄機身才放得下右邊的Status籤
  const fold=arr=>arr.length===2?arr.map(s=>s.replace("MA","")).join("·"):arr.join("·");
  const parts=[];
  if(up.length) parts.push("Above "+fold(up));
  if(dn.length) parts.push("Below "+fold(dn));
  return parts.join(" · ");
}
/* 手機脈搏卡的上半段:左 VIX 大數字 / 右 NDX MAStatus(設計稿 2a) */
function mPulseTop(){
  const v=DATA["^VIX"];
  let val="—", txt="", kind="up";
  if(v&&!v.error&&v.price!=null){
    const p=v.price; val=p.toFixed(1);
    if(p>30){txt="Alert";kind="dn";}
    else if(p>=20){txt="Elevated";kind="warn";}
    else {txt="Calm";kind="up";}
  }
  const {level,msg}=macroLevel();
  const nk={green:"up",yellow:"warn",red:"dn",gray:"warn"}[level]||"warn";
  return `<div class="p2-top">
    <div class="p2-l"><div class="p2-lbl">VIX Fear Index</div>
      <div class="p2-v"><b>${val}</b>${txt?`<span class="p2-chip ${kind}">${txt}</span>`:""}</div></div>
    <div class="p2-div"></div>
    <div class="p2-r"><div class="p2-lbl">NDX vs MAs</div>
      <div class="p2-v2"><b>${ndxMaText()}</b><span class="p2-chip ${nk}">${msg}</span></div></div>
  </div>`;
}

function signalsHtml(){
  const {bull,bear}=crossSignals();
  const near=nearSignals();
  const add=addSignals(), cut=cutSignals();
  const bullM=mergeSym(bull), bearM=mergeSym(bear), nearM=mergeNear(near);

  const chip=(lbl,n,strong)=>n?`<span class="sc${strong?" on":""}">${lbl} ${n}</span>`:"";
  const chips=chip("Add",add.length,1)+chip("Trim",cut.length,1)
    +chip("Above",bullM.length)+chip("Below",bearM.length)+chip("Near",nearM.length);

  // 摘要句:Add最強兩 + Trim最強一
  const parts=[];
  if(add.length){
    parts.push("Strongest: "+add.slice(0,2).map(x=>
      `<b>${x.dn}</b> Below${x.lbl} ${x.diff.toFixed(1)}%`).join(", "));
  }
  if(cut.length){
    parts.push("Trim: "+cut.slice(0,1).map(x=>`<b>${x.dn}</b> over the 240MA +${x.diff.toFixed(0)}%`).join(", "));
  }
  const headline=parts.length?`<div class="sighl">${parts.join(" · ")}</div>`:"";
  const none=(!add.length&&!cut.length&&!bullM.length&&!bearM.length&&!nearM.length);

  const row=(cls,lbl,txt)=>txt?`<div class="sigrow"><span class="tag ${cls}">${lbl}</span><span class="sigtxt">${txt}</span></div>`:"";
  const full=none?`<div class="noneline">No signals today</div>`:
      addSignalsHtml()+cutSignalsHtml()
      +((add.length||cut.length)&&(bullM.length||bearM.length||nearM.length)?`<div class="sigdiv"></div>`:"")
      +row("b","Above ↑",bullM.join(", "))
      +row("s","Below ↓",bearM.join(", "))
      +row("n","Near ≈",nearM.join(", "));

  // 手機:上半段換成兩欄大數字,訊號列只留Add/Above/Below三顆(Near併進More,設計稿 2a)
  const mob=isMobile();
  const chipsM=chip("Add",add.length,1)+chip("Above",bullM.length)+chip("Below",bearM.length);
  return `<div class="sig">
    ${mob?mPulseTop():vixNdxLine()}
    <div class="sigsum">
      <span class="sigt">Today</span><span class="sigchips">${mob?chipsM:chips}</span>
      <span class="sigacts">
        <button class="sigmore" id="rulesToggle">${isMobile()?"Rules":"Rules ↗"}</button>
        <button class="sigmore" id="sigToggle" aria-expanded="${SIGOPEN}">${
          SIGOPEN?"Less ▴":(isMobile()?"More ▾":"Show all ▾")}</button>
      </span>
    </div>
    ${SIGOPEN?"":headline}
    <div class="sigfull"${SIGOPEN?"":" hidden"}>${full}</div>
  </div>`;
}

/* ---------- 清單（Stocks / Watch通用） ---------- */
// Stocks/Watchlist的分類:bull=AboveAllMA、bear=AllBelow、na=no data或MA未成形
function trendOf(sym){
  const r=DATA[sym];
  if(!r||r.error||r.valid===0) return "na";
  if(r.score===r.valid && r.valid>0) return "bull";
  if(r.score===0) return "bear";
  return "mid";
}
// now的篩選Status(依分頁各自記憶):all=All
const FILTER={ stocks:"all", watch:"all", macro:"all" };
function summaryHtml(list, pane){
  let bull=0, bear=0;
  list.forEach(h=>{ const t=trendOf(h.s); if(t==="bull") bull++; else if(t==="bear") bear++; });
  const cur=FILTER[pane]||"all";
  const btn=(kind,label,n)=>
    `<button class="fbtn ${kind}${cur===kind?" on":""}" data-filter="${kind}" data-pane="${pane}"
       aria-pressed="${cur===kind}">${label}<span class="fn">${n}</span></button>`;
  return `<div class="filterbar" role="group" aria-label="Filter">
    ${btn("all","All",list.length)}
    ${btn("bull","Bullish",bull)}
    ${btn("bear","Bearish",bear)}
  </div>`;
}
// 依now篩選取子集
function applyFilter(list, pane){
  const f=FILTER[pane]||"all";
  return f==="all"?list:list.filter(h=>trendOf(h.s)===f);
}
const FILTER_LBL={ bull:"Bullish", bear:"Bearish" };
function detailHtml(r){
  const rows=[5,20,60,120,240].map(k=>{
    const m=maByK(r,k);
    if(!m||m.v==null) return `<div class="mrow"><div class="ml">${({5:'5MA 5',20:'20MA 20',60:'60MA 60',120:'120MA 120',240:'240MA 240'})[k]}MA</div><div class="mv">—</div></div>`;
    const cls=m.above?"up":"dn", s=m.diff>=0?"+":"";
    const v=m.v.toLocaleString(undefined,{maximumFractionDigits:2});
    return `<div class="mrow ${cls}"><div class="ml">${({5:'5MA 5',20:'20MA 20',60:'60MA 60',120:'120MA 120',240:'240MA 240'})[k]}MA</div>
      <div class="mv">${v}</div><div class="md">${m.above?'Above':'Below'} ${s}${m.diff.toFixed(1)}%</div></div>`;
  }).join("");
  return rows;
}
function stockRow(sym, group, note, dn){
  const r=DATA[sym];
  const main = dn || sym;
  // 內建Leverage產品(2x/3x)在清單列也掛警示, & 大卡同一套 levtag
  const we=(typeof wlEntry==="function")?wlEntry(sym):{};
  const lev=Number(we.lev||1);
  const levTag=lev>1?`<span class="levtag">${lev}x</span>`:"";
  // 左側小字:分類/備註 + P/E(有才顯示),併成一行
  const metaTxt=[(group||note||""), (r&&r.pe!=null)?`P/E ${r.pe}`:""].filter(Boolean).join(" · ");
  const idHtml=`<div class="id"><span class="sym">${main}</span>${levTag}${metaTxt?`<span class="grp">${metaTxt}</span>`:""}</div>`;
  if(!r||r.error){
    return `<div class="row err"><div class="head">${idHtml}<span class="nd">${(r&&r.error)||"no data"}</span></div></div>`;
  }
  const pxTxt=(r.price!=null)?r.price.toLocaleString(undefined,{maximumFractionDigits:2}):"—";
  const ip=interpret(r);
  const ipHtml=ip?`<div class="rowip">↳ ${ip}</div>`:"";
  return `<div class="row" data-sym="${sym}">
    <div class="head">
      ${idHtml}
      <div class="rt">
        <div class="px">${pxTxt}</div>
        <div class="sub">${yrHtml(r)}<span class="sc">${r.score}/${r.valid}</span><span class="caret">▾</span></div>
      </div>
      <div class="dots">${dotsHtml(r)}</div>
    </div>
    <div class="detail">${ipHtml}${detailHtml(r)}</div>
  </div>`;
}

/* ---------- EarningsTime表分頁 ---------- */
function renderEarnings(){
  const list=(DATA._earnings||[]);
  const el=document.getElementById("earnings");
  if(!list.length){
    el.innerHTML=`<div class="blk"><div class="nd" style="padding:16px 4px">No earnings dates yet.</div></div>`;
    return;
  }
  // 以本地日期零點為基準算距today數
  const today=new Date(); today.setHours(0,0,0,0);
  const dn=s=>{ const e=wlEntry(s); return e.dn||s; };
  const fmtDate=dt=>`${dt.getMonth()+1}/${dt.getDate()}`;
  const wk=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  // 點擊Stocks → 開 Yahoo 奇摩sh市該sh「news」頁(繁體Earnings分析/法人評等/市場評論)。
  // Ticker is used as-is in the news link.
  const zhUrl=s=>`https://tw.stock.yahoo.com/quote/${s}/news`;
  // 依日期分組:同一天的sh票合併成一張卡
  const byDate=new Map();
  list.forEach(e=>{
    if(!byDate.has(e.date)) byDate.set(e.date, []);
    byDate.get(e.date).push(e);
  });
  const groups=[...byDate.entries()].map(([date,items])=>{
    const dt=new Date(date+"T00:00:00");
    return {date, dt, days:Math.round((dt-today)/864e5), items};
  });
  const upcoming=groups.filter(g=>g.days>=0).sort((a,b)=>a.dt-b.dt);
  const past=groups.filter(g=>g.days<0).sort((a,b)=>b.dt-a.dt);  // most recent first
  const cardHtml=g=>{
    let badge;
    if(g.days<0){ badge=`<span class="ebadge past">${-g.days} d ago</span>`; }
    else if(g.days===0){ badge=`<span class="ebadge today">today</span>`; }
    else if(g.days<=7){ badge=`<span class="ebadge soon">${g.days} d</span>`; }
    else { badge=`<span class="ebadge">${g.days} d</span>`; }
    const est=g.items.some(x=>x.est)?`<span class="eest">est.</span>`:"";
    const chips=g.items.map(x=>`<a class="echip" href="${zhUrl(x.s)}" target="_blank" rel="noopener">${dn(x.s)}<span class="ecode">${x.s}</span><span class="elink">↗</span></a>`).join("");
    return `<div class="ecard">
      <div class="ecard-top">
        <div class="edate"><b>${fmtDate(g.dt)}</b><span>${wk[g.dt.getDay()]}</span></div>
        <div class="emeta">${est}${badge}</div>
      </div>
      <div class="echips">${chips}</div>
    </div>`;
  };
  let html="";
  if(upcoming.length){
    html+=`<div class="blk"><h2>Upcoming</h2>${upcoming.map(cardHtml).join("")}</div>`;
  }
  if(past.length){
    html+=`<div class="blk"><h2>Recent</h2>${past.map(cardHtml).join("")}</div>`;
  }
  el.innerHTML=html;
}

/* ==========================================================
   Leverage Risk面板:資料來自本機 leverage-data.js(window.MANUAL_SNAPSHOTS)。
   計算式移植自 ib-leverage-dashboard/public/app.js,單一真相同一套。
   ========================================================== */
const RK_LIMIT={safeMax:.2, watchMax:.5};
const RK_SEG={"SPY":"#12a670","QQQ":"#e07a2e","IWM":"#2563eb","GLD":"#dfa32e","TQQQ":"#d6679f"};
const RK_FB=["#8b5cf6","#0891b2","#65a30d","#db2777","#ea580c"];
function rkSnaps(){ return Array.isArray(window.MANUAL_SNAPSHOTS)?window.MANUAL_SNAPSHOTS:[]; }
function rkHas(){ return rkSnaps().length>0; }
function rkNorm(s){
  const net=+s.net_liquidation||0;
  const settled=+(s.settled_cash ?? s.total_cash_value ?? 0);
  const cash=+(s.cash_value ?? settled);
  const gross=+(s.gross_position_value ?? Math.max(net-Math.max(cash,0),0));
  const loan=+(s.margin_loan ?? Math.max(-cash, gross-net, 0));
  return {...s, net, cash, gross, loan,
    exposureRatio: net>0?gross/net:null, borrowRatio: net>0?loan/net:null};
}
function rkExpo(s){
  let boost=0; (s.holdings||[]).forEach(h=>{ const mv=+h.market_value||0, lev=+h.leverage||1;
    if(lev>1) boost+=Math.max(mv*(lev-1),0); });
  const eff=s.gross+boost;
  return {book:s.gross, boost, eff,
    effRatio:s.net>0?eff/s.net:null, bookRatio:s.net>0?s.gross/s.net:null, boostRatio:s.net>0?boost/s.net:null};
}
function rkStress(s){
  const gross=s.gross, mm=+s.maintenance_margin||0, el=+s.excess_liquidity||0, net=s.net, loan=Math.max(s.loan,0);
  return {
    marginCallDrop: gross>mm&&el>0 ? el/(gross-mm) : null,        // To margin call
    breachDrop: loan>0&&gross>0 ? (net-loan/RK_LIMIT.safeMax)/gross : null, // hits the 20% alert line
    cushionRatio: net>0 ? el/net : null,                         // Liquidation buffer
    cashBuffer: net>0 ? s.cash/net : null,                       // Cash buffer
  };
}
function rkMoney(v,cur){ if(v==null||isNaN(+v)) return "—";
  return (+v).toLocaleString(undefined,{maximumFractionDigits:0})+(cur?" "+cur:""); }
function rkPct(v){ return v==null||isNaN(+v)?"—":(v*100).toFixed(0)+"%"; }
function rkRel(t){
  const d=new Date((t||"").replace(" ","T")); if(isNaN(d)) return t||"";
  const min=Math.max(Math.floor((Date.now()-d.getTime())/6e4),0);
  if(min<1) return "now"; if(min<60) return min+" m ago";
  const h=Math.floor(min/60); if(h<24) return h+" h ago"; return Math.floor(h/24)+" d ago";
}
function rkBadge(kind){ return {safe:"rk-safe",watch:"rk-watch",danger:"rk-danger"}[kind]||"rk-safe"; }
function rkBorrowKind(r){ if(r==null) return "safe"; return r<=RK_LIMIT.safeMax?"safe":r<=RK_LIMIT.watchMax?"watch":"danger"; }

function renderRisk(){
  const el=document.getElementById("riskPanel");
  const snaps=rkSnaps();
  if(!snaps.length){ el.innerHTML=`<div class="rk-card">No leverage data loaded.</div>`; return; }
  const s=rkNorm(snaps[0]);
  const cur=s.currency||"EUR";
  const expo=rkExpo(s), st=rkStress(s);
  const bk=rkBorrowKind(s.borrowRatio);
  const bLbl={safe:"Safe",watch:"Watch",danger:"Danger"}[bk];
  // 借款量表:0 ~ 50%(gaugeMax)為滿刻度,safe line 20%
  const gMax=RK_LIMIT.watchMax;
  const fillPct=Math.min((s.borrowRatio||0)/gMax*100,100);
  const safeStop=RK_LIMIT.safeMax/gMax*100;
  const safeAmt=s.net*RK_LIMIT.safeMax, safeRoom=safeAmt-Math.max(s.loan,0);
  // Exposure Mix:各Positions占持倉總Value
  const H=(s.holdings||[]).filter(h=>(+h.market_value||0)>0);
  const totMv=H.reduce((a,h)=>a+(+h.market_value||0),0)||1;
  const segColor=(name,i)=>RK_SEG[String(name||"").toUpperCase()]||RK_FB[i%RK_FB.length];
  const segs=H.map((h,i)=>{ const mv=+h.market_value||0, w=mv/totMv*100;
    const lbl=w>=9?`${h.name} ${Math.round(w)}%`:"";
    return `<div class="seg" style="width:${w}%;background:${segColor(h.name,i)}">${lbl}</div>`; }).join("");
  // ── 手機版(設計稿 1d):第一屏只回答「To 追繳多遠」,曝險 & 持倉往下擺 ──
  if(isMobile()){
    const barCol={safe:"var(--dot-up)",watch:"var(--yellow)",danger:"var(--red)"};
    const kindOf=(v,good,warn)=> v==null?"safe":(v>=good?"safe":v>=warn?"watch":"danger");
    const mcKind=kindOf(st.marginCallDrop,.5,.25);
    const bcKind=kindOf(st.breachDrop,.5,.25);
    const pctW=v=>Math.max(Math.min((v||0)*100,100),0);
    // 列表按權重由大到小(設計稿 ④),堆疊條維持原順序才對得上顏色
    const holdRows=H.map((h,i)=>({h,i}))
      .sort((a,b)=>(+b.h.market_value||0)-(+a.h.market_value||0))
      .map(({h,i})=>{ const mv=+h.market_value||0, lev=+h.leverage||1;
        const levTag=lev>1?`<span class="mtag lev">${lev}x</span>`:`<span class="g">${h.ticker||""}</span>`;
        return `<div class="rkm-hold"><i style="background:${segColor(h.name,i)}"></i>
          <span class="n">${h.name}</span>${levTag}
          <span class="p">${(mv/totMv*100).toFixed(0)}%</span>
          <span class="m">${rkMoney(mv*lev,"")}</span></div>`; }).join("");
    // 敞口量表刻度 1.0x–3.0x:Safe 1.0–2.0(50%)、Watch 2.0–2.5(25%)、Danger 2.5 以上
    const EXPO_MIN=1, EXPO_MAX=3;
    const expoPct=(expo.effRatio!=null)
      ? Math.max(Math.min((expo.effRatio-EXPO_MIN)/(EXPO_MAX-EXPO_MIN)*100,100),0) : 0;
    const effTxt=(expo.effRatio!=null)?expo.effRatio.toFixed(1):"—";
    el.innerHTML=`
      <div class="rkm hero">
        <div class="rkm-top"><span class="t">Total Exposure</span>
          <span class="rkm-pill ${bk}">${bLbl}</span></div>
        <div class="rkm-hero">
          <span class="n">${effTxt}<i>x</i></span>
          <span class="side">= Book <b>${expo.bookRatio!=null?expo.bookRatio.toFixed(1)+"x":"—"}</b>
            + 2x boost <b>${rkPct(expo.boostRatio)}</b></span>
        </div>
        <div class="rkm-g">
          <span class="z1" style="width:50%"></span><span class="z2" style="width:25%"></span><span class="z3"></span>
          <span class="fill" style="width:${expoPct}%"></span>

/* 面板切換:Stocks / Leverage Risk */
let PANEL="stock", RKDET=false;
function switchPanel(p){
  if(p==="risk"&&!rkHas()) return;
  PANEL=p;
  document.querySelectorAll("#panelToggle button").forEach(b=>b.classList.toggle("on",b.dataset.panel===p));
  document.getElementById("stockPanel").hidden = p!=="stock";
  document.getElementById("stockChrome").hidden = p!=="stock";
  const rp=document.getElementById("riskPanel"); rp.hidden = p!=="risk";
  if(p==="risk") renderRisk();
  syncHeader();
  syncTabbar();
}

/* 手機版的頁首會跟著面板換標題(設計稿 1d:Leverage頁標題是「Leverage Risk」) */
function syncHeader(){
  const h1=document.querySelector("header h1"), sub=document.getElementById("datadate");
  if(!h1||!sub) return;
  if(isMobile()&&PANEL==="risk"){
    h1.textContent="Leverage Risk";
    const t=rkSnaps().length?(rkSnaps()[0].updated_at||""):"";
    sub.parentElement.innerHTML=`<span id="datadate">From broker snapshot · ${rkRel(t)}</span>`;
  }else{
    h1.textContent="Market Compass";
    sub.parentElement.innerHTML=`Updated <span id="datadate">${DATA_DATE||"—"}</span>`;
  }
}
let DATA_DATE="";

/* 底部分頁列(手機):Market/Stocks/Watch/Earnings 屬Stocks,Leverage是另一個面板。
   點哪一格就切到對應的面板 & 分頁,並把亮起來的那格同步。 */
function goNav(k){
  if(k==="risk"){ switchPanel("risk"); }
  else{ switchPanel("stock"); switchTab(k); }
  window.scrollTo(0,0);
}
function syncTabbar(){
  const cur = (PANEL==="risk") ? "risk"
    : (["macro","stocks","watch","earnings"].find(p=>!document.getElementById(p).hidden) || "macro");
  document.querySelectorAll("#tabbar button").forEach(b=>b.classList.toggle("on", b.dataset.go===cur));
  // Leverage那格的Status點跟著Loan Ratio的Safe/Watch/Danger走(設計稿 1e)
  const dot=document.getElementById("tabbarRiskDot");
  if(dot && typeof rkSnaps==="function" && rkSnaps().length){
    const kind=rkBorrowKind(rkNorm(rkSnaps()[0]).borrowRatio);
    dot.className="tb-dot"+(kind==="watch"?" warn":kind==="danger"?" danger":"");
  }
}

/* 切到指定分頁（重用 tab 切換邏輯，含 active 樣式更新） */
function switchTab(t){
  document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("active", x.dataset.tab===t));
  ["macro","stocks","watch","earnings"].forEach(p=>{
    document.getElementById(p).hidden = t!==p;
  });
  // Earnings分頁 & MA訊號無關,隱藏頂部訊號列
  document.getElementById("topstrip").hidden = t==="earnings";
  syncTabbar();
}

/* ---------- 點擊彈窗:走勢線圖 ---------- */
const RANGE_PTS={ "1D":2, "1W":5, "3M":63, "6M":126, "1Y":252, "3Y":756, "ALL":1e9 };
const RANGE_LBL={ "1D":"1D", "1W":"1W", "3M":"3M", "6M":"6M", "1Y":"1Y", "ALL":"All" };
// 手機只留四個區間(設計稿 1c),短天期在手機上看不出東西
const RANGE_LBL_M={ "3M":"3M", "6M":"6M", "1Y":"1Y", "3Y":"3Y" };
let CHART={ sym:null, range:"6M" };

// 從 watchlist 找顯示名 / 說明
function wlEntry(sym){
  return [...(WL.market_holdings||[]), ...(WL.holdings||[]), ...(WL.watch||[])].find(h=>h.s===sym) || {s:sym};
}
// 依選定區間取歷史資料尾段
function slice(hist){
  const n=hist.c.length, k=Math.min(n, RANGE_PTS[CHART.range]);
  return {d:hist.d.slice(n-k), c:hist.c.slice(n-k)};
}
function fmtDate(iso){ const p=iso.split("-"); return `${p[0]}/${p[1]}/${p[2]}`; }
function num(v,dp){ return v.toLocaleString(undefined,{minimumFractionDigits:dp,maximumFractionDigits:dp}); }

// avgLine=true 時,除了Avg cost紅點,再畫一條「avg」水平虛線(手機版設計稿 1c)
function chartSVG(d,c,cost,buys,avgLine){
  const W=680,H=250,pT=18,pB=16,pL=6,pR=6;
  const n=c.length;
  if(n<2) return `<div class="cnodata">Not enough data</div>`;
  const lo=Math.min(...c), hi=Math.max(...c);
  const minI=c.indexOf(lo), maxI=c.indexOf(hi);
  // Avg cost在此區間內的話,擴大 y 軸讓紅點永遠畫得進來
  let min=lo, max=hi;
  if(avgLine&&cost!=null){ min=Math.min(min,cost); max=Math.max(max,cost); }
  const inBuys=(buys||[]).map(b=>{
    let i=d.indexOf(b.d);
    if(i<0) i=d.findIndex(x=>x>=b.d);           // if the buy date is not a trading day, take the next one
    if(i<0||!d.length||b.d<d[0]) return null;    // outside the visible range
    return {i, d:b.d, q:b.q, p:(b.p!=null?Number(b.p):c[i])};
  }).filter(Boolean).sort((a,b)=>a.i-b.i);
  inBuys.forEach(b=>{ min=Math.min(min,b.p); max=Math.max(max,b.p); });
  if(cost!=null&&!(buys&&buys.length)){ min=Math.min(min,cost); max=Math.max(max,cost); }
  const span=(max-min)||1;
  const X=i=> pL + i*(W-pL-pR)/(n-1);
  const Y=v=> pT + (1-(v-min)/span)*(H-pT-pB);
  const pts=c.map((v,i)=>`${X(i).toFixed(1)} ${Y(v).toFixed(1)}`);
  const line="M"+pts.join(" L");
  const area=`M${X(0).toFixed(1)} ${(H-pB).toFixed(1)} L`+pts.join(" L")+` L${X(n-1).toFixed(1)} ${(H-pB).toFixed(1)} Z`;
  const anchor=x=> x<70?"start":(x>W-70?"end":"middle");
  const lbl=(i,v,below)=>{
    const x=X(i), y=Y(v); const ty=below? y+13 : y-6;
    return `<text class="clabel" x="${x.toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="${anchor(x)}">${num(v,2)}</text>`;
  };
  // Avg cost:紅點標在Bought那天的位置(watchlist 的 buys:[{d,p}])。
  // 尚未提供日期的Ticker退回舊的平均成本橫線(cost)。
  let costHtml="";
  // avg水平虛線(手機):Avg cost紅點之外再給一條參考線,一眼看出now在成本上面還下面
  let avgHtml="";
  if(avgLine&&cost!=null){
    const ay=Y(cost);
    avgHtml=`<line class="bline" x1="${pL}" x2="${W-pR}" y1="${ay.toFixed(1)}" y2="${ay.toFixed(1)}"/>
      <text class="blabel" x="${W-pR-4}" y="${(ay-5).toFixed(1)}" text-anchor="end">avg ${num(cost,2)}</text>`;
  }
  if(inBuys.length){
    // 分批Bought的點會擠在一起,標籤只給前後都夠空的孤立Avg cost,其餘靠 hover 的 title
    const GAP=58;
    costHtml=inBuys.map((b,k)=>{
      const bx=X(b.i), by=Y(b.p);
      const ty=by<pT+16 ? by+16 : by-9;
      const tip=`${fmtDate(b.d)} · ${b.q||""} @ ${num(b.p,2)}`;
      const prevFar=k===0||bx-X(inBuys[k-1].i)>=GAP;
      const nextFar=k===inBuys.length-1||X(inBuys[k+1].i)-bx>=GAP;
      const text=(prevFar&&nextFar)
        ? `<text class="blabel" x="${bx.toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="${anchor(bx)}">${num(b.p,2)}</text>`
        : "";
      return `<circle class="bdot" cx="${bx.toFixed(1)}" cy="${by.toFixed(1)}" r="4.4"><title>${tip}</title></circle>${text}`;
    }).join("");
  }else if(cost!=null){
    const cy=Y(cost).toFixed(1);
    const ty=Y(cost)<pT+16 ? (+cy+14).toFixed(1) : (+cy-5).toFixed(1);
    costHtml=`<line class="bline" x1="${pL}" x2="${W-pR}" y1="${cy}" y2="${cy}"/>
      <circle class="bdot" cx="${pL+3}" cy="${cy}" r="3.4"/>
      <circle class="bdot" cx="${W-pR-3}" cy="${cy}" r="3.4"/>
      <text class="blabel" x="${pL+11}" y="${ty}">Avg cost ${num(cost,2)}</text>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="cgrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--cline)" stop-opacity="0.16"/>
      <stop offset="1" stop-color="var(--cline)" stop-opacity="0"/></linearGradient></defs>
    <path class="carea" d="${area}"/>
    <path class="cline" d="${line}"/>
    ${avgHtml}${costHtml}
    <circle class="cglow" cx="${X(n-1).toFixed(1)}" cy="${Y(c[n-1]).toFixed(1)}" r="7"/>
    <circle class="cdot" cx="${X(n-1).toFixed(1)}" cy="${Y(c[n-1]).toFixed(1)}" r="3.6"/>
    ${lbl(maxI,hi,false)}${lbl(minI,lo,true)}
  </svg>`;
}

// Bought紀錄:把 watchlist 的 buys:[{d,q,p}] 列成清單,和線圖上的紅點一一對應。
// cost 用已解出的持倉avg(有含手續費的 e.cost 優先),last 拿來算每的浮動損益。
function buyHistoryHTML(e,last,cost){
  const buys=Array.isArray(e.buys)?e.buys.slice():null;
  if(!buys||!buys.length) return "";
  buys.sort((a,b)=> a.d<b.d?-1 : a.d>b.d?1 : 0);
  const qFmt=q=> q%1===0? String(q) : q.toFixed(2);
  let totQ=0;
  const rows=buys.map(b=>{
    const q=Number(b.q||0), p=Number(b.p||0); totQ+=q;
    const pl=(last!=null&&p)?(last/p-1)*100:null;
    const plHtml=pl!=null?`<span class="bh-pl ${pl>=0?'up':'dn'}">${pl>=0?'+':''}${pl.toFixed(1)}%</span>`:`<span class="bh-pl"></span>`;
    return `<div class="bh-row">
      <span class="bh-d num"><span class="bh-dot"></span>${fmtDate(b.d)}</span>
      <span class="bh-q num">${qFmt(q)} sh</span>
      <span class="bh-p num">@ ${num(p,2)}</span>
      ${plHtml}</div>`;
  }).join("");
  const avg=cost!=null?cost:(totQ?buys.reduce((a,b)=>a+Number(b.q||0)*Number(b.p||0),0)/totQ:0);
  return `<div class="bhist">
    <div class="bh-head"><span class="bh-t">My Buys</span>
      <span class="bh-sum">${buys.length} buys · ${qFmt(totQ)} sh · avg ${num(avg,2)}</span></div>
    ${rows}</div>`;
}
/* ══════ 手機版走勢彈窗的零件(設計稿 1c) ══════ */
// MA格改成顯示「MAPrice」+ Above/Below小籤,不再是乖To 百分比
function mMaCards(r){
  const lab={5:"MA5",20:"MA20",60:"MA60",120:"MA120",240:"MA240"};
  return `<div class="mmacards">`+[5,20,60,120,240].map(k=>{
    const m=maByK(r,k);
    if(!m||m.v==null)
      return `<div class="mmac"><span class="l">${lab[k]}</span><span class="v na">—</span><span class="s na">—</span></div>`;
    const cls=m.above?"up":"dn";
    return `<div class="mmac"><span class="l">${lab[k]}</span>
      <span class="v ${cls}">${m.v.toLocaleString(undefined,{maximumFractionDigits:1})}</span>
      <span class="s ${cls}">${m.above?"Above":"Below"}</span></div>`;
  }).join("")+`</div>`;
}
// Bought摘要 chip + 每一明細(日期 / 成交價 / sh數)
function mBuyBlock(e,last,cost){
  const buys=Array.isArray(e.buys)?e.buys.slice():null;
  if(!buys||!buys.length) return "";
  buys.sort((a,b)=> a.d<b.d?-1 : a.d>b.d?1 : 0);
  const totQ=buys.reduce((a,b)=>a+Number(b.q||0),0);
  const avg=(cost!=null)?cost:(totQ?buys.reduce((a,b)=>a+Number(b.q||0)*Number(b.p||0),0)/totQ:0);
  const pl=avg?(last/avg-1)*100:null;
  const qf=q=> q%1===0?String(q):q.toFixed(2);
  const rows=buys.map(b=>`<div class="mbrow"><i></i>
    <span class="d">${b.d}</span>
    <span class="p">${num(Number(b.p||0),2)}</span>
    <span class="q">× ${qf(Number(b.q||0))}</span></div>`).join("");
  const plHtml=(pl!=null)
    ? ` · now <b class="${pl>=0?"up":"dn"}">${pl>=0?"+":"−"}${Math.abs(pl).toFixed(1)}%</b>` : "";
  return `<div class="mbuy-sum"><i></i>Bought ${buys.length}  · avg <b>${num(avg,2)}</b>${plHtml}</div>
    <div class="mbuy-list">${rows}</div>`;
}

function maCardsHTML(r){
  const lab={5:"5MA",20:"20MA",60:"60MA",120:"120MA",240:"240MA"};
  // 完稿:格子白底細框,顏色只落在數值;Status(Above/Below/Today穿越)用格底小標籤
  return `<div class="macards">`+[5,20,60,120,240].map(k=>{
    const m=maByK(r,k);
    if(!m||m.v==null) return `<div class="mac"><div class="macv na num">—</div><div class="macl">${lab[k]}</div><div class="macs muted">—</div></div>`;
    const cls=m.above?"up":"dn", s=m.diff>=0?"+":"";
    const crossed=m.cross==="bull"||m.cross==="bear";
    const st=m.cross==="bull"?`<span class="macs on up">crossed up</span>`
            :m.cross==="bear"?`<span class="macs on dn">crossed down</span>`
            :`<span class="macs muted">${m.above?"Above":"Below"}</span>`;
    return `<div class="mac${crossed?" crossed":""}"><div class="macv ${cls} num">${s}${m.diff.toFixed(1)}%</div>
      <div class="macl">${lab[k]}</div>${st}</div>`;
  }).join("")+`</div>`;
}

function renderChart(){
  const sym=CHART.sym, r=DATA[sym]; if(!r||!r.hist) return;
  const e=wlEntry(sym);
  const title=e.dn||sym;
  const sub=[sym.replace(/\.(TW|TWO)$/,""), e.note].filter(Boolean).join(" · ");
  const {d,c}=slice(r.hist);
  const last=c[c.length-1], prev=c.length>1?c[c.length-2]:last;
  const chg=(last/prev-1)*100, cCls=chg>=0?"up":"dn", cS=chg>=0?"+":"";
  const seg=(group,val,map)=>`<div class="segrow">`+Object.keys(map).map(kk=>
      `<button data-${group}="${kk}" class="${CHART.range===kk?'on':''}">${map[kk]}</button>`).join("")+`</div>`;
  const segs=`<div class="segs">
      ${seg("range",CHART.range,RANGE_LBL)}
    </div>`;
  const ip=interpret(r);   // Above n/5 moved to the sscore on the right, so the sentence does not repeat it
  // 持倉成本:彈窗頭顯示now vs Avg cost(cost,或 buys 的平avg)
  const buys=Array.isArray(e.buys)?e.buys:null;
  let cost=(e.cost!=null)?Number(e.cost):null;
  if(cost==null&&buys&&buys.length) cost=buys.reduce((a,b)=>a+Number(b.p||0),0)/buys.length;
  // Avg cost &  vs Avg cost收成一個 chip
  let costLine="";
  if(cost!=null){
    const cp=(last/cost-1)*100;
    costLine=`<div class="costchip num"><span class="bq"></span>Avg cost ${num(cost,2)}
      <span>vs Avg cost <b>${cp>=0?"+":""}${cp.toFixed(1)}%</b></span></div>`;
  }
  // 卡片上的Leverage/Add/Trim標記,彈窗標題也帶著
  const tags=(function(){
    const lev=Number(e.lev||1);
    // 排列Status標籤(完稿):AboveAll=Bullish(綠),AllBelow=Bearish
    let trend="";
    if(r.valid>0&&r.score===r.valid) trend=`<span class="trendtag up">Bullish</span>`;
    else if(r.valid>0&&r.score===0) trend=`<span class="trendtag dn">Bearish</span>`;
    return trend+(lev>1?`<span class="levtag">${lev}x</span>`:"")
      +addBadgeFor(sym)+cutBadgeFor(sym);
  })();
  // ── 手機版彈窗(設計稿 1c):抓握條、Price靠右、avg虛線、Bought明細、MAPrice格 ──
  if(isMobile()){
    let trend="";
    if(r.valid>0&&r.score===r.valid) trend=`<span class="mtrend up">Bullish</span>`;
    else if(r.valid>0&&r.score===0) trend=`<span class="mtrend dn">Bearish</span>`;
    const lev=Number(e.lev||1);
    const mtags=trend+(lev>1?`<span class="mtag lev">${lev}x</span>`:"")
      +mSignalTags(sym);
    // 標題已經印了代號,副標只留說明文字(設計稿 1c)
    const msub=e.note||e.group||sym;
    const msegs=`<div class="segs"><div class="segrow">`+Object.keys(RANGE_LBL_M).map(kk=>
        `<button data-range="${kk}" class="${CHART.range===kk?'on':''}">${RANGE_LBL_M[kk]}</button>`
      ).join("")+`</div></div>`;
    document.getElementById("chartSheet").innerHTML=
      `<div class="grab"></div>
       <div class="mshead">
         <div><div class="t"><b>${title}</b>${mtags}</div><div class="sub">${msub}</div></div>
         <div class="rt"><div style="text-align:right">
           <div class="px">${num(last,2)}</div>
           <div class="chg ${cCls}">${cS}${chg.toFixed(2)}% Today</div>
         </div><button class="sclose" id="chartClose" aria-label="Close">✕</button></div>
       </div>
       <div class="chartbox">${chartSVG(d,c,cost,buys,true)}</div>
       <div class="cdates"><span>${d.length?fmtDate(d[0]):""}</span><span>${d.length?fmtDate(d[d.length-1]):""}</span></div>
       ${mBuyBlock(e,last,cost)}
       ${msegs}
       ${mMaCards(r)}
       <div class="msfoot">${ip?`<span class="ip">${ip}</span>`:`<span class="ip"></span>`}
         <span class="sc5">Above ${r.score}/${r.valid}</span></div>`;
    return;
  }
  document.getElementById("chartSheet").innerHTML=
    `<div class="shead">
       <div><div class="stitle">${title}${tags}</div><div class="ssub">${sub}</div></div>
       <div class="rt"><div>
         <div class="sprice">${num(last,2)}</div>
         <div class="schg ${cCls}">${cS}${chg.toFixed(2)}%</div>
         ${costLine}
       </div><button class="sclose" id="chartClose" aria-label="Close">✕</button></div>
     </div>
     <div class="chartbox">${chartSVG(d,c,cost,buys)}</div>
     <div class="cdates"><span>${d.length?fmtDate(d[0]):""}</span><span>${d.length?fmtDate(d[d.length-1]):""}</span></div>
     ${segs}
     ${maCardsHTML(r)}
     <div class="sfoot">${ip?`<div class="sinterp">↳ ${ip}</div>`:`<div class="sinterp"></div>`}
       <span class="sscore">Above ${r.score}/${r.valid} MA</span></div>
     ${buyHistoryHTML(e,last,cost)}`;
}

function loadData(){
  refreshBtn.classList.add("spinning");
  const [watchlistUrl,dataUrl]=dataUrlsForProtocol(location.protocol);
  return Promise.all([
    fetch(watchlistUrl+"?t="+Date.now()).then(r=>r.json()),
    fetch(dataUrl+"?t="+Date.now()).then(r=>r.json()),
  ]).then(([wl,data])=>{
    WL=wl; DATA=data;
    buildHoldMaps();
    DATA_DATE=(function(u){
      if(!u) return "—";
      const d=new Date(u); if(isNaN(d)) return u.slice(0,10);
      const p=n=>String(n).padStart(2,"0");
      return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
    })(DATA._updated);
    syncHeader();
    document.getElementById("status").style.display="none";
    renderTopStrip();

    renderEarnings();
  }).catch(e=>{
    if(!DATA) document.getElementById("status").innerHTML='<span class="nd">No data yet.</span>';

<!-- 觸控指示圓點：錄 demo 前注入到被錄的網頁（append 到 HTML 結尾即可）。
     WDA 合成的觸控是真的系統觸控，會觸發 DOM touch 事件，所以點擊與拖曳都會有圓點跟著。
     同時禁用選字，避免慢速拖曳被 WKWebView 當成長按選取（畫面會反藍，毀掉錄影）。 -->
<style>
  body, body * { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .demo-touch {
    position: fixed; width: 44px; height: 44px; margin: -22px 0 0 -22px;
    border-radius: 50%; background: rgba(30, 30, 28, 0.28);
    border: 1.5px solid rgba(30, 30, 28, 0.45);
    pointer-events: none; z-index: 99999;
    transition: opacity 0.35s ease, transform 0.35s ease;
  }
</style>
<script>
(function () {
  var dots = {};
  function move(id, x, y) {
    var d = dots[id];
    if (!d) {
      d = document.createElement("div");
      d.className = "demo-touch";
      document.body.appendChild(d);
      dots[id] = d;
    }
    d.style.left = x + "px";
    d.style.top = y + "px";
  }
  function drop(id) {
    var d = dots[id];
    if (!d) return;
    delete dots[id];
    d.style.opacity = "0";
    d.style.transform = "scale(1.6)";
    setTimeout(function () { d.remove(); }, 380);
  }
  document.addEventListener("touchstart", function (ev) {
    for (var i = 0; i < ev.changedTouches.length; i++) {
      var t = ev.changedTouches[i];
      move(t.identifier, t.clientX, t.clientY);
    }
  }, true);
  document.addEventListener("touchmove", function (ev) {
    for (var i = 0; i < ev.changedTouches.length; i++) {
      var t = ev.changedTouches[i];
      move(t.identifier, t.clientX, t.clientY);
    }
  }, true);
  ["touchend", "touchcancel"].forEach(function (n) {
    document.addEventListener(n, function (ev) {
      for (var i = 0; i < ev.changedTouches.length; i++) drop(ev.changedTouches[i].identifier);
    }, true);
  });
})();
</script>

<script>
/* Demo tour：讓 beta 頁面自己演一遍，給錄影片用。
   為什麼不用 WDA 合成觸控：模擬器上的 WDA 不穩，而且每個 curl 有半秒延遲，
   時間軸會飄。頁面自己跑腳本可以把節奏訂死，每次錄出來都一樣。
   觸控圓點由這支腳本自己畫（真的觸控事件不存在），位置取自目標元素的中心。

   啟動方式：網址加 ?demo=1，或在 console 打 demoTour()。 */
(function () {
  var DOT_MS = 420;         // how long the touch dot stays visible
  var dot = null;

  function showDot(x, y) {
    if (!dot) {
      dot = document.createElement("div");
      dot.className = "demo-touch";
      dot.style.transition = "opacity .18s ease, transform .18s ease";
      document.body.appendChild(dot);
    }
    dot.style.left = x + "px";
    dot.style.top = y + "px";
    dot.style.opacity = "1";
    dot.style.transform = "scale(1)";
    setTimeout(function () {
      if (dot) { dot.style.opacity = "0"; dot.style.transform = "scale(0.7)"; }
    }, DOT_MS);
  }

  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  // 在元素中心點一下：先畫圓點，稍後才真的觸發 click，看起來才像手指按下去
  async function tap(el, pause) {
    if (!el) return wait(pause || 600);
    el.scrollIntoView({ block: "center", behavior: "smooth" });
    await wait(300);
    var r = el.getBoundingClientRect();
    showDot(r.left + r.width / 2, r.top + r.height / 2);
    await wait(190);
    el.click();
    return wait(pause || 900);
  }

  // 慢慢捲動，每一小步都畫一次，錄起來才順
  async function smoothScrollTo(target, ms) {
    var start = window.scrollY, delta = target - start, t0 = performance.now();
    return new Promise(function (done) {
      function step(now) {
        var p = Math.min((now - t0) / ms, 1);
        var e = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;  // ease-in-out
        window.scrollTo(0, start + delta * e);
        if (p < 1) requestAnimationFrame(step); else done();
      }
      requestAnimationFrame(step);
    });
  }

  async function tour() {
    // 1. 大盤列表：先讓觀眾看清楚頂部脈搏卡與前幾支標的
    window.scrollTo(0, 0);
    await wait(900);

    // 2. 往下捲，展示整排均線點陣
    await smoothScrollTo(560, 1100);
    await wait(550);
    await smoothScrollTo(0, 600);
    await wait(250);

    // 3. 點開一支標的看走勢圖與買點
    var row = document.querySelector('#macro .mline[data-sym="QQQ"]') ||
              document.querySelector('#macro .mline');
    await tap(row, 1700);

    // 4. 切一下區間，展示圖會跟著換
    var seg = document.querySelector('#chartSheet [data-range="1Y"]');
    await tap(seg, 1250);

    // 5. 關掉彈窗
    await tap(document.getElementById("chartClose"), 550);

    // 6. 切到槓桿風險頁
    await tap(document.querySelector('#tabbar [data-go="risk"]'), 1600);

    // 7. 捲到持倉配置
    await smoothScrollTo(600, 1200);
    await wait(1000);

    // 8. 回大盤收尾
    await smoothScrollTo(0, 500);
    await tap(document.querySelector('#tabbar [data-go="macro"]'), 800);
  }

  window.demoTour = tour;
  if (location.search.indexOf("demo=1") >= 0) {
    // 等資料畫完再開始，不然第一屏是空的
    var tries = 0;
    var timer = setInterval(function () {
      if (document.querySelector("#macro .mline") || ++tries > 60) {
        clearInterval(timer);
        setTimeout(tour, 500);
      }
    }, 200);
  }
})();

</script>
