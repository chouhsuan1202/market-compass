    const t0=t(pts[0].d), t1=t(pts[pts.length-1].d);
    const lo=Math.min(...pts.map(p=>p.v)), hi=Math.max(...pts.map(p=>p.v));
    const span=(hi-lo)||1;
    const X=d=>((t(d)-t0)/((t1-t0)||1))*W;
    const Y=v=>T+(1-(v-lo)/span)*(H-T-B);
    const line=pts.map((p,i)=>`${i?"L":"M"}${X(p.d).toFixed(1)} ${Y(p.v).toFixed(1)}`).join(" ");
    return `<svg class="dm-spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
      <path d="${line} L${W} ${H} L0 ${H} Z" fill="#e7f6ef"></path>
      <path d="${line}" fill="none" stroke="#12a670" stroke-width="4"
        vector-effect="non-scaling-stroke" stroke-linejoin="round"></path></svg>`;
  }
  const S=A.summary, TP=A.timeline||[];
  const spark=sparkSVG(TP);
  const heroCard=`
    <div class="dm-card">
      <div class="dm-hd"><span class="dm-t">${S[1].label}</span>
        ${S[1].delta?`<span class="dm-delta ${S[1].deltaDir||""}">${S[1].delta}</span>`:""}</div>
      <div class="dm-big"><span class="n">${S[1].value}</span>
        <span class="u">${S[1].unit||""}</span></div>
      <div class="dm-sub">${S[1].sub||""}</div>
      <div class="dm-net"><span class="l">${S[0].label} <b>${S[0].value} ${S[0].unit||""}</b></span>
        <span class="r">${S[0].sub||""}</span></div>
      ${spark?`${spark}
      <div class="dm-sparkl"><span>${TP[0].d.slice(0,4)}</span>
        <span>歷年流動資產 · 萬台幣</span><span>今天 ${TP[TP.length-1].v}</span></div>
      <button class="dm-btn" id="asTlToggle">${AS_TLOPEN?"收起歷年線圖 ▲":"展開歷年線圖(萬台幣)▾"}</button>
      ${AS_TLOPEN?`<div class="dm-open" style="padding-top:8px">${tl}</div>`:""}`:""}
    </div>`;
  // 資產結構:三種切法,展開才畫甜甜圈與圖例(重用 donuts 的資料)
  const structRows=[
    {k:"ETF vs 個股", v:S[2].value, sub:S[2].sub, di:1},
    {k:"現金 vs 股票", v:S[3].value, sub:S[3].sub, di:2},
    {k:"淨資產類別", v:A.donuts[0].slices.length+" 類",
     sub:A.donuts[0].slices.map(x=>x.name).join(" · "), di:0},
    {k:"帳戶分佈", v:A.accounts.length+" 個",
     sub:A.accounts.slice(0,3).map(x=>x.name).join(" · ")+" 等", di:3},
  ].map((r,i)=>{
    const DN=[...A.donuts,acctDonut];
    const d=DN[r.di], tot=d.slices.reduce((a,x)=>a+x.value,0)||1;
    const open=AS_STRUCT===i;
    const seg=d.slices.map(x=>
      `<i style="width:${(x.value/tot*100).toFixed(2)}%;background:${x.color}"></i>`).join("");
    const lgd=d.slices.map(x=>
      `<span><i style="background:${x.color}"></i>${x.name} <b>${fmt(x.value)}</b> · ${Math.round(x.value/tot*100)}%</span>`).join("");
    return `<div class="dm-strow">
      <div class="h"><span class="k">${r.k}</span><span class="v">${r.v}</span></div>
      <div class="dm-seg">${seg}</div>
      <div class="f"><span class="s">${r.sub||""}</span>
        <button data-asstruct="${i}">${open?"收起 ▲":"看明細 ▾"}</button></div>
      ${open?`<div class="dm-donut">${donutSVG(d.slices,112)}<div class="dm-lgd">${lgd}</div></div>`:""}
    </div>`;
  }).join("");
  // 持倉列:Compass 有線圖資料的才可點,點了開走勢彈窗
  const posRow=r=>{
    const link=!!(typeof DATA!=="undefined"&&DATA&&DATA[r.sym]&&DATA[r.sym].hist);
    return `<div class="dm-pos${link?" link":""}"${link?` data-sym="${r.sym}"`:""}>
      <span class="dm-tag ${tagCls[r.tag]||"st"}">${r.tag}</span>
      <span class="nm">${r.name}</span>
      <span class="pc">${r.pctAll}%</span>
      <span class="vl">${fmt(r.value)}</span></div>`;
  };
  const holdCard=(idx,open,btnId,n)=>{
    const h=A.holdings[idx]; if(!h) return "";
    const rows=(open?h.rows:h.rows.slice(0,n)).map(posRow).join("");
    const more=h.rows.length>n;
    return `<div class="dm-card c2">
      <div class="dm-hd bl"><span class="dm-t">${h.title}</span>
        <span class="dm-hint">點列開走勢圖 · 佔流動資產 %</span></div>
      ${rows}
      ${more?`<button class="dm-btn" id="${btnId}">${open?"收起 ▲":`展開全部 ${h.rows.length} 檔 ▾`}</button>`:""}
    </div>`;
  };
  const riskRows=A.risks.map((r,i)=>`
    <div class="dm-risk ${r.level}">
      <div class="h" data-asrisk="${i}"><i>${ICO[r.level]||"i"}</i><span>${r.title}</span></div>
      ${AS_RISKOPEN===i?`<div class="b">${r.body}</div>`:""}
    </div>`).join("");
  el.innerHTML=`
    ${heroCard}
    <div class="dm-card c2"><div class="dm-t">資產結構</div>${structRows}
      <div class="dm-foot">${A.accountsNote}</div></div>
    ${HOLD.map((h,i)=>holdCard(A.holdings.indexOf(h),!!AS_HOLDS[i],"asHold"+i,6)).join("")}
    <div class="dm-card c3"><div class="dm-t">風險提示</div>${riskRows}</div>
    <div class="dm-disc">資料每天自動更新(股價與匯率),要改股數或現金請改 asset-portfolio.json / asset-balances.json。持倉列 Compass 也在追蹤的,點了直接開線圖。</div>`;
}

/* ---------- 支出面板 ---------- */
(function(){

/* 面板外殼：獨立頁的 header 在 dashboard 是共用的，這裡自己長一列出來 */
function exShell(){
  const p=document.getElementById("expensePanel");
  if(p.querySelector("#app")) return;
  p.innerHTML='<div class="extop"><span class="exsub" id="exSub"></span>'
    +'<div class="mnav" id="mnav"></div></div><div id="app"></div>';
}

/* ── 每月支出 dashboard ──────────────────────────────────────────────
   資料在 expense-data.js(月結時月結時手動更新)。
   transactions = 真的花掉的錢(fixed:true 是每月固定帳單)。
   transfers = 錢只是換位置(投資、借出、帳戶之間搬錢、待確認匯款),不進總額。 */

let EXP_MONTH=null;
let WAS_MOBILE=null;
let PICK_OPEN=false;     /* 年月選單開著沒 */
let PICK_YEAR=null;      /* 選單目前顯示哪一年,跟實際選中的月份分開 */
let EX_FOCUS=null;       /* 圖例點下去只看某一組(組名),再點一次回到全部 */

const isMobile = () => window.matchMedia("(max-width:720px)").matches;
const exEur   = n => "NT$" + Math.round(n).toLocaleString("en-US");
const exCent  = n => "NT$" + Math.round(n).toLocaleString("en-US");
const exMonths= () => (window.EXPENSE_DATA ? EXPENSE_DATA.months.slice().sort((a,b)=>a.month<b.month?-1:1) : []);
const exLabel = m => m.slice(0,4)+"年"+parseInt(m.slice(5),10)+"月";
const exShort = m => parseInt(m.slice(5),10)+"月";
const exDay   = d => d.slice(5).replace("-","/");
const exTotal = m => m.transactions.reduce((s,t)=>s+t.amount,0);
const esc = s => String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const pctS = (v,base) => base>0 ? Math.round(v/base*100)+"%" : "0%";

/* 各組(固定帳單、生活費、購物娛樂其他、代墊)的順序、顏色、
   need/want/neutral 全部從 expense-data.js 的 groups 讀,這裡一個都不寫死,月結時改資料就好。
   每筆交易靠 t.group 歸組,t.cat 留著當細類 */
const exGroups   = () => (window.EXPENSE_DATA && EXPENSE_DATA.groups) ? EXPENSE_DATA.groups : [];
/* 朋友還款是負數,同組先加總算淨額,所以各組合計 = 該月總支出 */
function groupSums(m){
  const map={};
  m.transactions.forEach(t=>{ map[t.group]=(map[t.group]||0)+t.amount; });
  return exGroups().map(g=>({key:g.key,color:g.color,kind:g.kind,v:map[g.key]||0}));
}

/* 趨勢柱狀圖的堆疊順序:由下往上就是 groups 的順序,固定帳單墊底、購物娛樂其他壓最上面。
   顏色固定不跟金額排序走,月份之間才比得出同一層的高低 */
function stackLayers(m){
  /* 代墊(kind=neutral)有正有負,堆進柱子會讓高低亂掉,整組排除,改用圖上面那行小字交代。
     淨額 0 或負的層也不畫,不然堆疊會往回縮,柱頂對不上折線 */
  return groupSums(m).filter(g=>g.kind!=="neutral")
    .map(g=>({name:g.key,color:g.color,v:g.v})).filter(x=>x.v>0.005);
}

/* ── 主畫面 ─────────────────────────────────────────────── */
function render(){
  const D=window.EXPENSE_DATA, app=document.getElementById("app"), nav=document.getElementById("mnav");
  /* 獨立頁是寫到 header 的 #subline,dashboard 的 header 是共用的,改寫面板自己那一列 */
  const exSub=document.getElementById("exSub");
  if(exSub) exSub.textContent = D ? D.updated+" 更新 · 銀行 + 信用卡" : "沒有資料";
  if(!D || !D.months || !D.months.length){ nav.innerHTML=""; app.innerHTML='<div class="card empty">沒有資料</div>'; return; }

  const ms=exMonths();
  if(!EXP_MONTH){
    /* 預設停在最後一個過完的月份:月結看的是上個月,當月還沒過完先不當主角 */
    const cur=(D.updated||"").slice(0,7);
    const done=ms.filter(x=>x.month<cur);
    EXP_MONTH=(done.length?done[done.length-1]:ms[ms.length-1]).month;
  }
  if(!ms.some(x=>x.month===EXP_MONTH)) EXP_MONTH=ms[ms.length-1].month;

  const i=ms.findIndex(x=>x.month===EXP_MONTH), m=ms[i], prev=ms[i-1];
  const total=exTotal(m), budget=D.fixedBudget;
  /* 必要(need)= 固定帳單 + 生活費,想要(want)= 購物娛樂其他。
     代墊(neutral)兩邊都不算:錢只是先墊出去再收回來,有正有負 */
  const gsums=groupSums(m);
  const needRows=gsums.filter(g=>g.kind==="need");
  const wantRows=gsums.filter(g=>g.kind==="want");
  const needSum=needRows.reduce((a,g)=>a+g.v,0);
  const wantSum=wantRows.reduce((a,g)=>a+g.v,0);
  const over=total-budget;
  const running = EXP_MONTH===(D.updated||"").slice(0,7);

  /* 月份導航:箭頭管相鄰月份,點中間的字打開年月選單。
     資料累積一兩年後只靠箭頭要按二十幾下才翻得到去年,所以兩種都留。 */
  const years=[...new Set(ms.map(x=>+x.month.slice(0,4)))].sort();
  const curY=+EXP_MONTH.slice(0,4), curM=+EXP_MONTH.slice(5);
  if(PICK_YEAR===null || !years.includes(PICK_YEAR)) PICK_YEAR=curY;
  const has=(y,mm)=>ms.some(x=>x.month===`${y}-${String(mm).padStart(2,"0")}`);
  nav.innerHTML=`
    <button id="exPrev"${i<=0?" disabled":""} aria-label="上個月">‹</button>
    <button class="ml" id="exPick" aria-haspopup="true" aria-expanded="${PICK_OPEN}">
      ${exLabel(EXP_MONTH)}<span class="caret">▾</span></button>
    <button id="exNext"${i>=ms.length-1?" disabled":""} aria-label="下個月">›</button>
    ${PICK_OPEN?`<div class="picker" id="exPicker">
      <div class="pyear">
        <button id="pyPrev"${years.indexOf(PICK_YEAR)<=0?" disabled":""} aria-label="上一年">‹</button>
        <span>${PICK_YEAR}年</span>
        <button id="pyNext"${years.indexOf(PICK_YEAR)>=years.length-1?" disabled":""} aria-label="下一年">›</button>
      </div>
      <div class="pgrid">${Array.from({length:12},(_,k)=>{
        const mm=k+1, ok=has(PICK_YEAR,mm), on=ok&&PICK_YEAR===curY&&mm===curM;
        return `<button class="pm${on?" on":""}"${ok?` data-pick="${PICK_YEAR}-${String(mm).padStart(2,"0")}"`:" disabled"}>${mm}月</button>`;
      }).join("")}</div>
    </div>`:""}`;

  /* ── hero ── */
  let delta="沒有上月資料";
  if(prev){
    const d=total-exTotal(prev);
    delta = Math.round(d)===0 ? "和上月一樣"
      : d>0 ? `比上月多 ${exEur(d)}` : `比上月少 ${exEur(-d)}`;
  }
  if(running) delta+=" · 月還沒結";

  const scale=Math.max(total,budget)||1;
  const inBase=Math.min(total,budget);
  const inPct=inBase/scale*100, tickPct=budget/scale*100;
  const chip = over>0
    ? `<span class="chip-over">超出必要 ${exEur(over)}</span>`
    : `<span class="chip-under">低於必要 ${exEur(-over)}</span>`;
  const hero=`
    <section class="card hero">
      <div class="left">
        <div class="k">${exShort(EXP_MONTH)}總支出</div>
        <div class="v">${exEur(total)}</div>
        <div class="chips">${chip}<span class="delta">${delta}</span></div>
      </div>
      <div class="right">
        <div class="bar-top"><span>0</span><span class="mid">必要開銷 ${exEur(budget)}</span><span>${exEur(total)}</span></div>
        <div class="bar">
          <div class="seg-in" style="width:${inPct.toFixed(1)}%;border-radius:${over>0?"9px 0 0 9px":"9px"}"></div>
          ${over>0?`<div class="seg-over" style="left:${inPct.toFixed(1)}%"></div>`:""}
          <div class="tick" style="left:calc(${Math.min(tickPct,100).toFixed(1)}% - ${tickPct>=100?2:1}px)"></div>
        </div>
        <div class="bar-leg">
          <span class="i"><i style="background:var(--blue)"></i>必要 ${exEur(inBase)}</span>
          ${over>0?`<span class="i"><i style="background:var(--red)"></i>超出 ${exEur(over)}</span>`:""}
        </div>
      </div>
    </section>`;

  /* ── 要確認:待確認的匯款要處理,其他 kind 展開後一句話帶過 ── */
  const trf=(m.transfers||[]).slice().sort((a,b)=>a.date<b.date?-1:1);
  const ask=trf.filter(t=>t.kind==="待確認");
  const askSum=ask.reduce((s,t)=>s+t.amount,0);
  const othMap={};
  trf.filter(t=>t.kind!=="待確認").forEach(t=>{ othMap[t.kind]=(othMap[t.kind]||0)+t.amount; });
  const kindOrder=["投資","借出","自己的錢搬家"];
  const othKeys=[...kindOrder.filter(k=>othMap[k]>0),
                 ...Object.keys(othMap).filter(k=>kindOrder.indexOf(k)<0)];
  const othTxt=othKeys.map(k=>`${k} ${exEur(othMap[k])}`).join("、");
  const askBlock = ask.length ? `
    <details class="ask">
      <summary>
        <span class="l"><span class="dot"></span><span class="t">要確認</span>
          <span class="n">${ask.length} 筆待分類 · 未計入下方分類</span></span>
        <span class="amt">${exEur(askSum)}</span>
      </summary>
      <div class="body">
        ${ask.map(t=>`<div class="row"><span class="d">${exDay(t.date)}</span>
          <span class="n2">${esc(t.desc)}</span><span class="a">${exEur(t.amount)}</span></div>`).join("")}
        ${othTxt?`<div class="oth">另有${othTxt},錢只是換位置,不算支出</div>`:""}
      </div>
    </details>` : "";

  /* ── 這個月多花在哪:想要的那幾組,代墊不進這張卡 ── */
  const wants=wantRows.filter(g=>g.v>0.005);
  const maxWant=wants.reduce((a,g)=>Math.max(a,g.v),0)||1;
  /* 明細列的細類用小字掛在 desc 後面,知道這筆是超市還是外食 */
  const itemRow=(d,desc,cat,src,amt)=>`
    <div class="item"><span class="d">${d}</span>
      <span class="t">${esc(desc)}${cat?` <span class="catlab">${esc(cat)}</span>`:""} <span class="srcchip">${esc(src||"")}</span></span>
      <span class="a">${exCent(amt)}</span></div>`;
  const groupItems = key => m.transactions
    .filter(t=>t.group===key)
    .slice().sort((a,b)=>a.date<b.date?-1:1)
    .map(t=>itemRow(exDay(t.date),t.desc,t.cat,t.src,t.amount)).join("");
  const wantCardRows=wants.map(g=>`
    <details class="catrow">
      <summary>
        <span class="nm"><i style="background:${g.color}"></i>${esc(g.key)}</span>
        <span class="track"><i style="background:${g.color};width:${(g.v/maxWant*100).toFixed(1)}%"></i></span>
        <span class="amt">${exEur(g.v)}</span>
        <span class="pct">${pctS(g.v,total)}</span>
      </summary>
      <div class="items">${groupItems(g.key)}</div>
    </details>`).join("");

  /* wants 本來就只有 want 三組,直接挑金額最大的兩組當主因 */
  const top2=wants.slice().sort((a,b)=>b.v-a.v).slice(0,2)
    .map(g=>`<strong>${esc(g.key)}</strong>`);
  const insight = over>0
    ? `超出必要的 <strong class="r">${exEur(over)}</strong>${top2.length?` 主要來自 ${top2.join(" 與 ")}`:""}。`
    : `<span style="color:#9aa0ad">這個月沒有超出必要開銷。</span>`;

  const varCard=`
    <section class="card">
      <div class="chead"><h2>這個月多花在哪</h2><span class="tot">${exEur(wantSum)}</span></div>
      <div class="csub">點一列展開</div>
      <div class="rows">${wantCardRows}</div>
      <div class="insight">${insight}</div>
    </section>`;

  /* ── 必要開銷:固定帳單(該月實際)+ 生活費(對 livingBudget 預算)兩大列,點開才看得到細項 ── */
  /* 固定帳單那組拆 Mortgage、住房雜費、其他帳單(同名合併),
     生活費那組拆底下的細類小計。哪一組走哪一種看有沒有 fixed,不寫死組名 */
  const needBody = g => {
    const tx=m.transactions.filter(t=>t.group===g.key);
    if(tx.some(t=>t.fixed)){
      const mortgage=tx.filter(t=>t.cat==="房貸").reduce((a,t)=>a+t.amount,0);
      const hMisc=tx.filter(t=>t.cat==="住房雜費").reduce((a,t)=>a+t.amount,0);
      const others=tx.filter(t=>t.cat!=="房貸" && t.cat!=="住房雜費");
      const othSum=others.reduce((a,t)=>a+t.amount,0);
      const merged=[], idx={};
      others.forEach(t=>{
        if(idx[t.desc]===undefined){ idx[t.desc]=merged.length; merged.push({desc:t.desc,date:t.date,cat:t.cat,amount:t.amount,src:t.src,n:1}); }
        else { const q=merged[idx[t.desc]]; q.amount+=t.amount; q.n++; }
      });
      const othItems=merged.sort((a,b)=>b.amount-a.amount)
        .map(q=>itemRow(q.n>1?`×${q.n}`:exDay(q.date),q.desc,q.cat,q.src,q.amount)).join("");
      /* 沒有房貸的月份(例如一月)不列 0 的空行 */
      return `<div class="fixsub">
        ${mortgage>0.005?`<div class="fixline"><span>房貸</span><span class="fixv">${exEur(mortgage)}</span></div>`:""}
        ${hMisc>0.005?`<div class="fixline"><span>住房雜費</span><span class="fixv">${exEur(hMisc)}</span></div>`:""}
        ${othSum>0.005?`<details class="fixrow sub">
          <summary><span class="nm">其他固定帳單</span><span class="fixv">${exEur(othSum)}</span></summary>
          <div class="items">${othItems}</div>
        </details>`:""}
      </div>`;
    }
    const cm={};
    tx.forEach(t=>{ cm[t.cat]=(cm[t.cat]||0)+t.amount; });
    /* 朋友分帳收支相抵會是 0,這種細類不列 */
    const lines=Object.keys(cm).filter(k=>Math.abs(cm[k])>0.005).sort((a,b)=>cm[b]-cm[a])
      .map(k=>`<div class="fixline"><span>${esc(k)}</span><span class="fixv">${exEur(cm[k])}</span></div>`).join("");
    return `<div class="fixsub">${lines}</div>`;
  };
  /* 第二列是生活費,右邊金額後面接「/ 預算」:超過預算轉紅,沒超過轉綠。
     預算讀 livingBudget(他訂的目標,不是算出來的),沒設就只顯示金額 */
  const lbud=(D.livingBudget>0)?D.livingBudget:0;
  const needCardRows=needRows.map((g,k)=>{
    const isLiving=(k===1 && lbud>0);
    const col=isLiving ? (g.v>lbud?"var(--dn)":"var(--up)") : "";
    return `
    <details class="fixrow">
      <summary><span class="nm"><i style="background:${g.color}"></i>${esc(g.key)}</span>
        <span class="fixv"${col?` style="color:${col}"`:""}>${exEur(g.v)}${
          isLiving?`<span class="budnote">/ 預算 ${exEur(lbud)}</span>`:""}</span></summary>
      ${needBody(g)}
    </details>`;
  }).join("");
  /* 卡片底下那行只留目標的拆法(bills + living),生活費超過預算才補一段紅字 */
  const bd=D.budgetBreakdown||{};
  const bk=needRows[0]?needRows[0].key:"固定帳單", lk=needRows[1]?needRows[1].key:"生活費";
  const bv=needRows[0]?needRows[0].v:0, lv=needRows[1]?needRows[1].v:0;
  const lOver=lbud>0?lv-lbud:0;
  const footTxt = ((bd.bills>0 && bd.living>0)
    ? `目標 ${exEur(budget)} = ${bk} ${exEur(bd.bills)} + ${lk} ${exEur(bd.living)}`
    : `目標 ${exEur(budget)}`)
    + (Math.round(lOver)>0?` <span class="r">超出 ${exEur(lOver)}</span>`:"");
  /* ── 月收入:壓成三行(標題+大數字 / 組成 / ruling 提醒),不要長成一張表。
     Airbnb 只有那個月真的有(m.airbnb > 0)才出現,平常不佔一行。
     數字在 expense-data.js 的 income,薪資單改了就改那裡。 ── */
  const inc=D.income||null;
  let incCard="";
  if(inc){
    const sal=+inc.netSalary||0, park=+inc.parking||0;
    const abnb=+(m&&m.airbnb)||0;
    const tot=sal+park+abnb;
    const noRul=+inc.netSalaryNoRuling||0;
    const parts=[`稅後月薪 ${exEur(sal)}`,`兼職 ${exEur(park)}`]
      .concat(abnb>0?[`其他 ${exEur(abnb)}`]:[]).join(" + ");
    incCard=`
    <section class="card inccard">
      <div class="chead"><h2>月收入</h2><span class="tot">${exEur(tot)}</span></div>
      <div class="csub">${parts}</div>
      ${noRul?`<div class="incnote">年終另計 <b>${exEur(noRul)}</b></div>`:""}
    </section>`;
  }
  const fixCard=`
    <section class="card">
      <div class="chead"><h2>必要開銷</h2><span class="tot">${exEur(needSum)}</span></div>
      <div class="csub">${bk} + ${lk}</div>
      <div class="rows">${needCardRows}</div>
      <div class="foot">${footTxt}</div>
    </section>`;

  /* ── 趨勢 ── */
  /* 圖例是篩選開關:列今年有金額的組(不只這個月),點一顆圖上就只剩那一組,再點一次回到全部。
     代墊有正有負不進圖,圖例跟著不列 */
  const yr=EXP_MONTH.slice(0,4), yms=ms.filter(x=>x.month.slice(0,4)===yr);
  const ysum={}; yms.forEach(x=>groupSums(x).forEach(g=>{ ysum[g.key]=(ysum[g.key]||0)+g.v; }));
  const lgs=exGroups().filter(g=>g.kind!=="neutral" && (ysum[g.key]||0)>0.005);
  if(EX_FOCUS && !lgs.some(g=>g.key===EX_FOCUS)) EX_FOCUS=null;
  /* 第一顆是「全部」,沒篩選時它是亮的,篩選中點它回到全部 */
  const legend=`<button type="button" class="i all${EX_FOCUS?"":" on"}" data-gk="*">全部</button>`
   +lgs.map(g=>{
    const on=EX_FOCUS===g.key;
    return `<button type="button" class="i${on?" on":""}" data-gk="${esc(g.key)}"${
      on?` style="background:${g.color}1f;border-color:${g.color};color:${g.color}"`:""
    }><i style="background:${g.color}"></i>${esc(g.key)}</button>`;
  }).join("");
  /* 示範版不放年度數字 */
  const ys={chips:"",modals:""};   // 示範版不放年度統計
  const trend=`
    <section class="card tcard">
      <div class="thead"><h2>每月支出</h2>${ys.chips}</div>
      <div class="tnote">${EX_FOCUS
        ? `${esc(EX_FOCUS)} ${yr} 年 ${exEur(ysum[EX_FOCUS]||0)}`
        : `開銷目標 ${exEur(budget)}`}</div>
      <div class="exlegend">${legend}</div>
      <svg id="exTrend" role="img" aria-label="每月總支出組成堆疊柱狀圖"></svg>
      <div class="extip" id="exTip" hidden></div>
    </section>`;

  app.innerHTML = hero + askBlock + trend
    + `<div class="cols">${varCard}<div class="rcol">${incCard}${fixCard}</div></div>` + ys.modals;

  /* 圖例 = 篩選開關 */
  app.querySelectorAll("[data-gk]").forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const k=b.dataset.gk;
    EX_FOCUS = (k==="*" || EX_FOCUS===k) ? null : k;
    render();
  });

  /* 兩個數字 ↔ 兩個 popup:點數字開,點遮罩或 ✕ 關 */
  app.querySelectorAll("[data-ys]").forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const mk=document.getElementById("exm-"+b.dataset.ys); if(mk) mk.hidden=false;
  });
  app.querySelectorAll(".exmask").forEach(mk=>{
    mk.onclick=e=>{ if(e.target===mk || e.target.dataset.close) mk.hidden=true;
                    else e.stopPropagation(); };
  });

  const pb=document.getElementById("exPrev"), nb=document.getElementById("exNext");
  if(pb && i>0) pb.onclick=()=>{ EXP_MONTH=ms[i-1].month; PICK_OPEN=false; render(); };
  if(nb && i<ms.length-1) nb.onclick=()=>{ EXP_MONTH=ms[i+1].month; PICK_OPEN=false; render(); };

  /* 年月選單 */
  const pick=document.getElementById("exPick");
  if(pick) pick.onclick=e=>{ e.stopPropagation(); PICK_OPEN=!PICK_OPEN; PICK_YEAR=+EXP_MONTH.slice(0,4); render(); };
  const py=document.getElementById("pyPrev"), ny=document.getElementById("pyNext");
  if(py && !py.disabled) py.onclick=e=>{ e.stopPropagation(); PICK_YEAR--; render(); };
  if(ny && !ny.disabled) ny.onclick=e=>{ e.stopPropagation(); PICK_YEAR++; render(); };
  nav.querySelectorAll("[data-pick]").forEach(b=>b.onclick=e=>{
    /* 這行的 render() 之前被漏掉,結果點月份只改了變數、畫面完全不動 */
    e.stopPropagation(); EXP_MONTH=b.dataset.pick; PICK_OPEN=false; render(); });
  const pk=document.getElementById("exPicker");
  if(pk) pk.onclick=e=>e.stopPropagation();
  drawTrend(ms);
  WAS_MOBILE=isMobile();
}

/* ── 趨勢圖:每月一根堆疊柱 + 總額折線 ─────────────────────
   柱子拆出這個月的錢花在哪一層,折線把月與月的總額串起來。
   畫的順序是格線 → 柱子 → 基準虛線 → 折線與點,紅虛線才不會被柱子蓋掉。
   手機用窄 viewBox,不然 800 寬被壓到 360px,字會縮成 5px 看不見 */
function drawTrend(ms){
  const svg=document.getElementById("exTrend"); if(!svg) return;
  const D=window.EXPENSE_DATA, mob=isMobile();
  const W=mob?372:800, H=mob?212:230,
        padL=mob?38:60, padR=mob?12:20, padT=mob?26:30, padB=mob?34:35;
  const iw=W-padL-padR, ih=H-padT-padB;
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);

  /* 篩選中:柱子與折線都只看這一組,虛線目標是對總額的,這時不畫 */
  const fk=EX_FOCUS;
  const fCol=fk?((exGroups().find(g=>g.key===fk)||{}).color||"#2f6fed"):null;
  const gv=(mm,k)=>(groupSums(mm).find(g=>g.key===k)||{}).v||0;

  const vals=fk?ms.map(mm=>gv(mm,fk)):ms.map(exTotal);
  /* 柱子排掉代墊後,堆疊合計可能高過該月總額,取兩者的大值當上界才不會畫出格子外 */
  const stacks=fk
    ? ms.map(mm=>{ const v=gv(mm,fk); return v>0.005?[{name:fk,color:fCol,v:v}]:[]; })
    : ms.map(stackLayers);
  const tops=stacks.map(ls=>ls.reduce((a,l)=>a+l.v,0));
  const maxV=(fk?Math.max(...vals,...tops,1):Math.max(...vals,...tops,D.fixedBudget))*1.15;
  const n=ms.length;
  /* 格數 = 月份數 + 1:右邊永遠留一格呼吸,月份少時柱子也攤得開 */
  const slot=iw/Math.max(n+1,3);
  const px=k=>padL+slot*k+slot/2;
  const y=v=>padT+ih-(v/maxV)*ih;
  const bw=Math.min(mob?26:46, slot*0.55);
  const yBase=padT+ih;

  let s="";
  [0,.5,1].forEach(f=>{
    const yy=y(maxV*f);
    s+=`<line x1="${padL}" y1="${yy.toFixed(1)}" x2="${W-padR}" y2="${yy.toFixed(1)}" stroke="${f===0?"#d9dce3":"#eceff3"}" stroke-width="1"/>`;
    s+=`<text class="ax" x="${padL-8}" y="${(yy+4).toFixed(1)}" text-anchor="end">${f===0?"0":"NT$"+(Math.round(maxV*f/100)/10)+"k"}</text>`;
  });

  /* 只有最上面那層收圓角,中間層跟著圓會把堆疊的層次咬破 */
  const topSeg=(x,yy,w,h)=>{
    const r=Math.min(3,w/2,h);
    return `M${x.toFixed(1)} ${(yy+r).toFixed(1)}A${r} ${r} 0 0 1 ${(x+r).toFixed(1)} ${yy.toFixed(1)}`
      +`H${(x+w-r).toFixed(1)}A${r} ${r} 0 0 1 ${(x+w).toFixed(1)} ${(yy+r).toFixed(1)}`
      +`V${(yy+h).toFixed(1)}H${x.toFixed(1)}Z`;
  };

  /* 柱子連同透明的點擊區包在同一個 g,整根柱子都點得到 */
  ms.forEach((mm,k)=>{
    const x0=px(k)-bw/2, ls=stacks[k];
    let acc=0, bars="";
    ls.forEach((l,j)=>{
      const y0=y(acc+l.v), y1=y(acc); acc+=l.v;
      const h=Math.max(y1-y0,0.8), top=(j===ls.length-1);
      /* 1px 白邊當層與層之間的縫 */
      bars += top
        ? `<path d="${topSeg(x0,y0,bw,h)}" fill="${l.color}" stroke="#fff" stroke-width="1"/>`
        : `<rect x="${x0.toFixed(1)}" y="${y0.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" fill="${l.color}" stroke="#fff" stroke-width="1"/>`;
    });
    s+=`<g data-exi="${k}">${bars}`
      +`<rect class="hit" x="${(padL+slot*k).toFixed(1)}" y="${padT}" width="${slot.toFixed(1)}" height="${(ih+padB-14).toFixed(1)}"/></g>`;
  });

  if(!fk){
    const yb=y(D.fixedBudget);
    s+=`<line x1="${padL}" y1="${yb.toFixed(1)}" x2="${W-padR}" y2="${yb.toFixed(1)}" stroke="#d98a8a" stroke-width="1.5" stroke-dasharray="5 4"/>`;
  }

  /* 折線與點疊在柱子上面,但不吃滑鼠事件,點下去要落到下面的 hit 區 */
  const pts=vals.map((v,k)=>[px(k),y(v)]);
  let over="";
  if(pts.length>1){
    const line=pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
    over+=`<polyline points="${line}" fill="none" stroke="${fk?fCol:"#2f6fed"}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  }

  const curM=(D.updated||"").slice(0,7);
  ms.forEach((mm,k)=>{
    const v=vals[k], cx=pts[k][0], cy=pts[k][1];
    const on=mm.month===EXP_MONTH, overB=!fk && v>D.fixedBudget, run=mm.month===curM;
    const col=fk?fCol:(overB?"#c3312f":"#2f6fed");
    over+=`<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${run?5:4}" fill="${run?"#ffffff":col}" stroke="${run?col:"#fff"}" stroke-width="${run?2.5:1.5}"/>`;
    /* 每個月都標金額,選中的那個月大一號深色,其他月小一號灰色 */
    {
      /* 手機的柱子擠,沒選中的月份字再小一號 */
      const sm=mob&&!on;
      const lab=exEur(v), lw=lab.length*(on?7.2:(sm?5:6.2));
      let tx=cx, anc="middle";
      if(cx-lw/2<padL){ tx=padL; anc="start"; }
      else if(cx+lw/2>W-padR){ tx=W-padR; anc="end"; }
      /* 折線的點有時候低於柱頂(那個月堆疊比總額高),字要壓在柱頂上面才不會蓋到顏色 */
      const yLab=Math.min(cy, y(tops[k]));
      over+=`<text class="vl${on?" now":""}${sm?" sm":""}" x="${tx.toFixed(1)}" y="${(yLab-(on?16:11)).toFixed(1)}" text-anchor="${anc}" fill="${
        on?(fk?fCol:"#1d4fc4"):"#7a8090"}">${lab}</text>`;
    }
    over+=`<text class="ax" x="${cx.toFixed(1)}" y="${H-14}" text-anchor="middle" fill="${on?"#7a8090":"#9aa0ad"}"${on?' font-weight="600"':""}>${exShort(mm.month)}</text>`;
  });
  s+=`<g pointer-events="none">${over}</g>`;

  svg.innerHTML=s;
  /* 滑到哪根柱子就浮出那個月的組成;手機沒有 hover,點柱子切月份就好 */
  const tip=document.getElementById("exTip"), card=tip&&tip.parentElement;
  const showTip=(k,e)=>{
    if(!tip||mob) return;
    const mm=ms[k], ls=stacks[k], tot=fk?(exTotal(mm)||1):(tops[k]||1);
    tip.innerHTML=`<div class="th"><span>${exLabel(mm.month)}</span><span>${exEur(vals[k])}</span></div>`
      +ls.slice().reverse().map(l=>`<div class="tr"><i style="background:${l.color}"></i><span>${esc(l.name)}</span>
         <span class="a">${exEur(l.v)}</span><span class="p">${pctS(l.v,tot)}</span></div>`).join("");
    tip.hidden=false;
    const cr=card.getBoundingClientRect();
    let x=e.clientX-cr.left+14, yv=e.clientY-cr.top-10;
    if(x+tip.offsetWidth>cr.width-8) x=e.clientX-cr.left-tip.offsetWidth-14;
    if(yv+tip.offsetHeight>cr.height-8) yv=cr.height-tip.offsetHeight-8;
    tip.style.left=x+"px"; tip.style.top=Math.max(8,yv)+"px";
  };
  svg.querySelectorAll("g[data-exi]").forEach(g=>{
    const k=+g.dataset.exi;
    g.onclick=()=>{ EXP_MONTH=ms[k].month; render(); };
    g.onmouseenter=e=>showTip(k,e);
    g.onmousemove=e=>showTip(k,e);
    g.onmouseleave=()=>{ if(tip) tip.hidden=true; };
  });
}

/* 面板切換:股票面板 / 槓桿風險 / 資產 */
let PANEL="stock";
/* ══ 資產支出:桌面把「資產分析」與「支出」併成同一頁 ══════════════════
   (2026-08-20,Claude Design「Market Compass 桌面版 v2」第 9 項)
   上面四格總覽把兩邊重點拉到第一屏,中間一顆 sticky 切換鈕換明細。
   手機不動,底部還是四格分頁,afHead 在手機永遠 hidden。 */
function renderAF(){
  const el=document.getElementById("afHead");
  if(!el) return;
  const on=!isMobile() && (PANEL==="asset"||PANEL==="expense");
  el.hidden=!on;
  if(!on){ el.innerHTML=""; return; }
  const A=window.ASSET_DATA, E=(typeof exSummary==="function")?exSummary():null;
  const S=(A&&A.summary)||[];
  const kpi=(k,v,unit,sub,cls)=>`<div class="as-kpi"><div class="k">${k}</div>
    <div class="v num${cls?" "+cls:""}">${v}${unit?`<span class="u">${unit}</span>`:""}</div>
    <div class="d">${sub||""}</div></div>`;
  const eur=n=>"NT$"+Math.round(n).toLocaleString("en-US");
  // 順序刻意先支出再資產(使用者 2026-08-20):先看花掉多少,再看有多少
  const cells=[];
  if(E){
    cells.push(kpi(`${E.short}總支出`, eur(E.total), "", `必要開銷 ${eur(E.base)}`));
    cells.push(kpi("超出必要", (E.over>=0?"+":"")+eur(Math.abs(E.over)), "",
      E.over>=0?"超過必要開銷":"低於必要開銷", E.over>=0?"afdn":"afup"));
  }
  if(S[0]) cells.push(kpi(S[0].label, S[0].value, S[0].unit,
    `<span class="${S[0].deltaDir==="down"?"afdn":"afup"}">${S[0].delta||""}</span> ${S[0].sub||""}`));
  if(S[1]) cells.push(kpi(S[1].label, S[1].value, S[1].unit, S[1].sub||""));
  const seg=(k,t)=>`<button data-af="${k}" class="${PANEL===k?"on":""}">${t}</button>`;
  el.innerHTML=`<div class="as-kpis" id="afSummary">${cells.join("")}</div>
    <div id="afSeg">${seg("expense","支出")}${seg("asset","資產")}</div>`;
}

function switchPanel(p){

/* 手機版的頁首會跟著面板換標題(設計稿 1d:槓桿頁標題是「槓桿風險」) */
function syncHeader(){
  const h1=document.querySelector("header h1"), sub=document.getElementById("datadate");
  if(!h1||!sub) return;
  if(isMobile()&&PANEL==="asset"){
    h1.textContent="資產總覽";
    sub.parentElement.innerHTML=`<span id="datadate">${(window.ASSET_DATA&&ASSET_DATA.meta.date)||""}</span>`;
  }else if(isMobile()&&PANEL==="expense"){
    h1.textContent="每月支出";
    sub.parentElement.innerHTML=`<span id="datadate">${(window.EXPENSE_DATA&&EXPENSE_DATA.updated)||""} 更新</span>`;
  }else if(isMobile()&&PANEL==="risk"){
    h1.textContent="槓桿風險";
    const t=rkSnaps().length?(rkSnaps()[0].updated_at||""):"";
    sub.parentElement.innerHTML=`<span id="datadate">示範讀值 · ${rkRel(t)}</span>`;
  }else{
    h1.textContent="Market Compass Beta";
    // 有抓到即時報價就顯示報價時間,沒有就顯示資料檔的建置時間
    sub.parentElement.innerHTML=LIVE_AT
      ? `<span id="datadate">${LIVE_AT}</span> 即時報價`
      : `<span id="datadate">${DATA_DATE||"—"}</span> 更新`;
  }
}
let DATA_DATE="";
// 最後一次抓到即時報價的時間,顯示在標題列。
// 一定要宣告在 syncHeader() 前面:那個函式載入時就會跑,宣告放後面會踩到暫時性死區。
let LIVE_AT=null;

/* 底部分頁列(手機):大盤/個股/觀察/財報 屬股票面板,槓桿是另一個面板。
   點哪一格就切到對應的面板與分頁,並把亮起來的那格同步。 */
function goNav(k){
  if(k==="risk"){ switchPanel("risk"); }
  else if(k==="asset"){ switchPanel("asset"); }
  else if(k==="expense"){ switchPanel("expense"); }
  else if(k==="stock"){ switchPanel("stock"); switchTab(CUR_TAB); }
  else{ switchPanel("stock"); switchTab(k); }
  window.scrollTo(0,0);
}
function syncTabbar(){
  let cur = (PANEL==="risk") ? "risk"
    : (PANEL==="asset") ? "asset"
    : (PANEL==="expense") ? "expense"
    : (["macro","stocks","watch","earnings"].find(p=>!document.getElementById(p).hidden) || "macro");
  // 底部列已無觀察/財報格,這兩頁算在「個股」名下
  if(!document.querySelector('#tabbar [data-go="'+cur+'"]')) cur="stock";
  document.querySelectorAll("#tabbar button").forEach(b=>b.classList.toggle("on", b.dataset.go===cur));
  // 槓桿那格的狀態點跟著借款比例的安全/注意/危險走(設計稿 1e)
  const dot=document.getElementById("tabbarRiskDot");
  if(dot && typeof rkSnaps==="function" && rkSnaps().length){
    const kind=rkBorrowKind(rkNorm(rkSnaps()[0]).borrowRatio);
    dot.className="tb-dot"+(kind==="watch"?" warn":kind==="danger"?" danger":"");
  }
}

/* 切到指定分頁（重用 tab 切換邏輯，含 active 樣式更新） */
let CUR_TAB="macro";
function switchTab(t){
  CUR_TAB=t;
  document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("active", x.dataset.tab===t));
  ["macro","stocks","watch","earnings"].forEach(p=>{
    document.getElementById(p).hidden = t!==p;
  });
  // 四個子分頁共用同一張頂部脈搏卡,版型不跳動(2026-08-17 使用者要求)
  document.getElementById("topstrip").hidden = false;
  // 桌面:財報分頁不要右欄,清單佔滿版心
  const rl=document.getElementById("rail");
  if(rl) rl.hidden = t==="earnings";
  document.getElementById("stockPanel").classList.toggle("norail", t==="earnings");
  // 手機:個股/觀察/財報共用底部的「個股」格,子籤在這裡切
  const ms=document.getElementById("msub");
  if(ms){
    ms.hidden = !isMobile();   // 手機的股票面板固定顯示子籤(桌面用頂部分頁列)
    ms.querySelectorAll("button").forEach(b=>b.classList.toggle("on", b.dataset.go===t));
  }
  syncTabbar();
  syncHash();
}

/* ---------- 點擊彈窗:走勢線圖 ---------- */
const RANGE_PTS={ "1D":2, "1W":5, "1M":21, "3M":63, "6M":126, "1Y":252, "3Y":756, "ALL":1e9 };
const RANGE_LBL={ "1D":"1日", "1W":"1週", "1M":"1月", "3M":"3月", "6M":"6月", "1Y":"1年", "ALL":"全部" };
// 手機只留中長天期(1月起),1日與1週在手機上看不出東西
const RANGE_LBL_M={ "1M":"1月", "3M":"3月", "6M":"6月", "1Y":"1年", "3Y":"3年" };
let CHART={ sym:null, range:"6M" };

// 從 watchlist 找顯示名 / 說明
function wlEntry(sym){
  return [...(WL.market_holdings||[]), ...(WL.holdings||[]), ...(WL.watch||[])].find(h=>h.s===sym)
    || ((WL.chain_names&&WL.chain_names[sym])?{s:sym, dn:WL.chain_names[sym]}:{s:sym});
}
// 依選定區間取歷史資料尾段
function slice(hist){
  const n=hist.c.length, k=Math.min(n, RANGE_PTS[CHART.range]);
  return {d:hist.d.slice(n-k), c:hist.c.slice(n-k)};
}
function fmtDate(iso){ const p=iso.split("-"); return `${p[0]}/${p[1]}/${p[2]}`; }
function num(v,dp){ return v.toLocaleString(undefined,{minimumFractionDigits:dp,maximumFractionDigits:dp}); }

// avgLine=true 時,除了買點紅點,再畫一條「均價」水平虛線(手機版設計稿 1c)
// 桌面彈窗變寬(設計稿 E:viewBox 760x270),手機維持 680x250,所以尺寸改成參數
function chartSVG(d,c,cost,buys,avgLine,w,h){
  const W=w||680,H=h||250,pT=18,pB=16,pL=6,pR=6;
  const n=c.length;
  if(n<2) return `<div class="cnodata">此區間資料不足</div>`;
  const lo=Math.min(...c), hi=Math.max(...c);
  const minI=c.indexOf(lo), maxI=c.indexOf(hi);
  // 買點在此區間內的話,擴大 y 軸讓紅點永遠畫得進來
  let min=lo, max=hi;
  if(avgLine&&cost!=null){ min=Math.min(min,cost); max=Math.max(max,cost); }
  const inBuys=(buys||[]).map(b=>{
    let i=d.indexOf(b.d);
    if(i<0) i=d.findIndex(x=>x>=b.d);           // 買進日若非交易日,取其後第一個交易日
    if(i<0||!d.length||b.d<d[0]) return null;    // 不在目前顯示區間
    return {i, d:b.d, q:b.q, p:(b.p!=null?Number(b.p):c[i])};
  }).filter(Boolean).sort((a,b)=>a.i-b.i);
  inBuys.forEach(b=>{ min=Math.min(min,b.p); max=Math.max(max,b.p); });
  if(cost!=null&&!(buys&&buys.length)){ min=Math.min(min,cost); max=Math.max(max,cost); }
  const span=(max-min)||1;
  const X=i=> pL + i*(W-pL-pR)/(n-1);
  const Y=v=> pT + (1-(v-min)/span)*(H-pT-pB);
  const pts=c.map((v,i)=>`${X(i).toFixed(1)} ${Y(v).toFixed(1)}`);
  const line="M"+pts.join(" L");
  const area=`M${X(0).toFixed(1)} ${(H-pB).toFixed(1)} L`+pts.join(" L")+` L${X(n-1).toFixed(1)} ${(H-pB).toFixed(1)} Z`;
  const anchor=x=> x<70?"start":(x>W-70?"end":"middle");
  const lbl=(i,v,below)=>{
    const x=X(i), y=Y(v);
    const last=(i===n-1);                      // 最後一點有光暈圓點,標籤要多讓開一點
    let ty=below? y+(last?17:13) : y-(last?11:6);
    if(ty<9) ty=y+13;                 // 太貼上緣就翻到線的下面
    if(ty>H-3) ty=y-6;                // 太貼下緣就翻上去
    return `<text class="clabel" x="${x.toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="${anchor(x)}">${num(v,2)}</text>`;
  };
  /* 轉折點標價:不只標最高最低,明顯的波段轉折也寫上數字。
     顯著度 = 該點高過(低於)左右兩側最近反向轉折的幅度;
     短區間(1日/1週/1月)門檻放寬看得細,長區間收緊免得糊成一片。
     最後照 x 座標貪婪去重,重要度高的先佔位,買點位置優先讓給買點標籤。 */
  function priceLabels(){
    const SHORT=n<=40;
    const TH=span*(SHORT?0.05:0.13);
    const cand=[];
    for(let i=1;i<n-1;i++){
      const pk=c[i]>=c[i-1]&&c[i]>=c[i+1]&&(c[i]>c[i-1]||c[i]>c[i+1]);
      const tr=c[i]<=c[i-1]&&c[i]<=c[i+1]&&(c[i]<c[i-1]||c[i]<c[i+1]);
      if(!pk&&!tr) continue;
      let l=i,r=i;
      while(l>0&&(pk? c[l-1]<=c[l] : c[l-1]>=c[l])) l--;
      while(r<n-1&&(pk? c[r+1]<=c[r] : c[r+1]>=c[r])) r++;
      const prom=pk? c[i]-Math.max(c[l],c[r]) : Math.min(c[l],c[r])-c[i];
      if(prom>=TH) cand.push({i, peak:pk, w:prom/span});
    }
    const items=[{i:maxI,peak:true,w:9},{i:minI,peak:false,w:9},
                 {i:n-1,peak:c[n-1]>=c[0],w:8},{i:0,peak:c[0]>c[n-1],w:7}]
                .concat(cand).sort((a,b)=>b.w-a.w);
    // 買點只擋住正下方一小段(BGAP),不要整個 GAP 都吃掉,否則最高最低會被連帶消失
    const GAP=SHORT?W/17:W/13, BGAP=30, MAX=SHORT?10:8;
    // 高點標在線上方、低點標在線下方,兩排各自算間距,
    // 連續的高低轉折就不會互相擋住,短區間才標得密。
    const lane={up:[], dn:[]}, buyX=inBuys.map(b=>X(b.i)), out=[];
    items.forEach(it=>{
      if(out.length>=MAX) return;
      const x=X(it.i), row=it.peak?lane.up:lane.dn;
      if(buyX.some(t=>Math.abs(t-x)<BGAP)) return;
      if(row.some(t=>Math.abs(t-x)<GAP)) return;
      row.push(x); out.push(lbl(it.i, c[it.i], !it.peak));
    });
    return out.join("");
  }
  // 買點:紅點標在買進那天的位置(watchlist 的 buys:[{d,p}])。
  // 尚未提供日期的標的退回舊的平均成本橫線(cost)。
  let costHtml="";
  // 均價水平虛線(手機):買點紅點之外再給一條參考線,一眼看出現價在成本上面還下面
  let avgHtml="";
  if(avgLine&&cost!=null){
    const ay=Y(cost);
    avgHtml=`<line class="bline" x1="${pL}" x2="${W-pR}" y1="${ay.toFixed(1)}" y2="${ay.toFixed(1)}"/>
      <text class="blabel" x="${W-pR-4}" y="${(ay-5).toFixed(1)}" text-anchor="end">均價 ${num(cost,2)}</text>`;
  }
  if(inBuys.length){
    // 分批買進的點會擠在一起,標籤只給前後都夠空的孤立買點,其餘靠 hover 的 title
    const GAP=58;
    costHtml=inBuys.map((b,k)=>{
      const bx=X(b.i), by=Y(b.p);
      const ty=by<pT+16 ? by+16 : by-9;
      const tip=`${fmtDate(b.d)} 買${b.q?" "+b.q+" 股":""} @ ${num(b.p,2)}`;
      const prevFar=k===0||bx-X(inBuys[k-1].i)>=GAP;
      const nextFar=k===inBuys.length-1||X(inBuys[k+1].i)-bx>=GAP;
      const text=(prevFar&&nextFar)
        ? `<text class="blabel" x="${bx.toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="${anchor(bx)}">買 ${num(b.p,2)}</text>`
        : "";
      return `<circle class="bdot" cx="${bx.toFixed(1)}" cy="${by.toFixed(1)}" r="4.4"><title>${tip}</title></circle>${text}`;
    }).join("");
  }else if(cost!=null){
    const cy=Y(cost).toFixed(1);
    const ty=Y(cost)<pT+16 ? (+cy+14).toFixed(1) : (+cy-5).toFixed(1);
    costHtml=`<line class="bline" x1="${pL}" x2="${W-pR}" y1="${cy}" y2="${cy}"/>
      <circle class="bdot" cx="${pL+3}" cy="${cy}" r="3.4"/>
      <circle class="bdot" cx="${W-pR-3}" cy="${cy}" r="3.4"/>
      <text class="blabel" x="${pL+11}" y="${ty}">買點 ${num(cost,2)}</text>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="cgrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--cline)" stop-opacity="0.16"/>
      <stop offset="1" stop-color="var(--cline)" stop-opacity="0"/></linearGradient></defs>
    <path class="carea" d="${area}"/>
    <path class="cline" d="${line}"/>
    ${avgHtml}${costHtml}
    <circle class="cglow" cx="${X(n-1).toFixed(1)}" cy="${Y(c[n-1]).toFixed(1)}" r="7"/>
    <circle class="cdot" cx="${X(n-1).toFixed(1)}" cy="${Y(c[n-1]).toFixed(1)}" r="3.6"/>
    ${priceLabels()}
  </svg>`;
}

// 買進紀錄:把 watchlist 的 buys:[{d,q,p}] 列成清單,和線圖上的紅點一一對應。
// cost 用已解出的持倉均價(有含手續費的 e.cost 優先),last 拿來算每筆的浮動損益。
function buyHistoryHTML(e,last,cost){
  const buys=Array.isArray(e.buys)?e.buys.slice():null;
  if(!buys||!buys.length) return "";
  buys.sort((a,b)=> a.d<b.d?-1 : a.d>b.d?1 : 0);
  const qFmt=q=> q%1===0? String(q) : q.toFixed(2);
  let totQ=0;
  const rows=buys.map(b=>{
    const q=Number(b.q||0), p=Number(b.p||0); totQ+=q;
    const pl=(last!=null&&p)?(last/p-1)*100:null;
    const plHtml=pl!=null?`<span class="bh-pl ${pl>=0?'up':'dn'}">${pl>=0?'+':''}${pl.toFixed(1)}%</span>`:`<span class="bh-pl"></span>`;
    return `<div class="bh-row">
      <span class="bh-d num"><span class="bh-dot"></span>${fmtDate(b.d)}</span>
      <span class="bh-q num">${qFmt(q)} 股</span>
      <span class="bh-p num">@ ${num(p,2)}</span>
      ${plHtml}</div>`;
  }).join("");
  const avg=cost!=null?cost:(totQ?buys.reduce((a,b)=>a+Number(b.q||0)*Number(b.p||0),0)/totQ:0);
  return `<div class="bhist">
    <div class="bh-head"><span class="bh-t">我的買進紀錄</span>
      <span class="bh-sum">${buys.length} 筆 · 共 ${qFmt(totQ)} 股 · 均價 ${num(avg,2)}</span></div>
    ${rows}</div>`;
}
/* ══════ 手機版走勢彈窗的零件(設計稿 1c) ══════ */
// 均線格改成顯示「均線價格」+ 站上/跌破小籤,不再是乖離百分比
function mMaCards(r){
  const lab={5:"MA5",20:"MA20",60:"MA60",120:"MA120",240:"MA240"};
  return `<div class="mmacards">`+[5,20,60,120,240].map(k=>{
    const m=maByK(r,k);
    if(!m||m.v==null)
      return `<div class="mmac"><span class="l">${lab[k]}</span><span class="v na">—</span><span class="s na">—</span></div>`;
    const cls=m.above?"up":"dn";
    return `<div class="mmac"><span class="l">${lab[k]}</span>
      <span class="v ${cls}">${m.v.toLocaleString(undefined,{maximumFractionDigits:1})}</span>
      <span class="s ${cls}">${m.above?"站上":"跌破"}</span></div>`;
  }).join("")+`</div>`;
}
// 買進摘要 chip + 每一筆明細(日期 / 成交價 / 股數)
function mBuyBlock(e,last,cost){
  const buys=Array.isArray(e.buys)?e.buys.slice():null;
  if(!buys||!buys.length) return "";
  buys.sort((a,b)=> a.d<b.d?-1 : a.d>b.d?1 : 0);
  const totQ=buys.reduce((a,b)=>a+Number(b.q||0),0);
  const avg=(cost!=null)?cost:(totQ?buys.reduce((a,b)=>a+Number(b.q||0)*Number(b.p||0),0)/totQ:0);
  const pl=avg?(last/avg-1)*100:null;
  const qf=q=> q%1===0?String(q):q.toFixed(2);
  const rows=buys.map(b=>`<div class="mbrow"><i></i>
    <span class="d">${b.d}</span>
    <span class="p">${num(Number(b.p||0),2)}</span>
    <span class="q">× ${qf(Number(b.q||0))}</span></div>`).join("");
  const plHtml=(pl!=null)
    ? ` · 現價 <b class="${pl>=0?"up":"dn"}">${pl>=0?"+":"−"}${Math.abs(pl).toFixed(1)}%</b>` : "";
  return `<div class="mbuy-sum"><i></i>買進 ${buys.length} 筆 · 均價 <b>${num(avg,2)}</b>${plHtml}</div>
    <div class="mbuy-list">${rows}</div>`;
}

function maCardsHTML(r){
  const lab={5:"週 5MA",20:"月 20MA",60:"季 60MA",120:"半年 120MA",240:"年 240MA"};
  // 完稿:格子白底細框,顏色只落在數值;狀態(站上/跌破/今日穿越)用格底小標籤
  return `<div class="macards">`+[5,20,60,120,240].map(k=>{
    const m=maByK(r,k);
    if(!m||m.v==null) return `<div class="mac"><div class="macv na num">—</div><div class="macl">${lab[k]}</div><div class="macs muted">—</div></div>`;
    const cls=m.above?"up":"dn", s=m.diff>=0?"+":"";
    const crossed=m.cross==="bull"||m.cross==="bear";
    const st=m.cross==="bull"?`<span class="macs on up">今日站上</span>`
            :m.cross==="bear"?`<span class="macs on dn">今日跌破</span>`
            :`<span class="macs muted">${m.above?"站上":"跌破"}</span>`;
    return `<div class="mac${crossed?" crossed":""}"><div class="macv ${cls} num">${s}${m.diff.toFixed(1)}%</div>
      <div class="macl">${lab[k]}</div>${st}</div>`;
  }).join("")+`</div>`;
}

function renderChart(){
  const sym=CHART.sym, r=DATA[sym]; if(!r||!r.hist) return;
  const e=wlEntry(sym);
  const title=e.dn||sym;
  const sub=[sym.replace(/\.(TW|TWO)$/,""), e.note].filter(Boolean).join(" · ");
  const {d,c}=slice(r.hist);
  const last=c[c.length-1], prev=c.length>1?c[c.length-2]:last;
  const chg=(last/prev-1)*100, cCls=chg>=0?"up":"dn", cS=chg>=0?"+":"";
  const seg=(group,val,map)=>`<div class="segrow">`+Object.keys(map).map(kk=>
      `<button data-${group}="${kk}" class="${CHART.range===kk?'on':''}">${map[kk]}</button>`).join("")+`</div>`;
  const segs=`<div class="segs">
      ${seg("range",CHART.range,RANGE_LBL)}
    </div>`;
  const ip=interpret(r);   // 站上 n/5 改放右下的 sscore,解讀句不再重複帶分數
  // 持倉成本:彈窗頭顯示現價 vs 買點(cost,或 buys 的平均價)
  const buys=Array.isArray(e.buys)?e.buys:null;
  let cost=(e.cost!=null)?Number(e.cost):null;
  if(cost==null&&buys&&buys.length) cost=buys.reduce((a,b)=>a+Number(b.p||0),0)/buys.length;
  // 買點與 vs 買點收成一個 chip
  let costLine="";
  if(cost!=null){
    const cp=(last/cost-1)*100;
    costLine=`<div class="costchip num"><span class="bq"></span>買點 ${num(cost,2)}
      <span>vs 買點 <b>${cp>=0?"+":""}${cp.toFixed(1)}%</b></span></div>`;
  }
  // 卡片上的槓桿/加碼/減碼標記,彈窗標題也帶著
  const tags=(function(){
    const lev=Number(e.lev||1);
    // 排列狀態標籤(完稿):站上全部=多頭排列(綠),全部跌破=空頭排列
    let trend="";
    if(r.valid>0&&r.score===r.valid) trend=`<span class="trendtag up">多頭排列</span>`;
    else if(r.valid>0&&r.score===0) trend=`<span class="trendtag dn">空頭排列</span>`;
    return trend+(lev>1?`<span class="levtag">${lev>=3?"正三":"正二"} ${lev}x</span>`:"")
      +addBadgeFor(sym)+cutBadgeFor(sym);
  })();
  // ── 手機版彈窗(設計稿 1c):抓握條、價格靠右、均價虛線、買進明細、均線價格格 ──
  if(isMobile()){
    let trend="";
    if(r.valid>0&&r.score===r.valid) trend=`<span class="mtrend up">多頭</span>`;
    else if(r.valid>0&&r.score===0) trend=`<span class="mtrend dn">空頭</span>`;
    const lev=Number(e.lev||1);
    const mtags=trend+(lev>1?`<span class="mtag lev">${lev>=3?"正三":"正二"} ${lev}x</span>`:"")
      +mSignalTags(sym);
    // 標題已經印了代號,副標只留說明文字(設計稿 1c)
    const msub=e.note||e.group||sym;
    const msegs=`<div class="segs"><div class="segrow">`+Object.keys(RANGE_LBL_M).map(kk=>
        `<button data-range="${kk}" class="${CHART.range===kk?'on':''}">${RANGE_LBL_M[kk]}</button>`
      ).join("")+`</div></div>`;
    document.getElementById("chartSheet").innerHTML=
      `<div class="grab"></div>
       <div class="mshead">
         <div><div class="t"><b>${title}</b>${mtags}</div><div class="sub">${msub}</div></div>
         <div class="rt"><div style="text-align:right">
           <div class="px">${num(last,2)}</div>
           <div class="chg ${cCls}">${cS}${chg.toFixed(2)}% 今日</div>
         </div><button class="sclose" id="chartClose" aria-label="關閉">✕</button></div>
       </div>
       <div class="chartbox">${chartSVG(d,c,cost,buys,true)}</div>
       <div class="cdates"><span>${d.length?fmtDate(d[0]):""}</span><span>${d.length?fmtDate(d[d.length-1]):""}</span></div>
       ${mBuyBlock(e,last,cost)}
       ${assetLineHTML(sym)}
       ${msegs}
       ${mMaCards(r)}

document.addEventListener("click",e=>{

  if(e.target.closest("[data-goasset2]")){ switchPanel("asset"); return; }
  if(e.target.closest("#rkStkMore")){ RK_STKOPEN=!RK_STKOPEN; renderRisk(); return; }
  const afb=e.target.closest("#afSeg button");
  if(afb){ switchPanel(afb.dataset.af); window.scrollTo({top:0,behavior:"instant"}); return; }
  const af=e.target.closest("[data-asfold]");
  if(af){ ASSET_OPEN[af.dataset.asfold]=!ASSET_OPEN[af.dataset.asfold]; renderAsset(); return; }
  const tm=e.target.closest("[data-tlmode]");
  if(tm){ TL_MODE=tm.dataset.tlmode; renderAsset(); return; }
  // 手機槓桿頁的帳戶明細展開區
  if(e.target.closest("#rkIbToggle")){ RK_IBOPEN=!RK_IBOPEN; renderRisk(); return; }
  if(e.target.closest("#rkTodoClear")){ todoClear(); renderRisk(); return; }
  const tdEl=e.target.closest("[data-todo]");
  if(tdEl){ todoToggle(decodeURIComponent(tdEl.dataset.todo)); renderRisk(); return; }
  // 手機資產頁的展開區(歷年線圖 / 資產結構明細 / 帳戶 / 持倉 / ETF / 風險提示)
  if(e.target.closest("#asTlToggle")){ AS_TLOPEN=!AS_TLOPEN; renderAsset(); return; }
  const hbtn=e.target.closest("button[id^='asHold']");
  if(hbtn){ const i=+hbtn.id.slice(6); AS_HOLDS[i]=!AS_HOLDS[i]; renderAsset(); return; }
  const sc=e.target.closest("[data-asstruct]");
  if(sc){ const i=+sc.dataset.asstruct; AS_STRUCT=(AS_STRUCT===i)?null:i; renderAsset(); return; }
  const ar=e.target.closest("[data-asrisk]");
  if(ar){ const i=+ar.dataset.asrisk; AS_RISKOPEN=(AS_RISKOPEN===i)?null:i; renderAsset(); return; }
  const tb=e.target.closest("#tabbar button"); if(tb){ goNav(tb.dataset.go); return; }
  const mb=e.target.closest("#msub button"); if(mb){ goNav(mb.dataset.go); return; }
  // 訊號區展開/收合(在頂部訊號列,不在彈窗內)
  if(e.target.closest("#sigToggle")){ SIGOPEN=!SIGOPEN; renderTopStrip(); return; }
  if(e.target.closest("#rulesToggle")||e.target.closest("#rulesTop")){ openRules(); return; }
  // 規則彈窗:點 ✕ 或背景關閉,點內容不關
  if(e.target.closest("#rulesSheet")){ if(e.target.closest("#rulesClose")) closeRules(); return; }
  if(e.target.closest("#rulesModal")){ closeRules(); return; }
  const cf=e.target.closest("[data-chainf]");
  if(cf){ CHAINF=cf.dataset.chainf; renderWatch(); return; }
  // 篩選列(大盤區域 / 個股與觀察清單的多空排列):切換後重繪該分頁
  const fc=e.target.closest("[data-filter]");
  if(fc){
    const pane=fc.dataset.pane;
    FILTER[pane]=fc.dataset.filter;
    ({stocks:renderStocks, watch:renderWatch, macro:renderMacro})[pane]();
    return;
  }
  // 彈窗內互動
  if(e.target.closest("#chartSheet")){
    if(e.target.closest("[data-goasset]")){ closeChart(); switchPanel("asset"); return; }
    const rb=e.target.closest("[data-range]"); if(rb){ CHART.range=rb.dataset.range; renderChart(); return; }
    if(e.target.closest("#chartClose")){ closeChart(); return; }
    return; // 點 sheet 內其他區域不關閉
  }
  if(e.target.closest("#chartModal")){ closeChart(); return; } // 點背景關閉
  // 有歷史序列的(股票列或大盤卡)開彈窗線圖,其餘股票列沿用行內展開
  const el=e.target.closest("[data-sym]");
  if(el){
    const sym=el.dataset.sym;
    if(DATA && DATA[sym] && DATA[sym].hist){ openChart(sym); return; }
    if(el.classList.contains("row")) el.classList.toggle("open");
  }
});

/* 分頁寫進 URL hash(#macro/#stocks/#watch/#earnings/#risk/#asset):
   重新整理、加書籤、PWA 冷啟動都停在原分頁。用 replaceState,不塞瀏覽歷史。 */
const NAV_KEYS=["macro","stocks","watch","earnings","risk","asset","expense"];
function syncHash(){
  const key=(PANEL==="risk")?"risk":(PANEL==="asset")?"asset":(PANEL==="expense")?"expense"
    :(["macro","stocks","watch","earnings"].find(p=>!document.getElementById(p).hidden)||"macro");
  if(location.hash.slice(1)!==key) history.replaceState(null,"","#"+key);
}
(function(){
  const k=location.hash.slice(1);
  if(NAV_KEYS.includes(k)&&k!=="macro") goNav(k);
  /* #macro / #stocks / #watch / #earnings 跟面板的 id 同名,瀏覽器會把它當成錨點捲下去。
     手機的頁首吸頂、脈搏卡跟著捲,一開啟就會停在清單中段,所以載入後拉回頂端。
     桌面維持原本的行為,不動。 */
  if(isMobile()) window.addEventListener("load",function(){ window.scrollTo(0,0); });
})();
window.addEventListener("hashchange",function(){
  const k=location.hash.slice(1);
  if(NAV_KEYS.includes(k)) goNav(k);
});

/* ---------- load（讀取 watchlist.json / data.json,refresh 按鈕重抓同一流程） ---------- */
const refreshBtn=document.getElementById("refreshBtn");
function dataUrlsForProtocol(protocol){
  if(protocol==="file:"){
    const base="./";
    return [base+"watchlist.json", base+"data.json"];
  }
  return ["watchlist.json", "data.json"];
}
/* 重新載入 asset-data.js / leverage-data.js 這類「設定 window 全域」的資料腳本。
   加時間戳避開快取,載完把暫時的 script 標籤移掉。失敗不擋整個流程(回 false)。 */
function reloadScript(src){
  return new Promise(res=>{
    const el=document.createElement("script");
    el.src=src+"?t="+Date.now();
    el.onload=()=>{ el.remove(); res(true); };
    el.onerror=()=>{ el.remove(); res(false); };
    document.head.appendChild(el);
  });
}
function toast(msg){
  let t=document.getElementById("toast");
  if(!t){ t=document.createElement("div"); t.id="toast"; document.body.appendChild(t); }
  t.textContent=msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),2800);
}
let FIRST_LOAD=true;

/* ── 即時報價 ─────────────────────────────────────────────────────
   data.json 一天只重建一次(美股收盤後),盤中按更新看到的是昨天的收盤。
   這段去打 /api/prices(Cloudflare Function,伺服器端抓 Yahoo),把當下價格
   併回 DATA,均線值不重算(240 日均線盤中幾乎不動),只用新價格重算
   「站上/跌破」與「差幾 %」,這樣點點、判讀句、加碼訊號才會跟價格一致。
   歐洲交易所多數延遲約 15 分鐘,美股接近即時。抓不到就靜靜跳過,不擋畫面。 */
const LIVE_CHUNK=25;       // Workers 免費方案一個請求最多 50 個 subrequest

function mergeLive(sym,q){
  const r=DATA[sym];
  if(!r||r.error||q.p==null) return false;
  r.price=q.p;
  // 歷史序列補上今天這一根,今日漲跌與線圖最後一點才會跟著動
  if(r.hist&&Array.isArray(r.hist.c)&&r.hist.c.length){
    const d=r.hist.d, c=r.hist.c, last=d.length-1;
    if(q.d&&d[last]===q.d) c[last]=q.p;
    else if(q.d&&q.d>d[last]){ d.push(q.d); c.push(q.p); }
    else c[last]=q.p;
  }
  // 用新價格重算均線的上下與差距(均線值本身沿用早上算好的)
  let score=0, valid=0;
  (r.mas||[]).forEach(m=>{
    if(m.v==null) return;
    valid++;
    m.above=q.p>=m.v;
    m.diff=(q.p/m.v-1)*100;
    if(m.above) score++;
  });
  r.score=score; r.valid=valid;
  r.live=true;
  return true;
}

function fetchLive(){
  // 示範版沒有報價 API,價格直接用 data.json 裡的收盤
  return Promise.resolve(0);
  const syms=Object.keys(DATA||{}).filter(k=>k[0]!=="_"&&DATA[k]&&!DATA[k].error);
  if(!syms.length) return Promise.resolve(0);
  const jobs=[];
  for(let i=0;i<syms.length;i+=LIVE_CHUNK){
    const part=syms.slice(i,i+LIVE_CHUNK).map(encodeURIComponent).join(",");
    jobs.push(fetch("/api/prices?syms="+part).then(r=>r.ok?r.json():{}).catch(()=>({})));
  }
  return Promise.all(jobs).then(res=>{
    let n=0;
    res.forEach(o=>Object.keys(o||{}).forEach(k=>{ if(mergeLive(k,o[k])) n++; }));
    if(n){
      const t=new Date(), p=x=>String(x).padStart(2,"0");
      LIVE_AT=`${p(t.getHours())}:${p(t.getMinutes())}`;
    }
    return n;
  });
}

/* 讀資料一律加逾時。沒有這個的話,網路卡住(或 cookie 過期卡在轉圈)會永遠停在
   「讀取資料中…」,使用者只看到一個不會動的畫面,分不出是慢還是壞了。 */
function fetchJSON(url,ms){
  const ctl=("AbortController" in window)?new AbortController():null;
  const t=setTimeout(()=>{ if(ctl) ctl.abort(); }, ms||15000);
  return fetch(url, ctl?{signal:ctl.signal}:undefined).then(r=>{
    if(!r.ok) throw new Error(r.status===401?"登入過期":("HTTP "+r.status));
    return r.json();
  }).finally(()=>clearTimeout(t));
}
function loadData(){
  refreshBtn.classList.add("spinning");
  const prevStamp=DATA&&DATA._updated;
  const [watchlistUrl,dataUrl]=dataUrlsForProtocol(location.protocol);
  // 三個面板的資料一次全更新:股票(watchlist+data)、資產(asset-data)、槓桿(leverage-data)
  const staticScripts=(location.protocol==="file:")?[]:[reloadScript("asset-data.js"),reloadScript("leverage-data.js")];
  return Promise.all([
    fetchJSON(watchlistUrl+"?t="+Date.now()),
    fetchJSON(dataUrl+"?t="+Date.now(),25000),   // data.json 快 1MB,給久一點
    ...staticScripts,
  ]).then(([wl,data])=>{
    WL=wl; DATA=data;
    buildHoldMaps();
    DATA_DATE=(function(u){
      if(!u) return "—";
      const d=new Date(u); if(isNaN(d)) return u.slice(0,10);
      const p=n=>String(n).padStart(2,"0");
      return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
    })(DATA._updated);
    syncHeader();
    document.getElementById("status").style.display="none";
    renderTopStrip();
    renderMacro();
    renderStocks();
    renderWatch();
    renderEarnings();
    switchTab(CUR_TAB);   // 同步子籤顯示與選中狀態
    // 人在哪個面板就重畫哪個,槓桿狀態點也同步
    if(PANEL==="risk") renderRisk();
    if(PANEL==="asset") renderAsset();
    syncTabbar();
    // 檔案讀完先畫一次(不要等報價),再去抓即時價格,回來重畫
    const wasFirst=FIRST_LOAD;
    if(FIRST_LOAD) FIRST_LOAD=false;
    return fetchLive().then(n=>{
      if(n){
        syncHeader();
        renderTopStrip(); renderMacro(); renderStocks(); renderWatch(); renderEarnings();
        switchTab(CUR_TAB);
        if(PANEL==="risk") renderRisk();
        if(PANEL==="asset") renderAsset();
      }
      if(wasFirst) return;
      if(n) toast(`即時報價已更新 · ${LIVE_AT}(${n} 檔)`);
      else toast(prevStamp===DATA._updated ? `已經是最新的 · 資料 ${DATA_DATE}` : `已更新 · ${DATA_DATE}`);
    });
  }).catch(e=>{
    const why=(e&&e.name==="AbortError")?"太久沒回應":((e&&e.message)||"未知錯誤");
    if(!FIRST_LOAD) toast("讀不到資料:"+why);
    if(!DATA){
      const st=document.getElementById("status");
      st.style.display="";
      st.innerHTML=`<span class="nd">讀不到資料(${why})。</span>
        <button id="retryBtn" style="margin-left:8px;border:1px solid var(--line2);background:var(--card);
          border-radius:8px;padding:5px 12px;font-size:12.5px;cursor:pointer">重試</button>`;
      const rb=document.getElementById("retryBtn");
      if(rb) rb.onclick=()=>{ st.innerHTML='<span class="nd">讀取中…</span>'; loadData(); };
    }
  }).finally(()=>{
    refreshBtn.classList.remove("spinning");
  });
}
refreshBtn.addEventListener("click",loadData);
loadData();

/* 手機與桌面的清單結構不同(手機是 56px 的列,桌面是三欄卡),
   所以跨越 720px 這條線的時候要整個重畫,不能只靠 CSS。 */
window.matchMedia("(max-width:720px)").addEventListener("change",function(){
  switchTab(CUR_TAB);
  if(PANEL==="asset") renderAsset();
  if(!DATA||!WL) return;
  renderTopStrip(); renderMacro(); renderStocks(); renderWatch(); renderEarnings();
  if(PANEL==="risk") renderRisk();
});

/* 註冊 service worker:讓主畫面 app 沒網路時還打得開(顯示上一次的資料)。
   只在 https 或 localhost 有效,file:// 直接跳過。 */
if("serviceWorker" in navigator && location.protocol!=="file:"){
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
