    .dm-seg{display:flex;height:8px;border-radius:5px;overflow:hidden;gap:1.5px;}
    .dm-seg i{display:block;height:100%;}
    /* 小籤 */
    .dm-tag{flex:none;font-size:9.5px;font-weight:700;border-radius:5px;padding:1px 6px;
      white-space:nowrap;}
    .dm-tag.lev{font-size:10px;font-weight:800;color:#9a3412;background:#ffedd5;border:1px solid #fb923c;}
    .dm-tag.add{color:var(--add);background:var(--addbg);}
    .dm-tag.cut{color:var(--dn);background:var(--dnbg);}
    .dm-tag.st{color:#2f6fed;background:#e9f0fe;}
    .dm-tag.tw{color:#12805e;background:#e6f6ee;}
    .dm-tag.twetf{color:#b5701d;background:#fdf0e3;}
    .dm-tag.gold{color:#b8407a;background:#fdeaf1;}

    /* ── 槓桿頁 ── */
    .dm-hero{display:flex;align-items:baseline;gap:10px;margin:6px 0 2px;}
    .dm-hero .n{font-family:var(--num);font-size:54px;font-weight:800;letter-spacing:-.035em;
      line-height:1;font-variant-numeric:tabular-nums;}
    .dm-hero .x{font-family:var(--num);font-size:22px;font-weight:700;color:var(--muted);}
    .dm-hero .side{margin-left:auto;text-align:right;font-size:11.5px;color:var(--faint);
      line-height:1.4;white-space:nowrap;}
    .dm-hero.sm{margin:5px 0 0;gap:8px;}
    .dm-hero.sm .n{font-size:28px;letter-spacing:-.025em;line-height:1.1;}
    .dm-hero.sm .x{font-size:15px;}
    .dm-hero.sm .side{font-size:11px;}
    /* 敞口量表:綠/黃/紅三區在底,綠實條是現在的位置,黑刻度線是基準 */
    .dm-g{position:relative;display:flex;height:8px;border-radius:5px;overflow:hidden;margin:14px 0 0;}
    .dm-g.thin{height:5px;border-radius:4px;margin:9px 0 0;}
    .dm-g .z1{background:#d7f0e4;} .dm-g .z2{background:#fbeecf;} .dm-g .z3{flex:1;background:#fadbdb;}
    .dm-g .fill{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--up2);}
    .dm-gl{position:relative;height:16px;}
    .dm-gl .tick{position:absolute;top:-8px;width:2px;height:14px;background:var(--ink);}
    .dm-gl span.lo,.dm-gl span.hi{position:absolute;top:4px;font-family:var(--num);
      font-size:10.5px;color:var(--faint);}
    .dm-gl .lo{left:0;} .dm-gl .hi{right:0;}
    .dm-gl .mid{position:absolute;top:4px;transform:translateX(-50%);font-family:var(--num);
      font-size:10.5px;font-weight:700;color:var(--ink);white-space:nowrap;}
    .dm-stats{display:flex;align-items:baseline;gap:14px;white-space:nowrap;
      border-top:1px solid var(--line);margin-top:11px;padding-top:9px;}
    .dm-stats div{display:flex;align-items:baseline;gap:5px;}
    .dm-stats .k{font-size:11px;color:var(--faint);}
    .dm-stats .v{font-family:var(--num);font-size:13.5px;font-weight:700;
      font-variant-numeric:tabular-nums;}
    /* 借款比例:跟 券商 敞口收在同一張卡 */
    .dm-brw{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:12px;}
    .dm-brw .l{font-size:12.5px;color:var(--muted);white-space:nowrap;}
    .dm-brw .l b{font-family:var(--num);font-size:17px;color:var(--ink);margin-left:4px;}
    .dm-brw .r{flex:none;font-size:11.5px;font-weight:700;white-space:nowrap;}
    .dm-bbar{position:relative;display:flex;height:6px;border-radius:4px;overflow:hidden;margin-top:8px;}
    .dm-bbar .z1{background:#e9f7f0;} .dm-bbar .z2{flex:1;background:#fbeecf;}
    .dm-bbar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--up2);}
    .dm-bbar .tick{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);}
    .dm-bbar .tick.ib{background:#c2373b;}
    .dm-blbl{display:flex;justify-content:space-between;gap:10px;white-space:nowrap;
      font-size:10.5px;color:var(--faint);padding-top:5px;}
    .dm-blbl b{color:var(--ink);font-family:var(--num);}
    /* 離警戒多遠:標題左、大百分比右,細條與說明擺下一行 */
    .dm-st{padding:10px 0;border-bottom:1px solid #f4f6f8;}
    .dm-st .h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
    .dm-st .h .k{font-size:13.5px;font-weight:700;white-space:nowrap;}
    .dm-st .h .v{font-family:var(--num);font-size:19px;font-weight:800;letter-spacing:-.02em;}
    .dm-st .b{display:flex;align-items:center;gap:10px;margin-top:6px;}
    .dm-st .bar{flex:1;height:5px;border-radius:3px;background:#eef0f4;overflow:hidden;}
    .dm-st .bar i{display:block;height:100%;border-radius:3px;}
    .dm-st .n{flex:none;font-size:11px;color:var(--faint);white-space:nowrap;}
    /* 持倉曝險列 */
    .dm-hold{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid #f4f6f8;}
    .dm-hold i.d{width:7px;height:7px;border-radius:50%;flex:none;}
    .dm-hold .n{font-family:var(--num);font-size:14px;font-weight:700;}
    .dm-hold .p{margin-left:auto;font-family:var(--num);font-size:11.5px;color:var(--faint);}
    .dm-hold .m{font-family:var(--num);font-size:14px;font-weight:700;
      font-variant-numeric:tabular-nums;min-width:52px;text-align:right;}
    /* To-Do:編號 + 粗標題 + 灰內文 */
    .dm-mix{margin-top:6px;font-size:12px;color:var(--muted);font-weight:600;}
    .dm-mix b{font-family:var(--num);font-size:15px;color:var(--ink);margin:0 2px;}
    .dm-mix .nt{margin-left:6px;font-size:11px;font-weight:500;color:var(--faint);}
    .dm-todo{display:grid;grid-template-columns:18px 1fr;gap:9px;padding:11px 0;
      border-bottom:1px solid #f4f6f8;}
    .dm-todo .i{font-family:var(--num);font-size:11.5px;font-weight:800;color:var(--faint);padding-top:2px;}
    .dm-todo[data-todo]{cursor:pointer;}
    .dm-todo .ck{display:inline-flex;align-items:center;justify-content:center;
      width:16px;height:16px;margin-top:2px;padding-top:0;border:1.5px solid #d6dbe2;
      border-radius:5px;font-size:10px;color:#fff;background:#fff;}
    .dm-todo.done .ck{background:#0e9f6e;border-color:#0e9f6e;}
    .dm-todo .t .no{font-family:var(--num);font-size:11px;color:var(--faint);margin-right:6px;}
    .dm-todo.done .t{color:var(--faint);text-decoration:line-through;}
    .dm-todo.done .b{opacity:.4;text-decoration:line-through;}
    .dm-todofoot{display:flex;align-items:center;justify-content:space-between;gap:10px;
      margin-top:10px;font-size:11px;color:var(--faint);}
    .dm-todofoot button{border:1px solid var(--line2);background:#fff;border-radius:7px;
      padding:5px 9px;font-size:11px;color:var(--muted);}
    .dm-todo .t{font-size:13.5px;font-weight:700;line-height:1.45;}
    .dm-todo .b{font-size:11.5px;color:var(--muted);line-height:1.6;margin-top:3px;}

    /* ── 大盤頁 ── */
    .dm-pulse{padding:4px 16px 12px;}
    .dm-cells{display:grid;grid-template-columns:1fr 1fr;}
    .dm-cell{padding:12px 0 11px;border-bottom:1px solid #f4f6f8;min-width:0;}
    .dm-cell.l{padding-right:14px;border-right:1px solid #f4f6f8;}
    .dm-cell.r{padding-left:14px;}
    .dm-cell .k{font-size:11px;color:var(--faint);}
    .dm-cell .vv{display:flex;align-items:baseline;gap:7px;margin-top:3px;}
    .dm-cell .vv b{font-family:var(--num);font-size:25px;font-weight:800;letter-spacing:-.025em;
      line-height:1.1;font-variant-numeric:tabular-nums;}
    .dm-cell .vv em{font-style:normal;font-size:11.5px;font-weight:700;}
    .dm-cell .s{font-size:11px;color:var(--faint);margin-top:2px;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .dm-sig{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:11px 0 0;}
    .dm-sig .lbl{font-size:12.5px;font-weight:700;}
    .dm-chip{font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:20px;
      background:#f4f6f8;color:var(--muted);font-variant-numeric:tabular-nums;}
    .dm-chip.on{background:var(--addbg);color:var(--add);font-weight:700;}
    .dm-acts{margin-left:auto;display:flex;align-items:center;gap:12px;}
    .dm-acts button{border:none;background:none;padding:2px 0;color:var(--muted);cursor:pointer;
      font:600 11.5px/1 "Noto Sans TC",sans-serif;white-space:nowrap;}
    .dm-hl{font-size:11.5px;color:var(--muted);line-height:1.55;margin-top:7px;}
    .dm-hl b{color:var(--ink);}
    .dm-sgrp{display:grid;grid-template-columns:56px 1fr;gap:8px;padding:7px 0;}
    .dm-sgrp .g{font-size:11.5px;font-weight:700;}
    .dm-sgrp .x{font-size:11.5px;color:var(--muted);line-height:1.6;}
    .dm-none{font-size:12px;color:var(--muted);padding:9px 0 2px;}
    /* 標的清單:兩行 grid,右上五顆均線點、右下 vs 年線 */
    .dm-grp{font-size:11.5px;font-weight:700;color:var(--muted);padding:6px 4px;}
    .dm-list{padding:2px 14px 6px;margin-bottom:10px;}
    .dm-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;
      gap:6px 10px;padding:11px 0;border-bottom:1px solid #f4f6f8;cursor:pointer;}
    .dm-row:active{background:#fafbfc;}
    .dm-r1{display:flex;align-items:center;gap:6px;min-width:0;}
    .dm-r1 b{font-family:var(--num),"Noto Sans TC",sans-serif;font-size:15px;font-weight:700;
      white-space:nowrap;}
    .dm-note{font-size:10.5px;color:#c3c8cf;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .dm-dots{display:flex;align-items:center;gap:7px;justify-self:end;}
    .dm-dots i{width:11px;height:11px;border-radius:50%;display:block;box-sizing:border-box;}
    .dm-dots i.up{background:var(--dot-up);}
    .dm-dots i.dn{background:var(--card);border:2px solid var(--dot-dn);}
    .dm-dots i.na{background:var(--card);border:2px solid var(--dot-na);}
    .dm-r2{display:flex;align-items:baseline;gap:8px;min-width:0;}
    .dm-r2 .px{font-family:var(--num);font-size:15px;font-weight:600;color:#3f4652;
      font-variant-numeric:tabular-nums;}
    .dm-r2 .chg{font-family:var(--num);font-size:12px;font-weight:600;}
    .dm-r2 .chg.up{color:var(--up);} .dm-r2 .chg.dn{color:var(--dn);}
    .dm-yr{justify-self:end;font-family:var(--num);font-size:14px;font-weight:800;letter-spacing:-.01em;}
    .dm-yr.up{color:var(--up);} .dm-yr.dn{color:var(--dn);} .dm-yr.na{color:var(--faint);}

    /* ── 資產頁 ── */
    .dm-big{display:flex;align-items:baseline;gap:8px;margin:5px 0 0;}
    .dm-big .n{font-family:var(--num);font-size:44px;font-weight:800;letter-spacing:-.035em;
      line-height:1;font-variant-numeric:tabular-nums;}
    .dm-big .u{font-family:var(--num);font-size:16px;font-weight:700;color:var(--muted);}
    .dm-delta{flex:none;white-space:nowrap;font-size:11.5px;font-weight:700;color:var(--muted);}
    .dm-delta.up{color:var(--up);} .dm-delta.down{color:var(--dn);}
    .dm-sub{font-size:11.5px;color:var(--faint);margin-top:3px;}
    .dm-net{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
      white-space:nowrap;border-top:1px solid var(--line);margin-top:11px;padding-top:9px;}
    .dm-net .l{font-size:11.5px;color:var(--muted);}
    .dm-net .l b{font-family:var(--num);font-size:15px;color:var(--ink);margin-left:5px;}
    .dm-net .r{font-size:11px;color:var(--faint);}
    .dm-spark{display:block;width:100%;height:88px;margin-top:10px;}
    .dm-sparkl{display:flex;justify-content:space-between;font-family:var(--num);
      font-size:10.5px;color:var(--faint);padding-top:4px;}
    /* 資產結構:一列一種切法,展開才畫甜甜圈 */
    .dm-strow{padding:11px 0 10px;border-bottom:1px solid #f4f6f8;}
    .dm-strow .h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;white-space:nowrap;}
    .dm-strow .h .k{font-size:12.5px;color:var(--muted);}
    .dm-strow .h .v{font-family:var(--num);font-size:15px;font-weight:800;}
    .dm-strow .dm-seg{margin:8px 0 6px;}
    .dm-strow .f{display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
    .dm-strow .f .s{font-size:11px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .dm-strow .f button{flex:none;border:none;background:none;padding:0;color:var(--muted);
      cursor:pointer;font:600 11px/1.4 "Noto Sans TC",sans-serif;white-space:nowrap;}
    .dm-donut{display:flex;align-items:center;gap:14px;padding:10px 0 2px;}
    .dm-donut svg{flex:none;display:block;}
    .dm-lgd{min-width:0;display:flex;flex-direction:column;gap:6px;}
    .dm-lgd span{display:flex;align-items:center;gap:7px;font-size:11.5px;color:#3f4652;}
    .dm-lgd i{width:7px;height:7px;border-radius:50%;flex:none;}
    .dm-lgd b{font-family:var(--num);font-weight:700;color:var(--ink);}
    /* 帳戶明細 */
    .dm-acc{padding:9px 0 8px;border-bottom:1px solid #f4f6f8;}
    .dm-acc .h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;white-space:nowrap;}
    .dm-acc .h .n{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;}
    .dm-acc .h .v{font-family:var(--num);font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums;}
    .dm-acc .t{height:5px;border-radius:3px;background:#f4f6f8;overflow:hidden;margin-top:6px;}
    .dm-acc .t i{display:block;height:100%;border-radius:3px;}
    /* 持倉與 ETF 列 */
    .dm-pos{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #f4f6f8;}
    .dm-pos.link{cursor:pointer;}
    .dm-pos.link:active{background:#fafbfc;}
    .dm-pos .nm{flex:1 1 auto;min-width:0;font-size:13.5px;font-weight:700;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .dm-pos .pc{flex:none;font-family:var(--num);font-size:11.5px;color:var(--faint);}
    .dm-pos .vl{font-family:var(--num);font-size:13.5px;font-weight:700;
      font-variant-numeric:tabular-nums;min-width:54px;text-align:right;}
    /* 風險提示:點標題才展開內文 */
    .dm-risk{padding:10px 0 9px;border-bottom:1px solid #f4f6f8;}
    .dm-risk .h{display:flex;align-items:center;gap:9px;cursor:pointer;}
    .dm-risk .h i{width:16px;height:16px;border-radius:50%;flex:none;display:flex;
      align-items:center;justify-content:center;font-size:10px;font-weight:800;
      font-style:normal;color:#fff;}
    .dm-risk.warn .h i{background:var(--yellow);}
    .dm-risk.info .h i{background:#5b8def;}
    .dm-risk.ok .h i{background:var(--up2);}
    .dm-risk .h span{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .dm-risk .b{font-size:11.5px;color:var(--muted);line-height:1.65;padding:6px 0 0 25px;}
  }
  /* iPhone SE 這種 320px 機身:幾條原本不換行的列讓它換行,寧可多一行也不要被切掉 */
  @media(max-width:360px){
    .dm-stats{flex-wrap:wrap;gap:6px 12px;white-space:normal;}
    .dm-net{flex-wrap:wrap;white-space:normal;}
    .dm-hd.bl{flex-wrap:wrap;}
  }

  /* ══════════════════════════════════════════════════════════════════════
     桌面版 redesign(依 2026-08-16 設計稿):滿版 app bar + 分頁 sticky bar,
     股票面板改雙欄(清單 + 右側脈搏/訊號欄),槓桿與資產重排成寬版格局。
     全部包在 min-width:721px,手機版(<=720px)結構與樣式完全不動。
     ══════════════════════════════════════════════════════════════════════ */
  @media(min-width:721px){
    body{min-width:1280px;font-size:14px;}
    /* 版心 1232px:app bar 與分頁列滿版,其餘內容置中 */
    .wrap{max-width:none;margin:0;padding:0;}
    .main{display:block;max-width:1232px;margin:0 auto;padding:18px 24px 44px;}
    .shell{display:contents;}
    footer{margin-top:26px;}

    /* ── 頂部 app bar ── */
    header{position:sticky;top:0;z-index:60;height:57px;background:var(--card);
      border:none;border-bottom:1px solid var(--line2);border-radius:0;margin:0;box-shadow:none;
      display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
      padding:0 max(24px,calc((100% - 1184px)/2));}
    header .brandcol{display:flex;align-items:baseline;gap:12px;min-width:0;}
    header h1{font-size:18px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;margin:0;}
    header .sub{font-size:11.5px;color:var(--muted);white-space:nowrap;margin:0;}
    #panelToggle{position:static;transform:none;}
    .ptog button{height:30px;padding:0 15px;font-size:13px;}
    .hright{justify-self:end;margin-top:0;}
    .refresh{width:32px;height:32px;font-size:15px;}
    .refresh:hover{background:#f4f6f8;}

    /* ── 第二條 sticky bar:股票面板分頁 + 規則 ── */
    #stockChrome{position:sticky;top:57px;z-index:55;background:var(--card);
      border:none;border-bottom:1px solid var(--line2);border-radius:0;margin:0;overflow:visible;
      padding:0 max(24px,calc((100% - 1184px)/2));}
    .tabs{gap:28px;padding:0;border-bottom:none;height:44px;align-items:center;}
    .tabs button{padding:13px 0;}
    .tabs button.tabrules{margin-left:auto;font:600 12px/1 "Noto Sans TC",sans-serif;
      color:var(--muted);box-shadow:none;padding:6px 0;}
    .tabs button.tabrules:hover{color:var(--ink);}
    #topstrip{display:none;}

    /* ── 股票面板:左清單 + 右側欄 ── */
    #stockPanel{display:grid;grid-template-columns:minmax(0,1fr) 352px;gap:18px;align-items:start;}
    #stockPanel.norail{grid-template-columns:minmax(0,1fr);}
    #paneCol{display:block;min-width:0;}
    #status{grid-column:1 / -1;}
    #rail{display:flex;flex-direction:column;gap:12px;min-width:0;
      position:sticky;top:117px;}

    /* 清單:篩選 chip + 組標籤 + 白卡 */
    .filterbar{margin:2px 0 12px;}
    .blk{margin-bottom:18px;}
    .blk h2{font-size:12px;color:var(--muted);font-weight:600;margin:0 0 7px;}
    .blist{padding:2px 22px 8px;margin-bottom:0;}
    .bhead,.brow,.brow.clickable:hover{grid-template-columns:minmax(0,1fr) 260px 110px;}
    /* 表頭中欄的說明字只印一次,借用左右兩側的 gap 讓它保持單行 */
    .bhead .c2{white-space:nowrap;margin:0 -16px;}
    .brow{padding:14px 4px;}
    .brow.clickable:hover{margin:0 -22px;padding-left:26px;padding-right:26px;}

    /* 財報:兩欄卡片格線 */
    .egrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
    .egrid .ecard{margin-bottom:0;border-radius:12px;padding:11px 14px;}
    .egrid.past .ecard{opacity:.75;}

    /* ── 右欄:脈搏卡 ── */
    .rl-card{background:var(--card);border:1px solid var(--line2);border-radius:16px;
      box-shadow:0 1px 2px rgba(16,20,24,.05);}
    .rl-pulse{padding:15px 17px 14px;}
    .rl-top{display:flex;align-items:stretch;}
    .rl-l{flex:none;width:118px;}
    .rl-r{flex:1;min-width:0;}
    .rl-div{flex:none;width:1px;background:var(--line);margin:1px 14px;}
    .rl-lbl{font-size:10.5px;color:var(--muted);font-weight:600;}
    .rl-v{display:flex;align-items:baseline;gap:7px;margin-top:4px;}
    .rl-v b{font-family:var(--num);font-size:26px;font-weight:800;letter-spacing:-.02em;
      line-height:1;font-variant-numeric:tabular-nums;}
    .rl-v2{display:flex;align-items:baseline;gap:8px;margin-top:4px;white-space:nowrap;}
    .rl-v2>b{font-family:var(--num);font-size:20px;font-weight:800;letter-spacing:-.01em;line-height:1;}
    .rl-v2 .rl-side{font-size:10.5px;color:var(--muted);}
    .rl-v2 .rl-side b{color:var(--ink);font-family:var(--num),"Noto Sans TC",sans-serif;}
    .rl-tag{font-size:10.5px;font-weight:700;border-radius:6px;padding:2px 8px;color:#fff;}
    .rl-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px;padding-top:11px;
      border-top:1px solid var(--line);}
    .rl-chip{font-size:11px;font-weight:700;color:#fff;padding:3px 9px;border-radius:7px;}
    .rl-note{font-size:10.5px;color:var(--faint);margin-top:8px;}
    /* ── 右欄:今日訊號(桌面永遠全部展開) ── */
    .rl-sig{padding:14px 17px 13px;}
    .rl-sh{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
    .rl-sh .rl-st{font-size:12.5px;font-weight:700;margin-right:2px;}
    .rl-sc{font-size:11.5px;border-radius:20px;padding:2px 10px;font-variant-numeric:tabular-nums;
      border:1px solid var(--line);color:var(--muted);font-weight:500;}
    .rl-sc.on{border-color:var(--ink);color:var(--ink);font-weight:700;}
    .rl-none{color:var(--muted);font-size:13px;margin-top:10px;}
    .rl-row{display:flex;gap:9px;align-items:flex-start;margin-top:12px;}
    .rl-row+.rl-row{margin-top:8px;}
    .rl-mrow{display:flex;gap:9px;align-items:flex-start;padding:7px 0 0;}
    .rl-t{font-size:11.5px;font-weight:800;padding:4px 9px;border-radius:8px;flex:none;color:#fff;}
    .rl-t.a{background:var(--add);} .rl-t.c{background:var(--dn);}
    .rl-t.b{background:var(--up);min-width:52px;text-align:center;}
    .rl-t.s{background:var(--dn);min-width:52px;text-align:center;}
    .rl-t.n{background:var(--nearbg);color:var(--nearink);min-width:52px;text-align:center;}
    .rl-items{display:flex;flex-wrap:wrap;font-size:13px;line-height:1.4;min-width:0;}
    .rl-it{display:inline-flex;align-items:baseline;gap:5px;border-radius:7px;padding:2px 9px;
      margin:0 6px 4px 0;}
    .rl-it.a{background:var(--addbg);color:var(--add);}
    .rl-it.c{background:var(--dnbg);color:var(--dn);}
    .rl-it b{font-weight:700;}
    .rl-it .lv{font-size:9px;letter-spacing:1px;}
    .rl-moves{font-size:13px;line-height:1.9;min-width:0;}
    .rl-moves .mv{margin-right:10px;white-space:nowrap;}
    .rl-moves .sy{font-weight:600;color:var(--ink);}
    .rl-moves .sy.wl{color:var(--muted);font-weight:500;}
    .rl-divline{height:1px;background:var(--line);margin:11px 0 3px;}
    .rl-hl{font-size:12px;color:var(--muted);line-height:1.7;margin-top:10px;padding-top:9px;
      border-top:1px dashed var(--line);}
    .rl-hl b{color:var(--ink);}
    .rl-foot{font-size:10.5px;color:var(--faint);padding:0 4px;line-height:1.6;}

    /* ── 槓桿風險 ── */
    #riskPanel{gap:14px;}
    .rk-main{grid-template-columns:1fr 380px;}
    .rk-main-left{padding:22px 26px 24px;}
    .rk-main-right{padding:22px 24px 24px;}
    .rk-hero-row{display:flex;gap:44px;flex-wrap:wrap;}
    .rk-kv{gap:26px;margin-top:18px;}
    .rk-mark.lo{height:34px;}
    .rk-two{display:grid;grid-template-columns:1fr 400px;gap:14px;align-items:start;}
    .rk-holds{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start;}
    .rk-two .rk-card{padding:18px 22px 16px;}
    .rk-two .rk-card.todo{padding:18px 22px 14px;}
    .rk-foot2{font-size:12px;color:var(--muted);padding-top:10px;}
    .rk-foot2 b{font-family:var(--num);color:var(--ink);}
    .rk-foot2 button{border:none;background:none;color:var(--add);font-weight:700;font-size:12px;
      cursor:pointer;padding:0;}
    .rk-tbl.alloc{margin-top:10px;}
    .rk-detail{padding:18px 22px 20px;}

    /* ── 資產 ── */
    #assetPanel{gap:14px;}
    .as-kpi{padding:13px 16px;border-radius:14px;}
    .as-kpi .v{font-size:22px;}
    .as-card{border-radius:16px;padding:14px 18px 12px;}
    .as-two{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:12px;align-items:start;}
    /* 持倉卡收合(桌面) */
    .as-fold{display:flex;align-items:center;justify-content:space-between;cursor:pointer;-webkit-user-select:none;user-select:none;}
    .as-fold h3{margin:0;}
    .as-fold .fs{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:8px;}
    .as-fold .fs i{font-style:normal;color:var(--faint);font-size:11px;}
    .as-fold:hover .fs{color:var(--ink);}
    .as-hold.folded{padding:14px 18px;}
    .as-hold .as-fold+ .as-row{margin-top:8px;}
    /* 歷年線圖:年/月切換與今年總結 */
    .tl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;}
    .tl-head h3{margin:0;}
    .tl-seg{display:flex;gap:3px;padding:3px;background:#f4f6f8;border-radius:8px;}
    .tl-seg button{height:24px;padding:0 13px;border:none;border-radius:6px;background:transparent;
      color:var(--muted);font:600 12px/1 "Noto Sans TC",sans-serif;cursor:pointer;}
    .tl-seg button.on{background:#fff;box-shadow:0 1px 2px rgba(16,20,24,.12);color:var(--ink);font-weight:700;}
    .tl-sum{font-size:12px;color:var(--muted);background:#f7f8fa;border:1px solid var(--line);
      border-radius:8px;padding:7px 11px;display:inline-block;margin:6px 0 10px;}
    .tl-sum b.up{color:var(--up);} .tl-sum b.dn{color:var(--dn);}
    .tl-empty{padding:36px 0;text-align:center;color:var(--faint);font-size:12.5px;}
    .as-holds{gap:12px;}
    .as-holds .as-card{padding:14px 18px 8px;}
    .as-rows{column-count:2;}
    .as-row{grid-template-columns:auto 1fr 92px 48px 12px;}
    .as-row.notag{grid-template-columns:1fr 92px 48px 12px;}
    .as-kpis,.as-donuts{gap:12px;}

    /* ── 走勢彈窗 / 規則彈窗 ── */
    .modal{padding:24px;}
    .sheet{max-width:780px;padding:18px 22px 22px;box-shadow:0 12px 48px rgba(0,0,0,.25);}
    #rulesSheet{max-width:720px;}
    .bh-row{grid-template-columns:96px 70px 1fr 60px;}

    /* ══════════════════════════════════════════════════════════════════
       四個面板一致性收尾(2026-08-20,Claude Design「Market Compass 桌面版 v2」)。
       只調樣式,不動結構、不動資料、不動手機版。
       原稿還有第 9 項「把支出併進資產分析」,那要動 JS,先沒套。
       ══════════════════════════════════════════════════════════════════ */

    /* 1)數字一律等寬對齊 */
    .main{font-variant-numeric:tabular-nums;}
    #expensePanel #exTrend .vl{font-family:var(--num);}

    /* 2)支出面板原本用 IBM Plex Sans 與 Plex Mono,跟另外三個面板像兩個產品,
          改成吃全站字體與同一組數字字體,hero 數字也對到資產的 44/800 */
    #expensePanel{font-family:inherit;--mono:var(--num);}
    #expensePanel .hero .v{font-size:44px;font-weight:800;letter-spacing:-.02em;}
    #expensePanel .hero .k{font-size:13px;color:var(--muted);}

    /* 3)卡片外殼:同一個圓角、框線、陰影 */
    .blist,.rl-card,.rk-card,.as-card,.as-kpi,#expensePanel .card{
      border:1px solid var(--line2);border-radius:16px;
      box-shadow:0 1px 2px rgba(16,20,24,.05);}
    .egrid .ecard,#expensePanel .ask,#expensePanel .picker{border-radius:12px;}

    /* 4)卡片內距:主卡一律 18/22,量表卡與清單卡不再各有一套 */
    .rl-pulse,.rl-sig{padding:18px 20px;}
    .rk-main-left,.rk-main-right{padding:18px 22px 22px;}
    .rk-two .rk-card,.rk-two .rk-card.todo,.rk-holds .rk-card{padding:18px 22px;}
    .as-card,.as-holds .as-card,.as-hold.folded{padding:18px 22px;}
    #expensePanel .card,#expensePanel .hero{padding:18px 22px;}

    /* 5)卡與卡的間距一律 14 */
    #stockPanel,#riskPanel,#assetPanel,#expensePanel,#expensePanel #app{gap:14px;}
    .rk-two,.rk-holds,.as-two,.as-holds,.as-kpis,.as-donuts,.ax-two,.egrid,
    #expensePanel .cols{gap:14px;}

    /* 6)標題層級:主標 16/700,副標 12 faint */
    .rk-h h2,.ax-hd h3,.as-card h3,.as-fold h3,.tl-head h3,

<!-- 槓桿快照:本機檔(gitignore),線上讀不到就 404,槓桿面板自動隱藏。裡面是 window.MANUAL_SNAPSHOTS -->
<script src="leverage-data.js"></script>
<script src="asset-data.js"></script>

<script>
const IDX_META = {
  "^GSPC": {short:"SPX", full:"S&P 500"},
  "^NDX":  {short:"NDX", full:"Nasdaq 100"},
  "^SOX":  {short:"SOX", full:"費城半導體"},
  "^VIX":  {short:"VIX", full:"恐慌溫度計"},
};

let WL=null, DATA=null;

/* ---------- helpers ---------- */
function maByK(r,k){ return (r&&r.mas)?r.mas.find(m=>m.k===k):null; }
function dotCls(m){ if(!m||m.v==null) return "na"; return m.above?"up":"dn"; }
function dotsHtml(r){
  return [5,20,60,120,240].map(k=>{
    const m=maByK(r,k); const lbl=({5:"5",20:"20",60:"60",120:"120",240:"240"})[k];
    return `<span class="dot ${dotCls(m)}"><i></i>${lbl}</span>`;
  }).join("");
}
function yrHtml(r){
  const m=maByK(r,240);
  if(!m||m.v==null) return `<span class="yr na">—</span>`;
  const cls=m.above?"up":"dn", s=m.diff>=0?"+":"";
  return `<span class="yr ${cls}">${s}${m.diff.toFixed(1)}%</span>`;
}

/* ---------- 中文解讀（移植舊版邏輯，原封不動） ---------- */
function interpret(r){
  const m=r.mas; if(!m||r.valid===0) return "";
  const a=k=>{ const x=m.find(o=>o.k===k); return x&&x.v!=null?x.above:null; };
  const a5=a(5),a20=a(20),a60=a(60),a120=a(120),a240=a(240);
  const all=[a5,a20,a60,a120,a240].filter(x=>x!==null);
  if(all.length&&all.every(x=>x===true)) return "站上所有均線,多頭排列、趨勢最強。";
  if(all.length&&all.every(x=>x===false)) return "跌破所有均線,空頭排列、趨勢最弱。";
  if(a240===true){
    if(a60===true) return "中長期多頭(站上季線),短線拉回整理中。";
    if(a120===true) return "跌破季線但守住半年線,回檔中。";
    return "在年線之上、但已跌破半年線,回檔較深。";
  }
  if(a240===false){
    if(a60===true) return "長期仍在年線下,但已站回季線,屬反彈。";
    if(a20===true||a5===true) return "年線、季線之下,僅短線反彈。";
    return "中長期偏空,留意下檔風險。";
  }
  return "上市時間較短、年線未成形,僅供短中期參考。";
}

/* ---------- macro tab ---------- */
// 大盤分頁最頂的「持有大卡」（全寬,可點開彈窗）。歐元 ETF 都用這個。
const BIG_HOLD_CARDS = ["IWDA.AS", "VWCE.DE", "EMIM.AS", "XDWT.DE"];   // 依序渲染在大盤分頁最頂
function bigHoldCard(sym){
  const r=DATA[sym];
  const e=(typeof wlEntry==="function")?wlEntry(sym):{s:sym};
  const short=e.dn||sym;
  const cur=(r&&r.currency)||"";
  // 右上小字:備註或分類 + P/E(有才顯示),個股/觀察清單資訊不因改大卡而流失
  const full=[e.note||e.group||"", (r&&r.pe!=null)?`P/E ${r.pe}`:""].filter(Boolean).join(" · ");
  // 內建槓桿產品(正二/正三)標記:每日重設,長抱有耗損,均線訊號要比原型更嚴格看待
  const lev=Number(e.lev||1);
  const levLbl=lev>=3?"正三":"正二";
  const levTag=lev>1?`<span class="levtag">${levLbl} ${lev}x</span>`:"";
  // 跌破季線/半年線/年線的加碼標記(只給持有部位)
  const addTag=addBadgeFor(sym)+cutBadgeFor(sym);
  if(!r||r.error){
    return `<div class="icard span2">
      <div class="top"><span class="short">${short}${levTag}</span><span class="full">${full}</span></div>
      <div class="naidx">${(r&&r.error)||"無資料"}</div></div>`;
  }
  const px=r.price!=null?r.price.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}):"—";
  const m240=maByK(r,240);
  const yr=(m240&&m240.v!=null)?`<span class="yr ${m240.above?'up':'dn'}"><span class="lbl">vs 年線 </span>${m240.diff>=0?'+':''}${m240.diff.toFixed(1)}%</span>`
                               :`<span class="yr"><span class="lbl">vs 年線 </span>—</span>`;
  const ip=interpret(r);
  const ipHtml=ip?`<div class="interp">↳ ${ip}</div>`:"";
  const X=r.score, Y=r.valid;
  const pillBg=(X===Y)?"var(--green)":(X===0)?"var(--red)":"var(--yellow)";
  const pillHtml=`<span class="mapill" style="background:${pillBg}">站上 ${X}/${Y} 均線</span>`;
  // 分隔線列版型(完稿):左=代號+價格+解讀,中=P/E+5均線點,右=站上 X/5
  const note=e.note||e.group||"";
  const peHtml=(r&&r.pe!=null)?`<div class="brow-pe num">P/E ${r.pe}</div>`:`<div class="brow-pe"></div>`;
  // 當日漲跌(hist 末兩筆)
  let dayHtml="";
  if(r.hist&&r.hist.c&&r.hist.c.length>1){
    const c=r.hist.c, dc=(c[c.length-1]/c[c.length-2]-1)*100;
    dayHtml=`<span class="brow-day num ${dc>=0?'up':'dn'}">${dc>=0?'+':''}${dc.toFixed(2)}%</span>`;
  }
  const yr2=(m240&&m240.v!=null)
    ? `<span class="brow-yr">vs 年線 <b class="num ${m240.above?'up':'dn'}">${m240.diff>=0?'+':''}${m240.diff.toFixed(1)}%</b></span>`
    : `<span class="brow-yr">vs 年線 —</span>`;
  const badgeFull=(X===Y&&Y>0);
  const badge=`<span class="brow-badge${badgeFull?' full':''}">站上 ${X}/${Y}</span>`;
  const clickable=(r.hist)?` clickable" data-sym="${sym}`:'';
  return `<div class="brow${clickable}">
    <div class="brow-id">
      <div class="brow-h"><span class="brow-t num">${short}</span>${levTag}${addTag}${note?`<span class="brow-note">${note}</span>`:""}</div>
      <div class="brow-p"><span class="px num">${px}</span>${dayHtml}${yr2}</div>
      ${ip?`<div class="brow-interp">${ip}</div>`:""}
    </div>
    <div class="brow-ma">
      ${peHtml}
      <div class="dots">${dotsHtml(r)}</div>
    </div>
    <div class="brow-st">${badge}</div>
  </div>`;
}
/* ══════ 手機版清單(依設計稿 1b) ══════
   一列 56px:左=代號+小籤/全名 與 價格+今日漲跌,中=五顆均線點,右=vs 年線。
   5/20/60/120/240 的標籤移到表頭只印一次,每列因此省下一整行。
   判讀句、站上 n/5、P/E 都不在列上,點開走勢彈窗才看。 */
function isMobile(){ return window.matchMedia("(max-width:720px)").matches; }

// 手機列上的說明字要短,砍掉發行商前綴與幣別後綴(iShares Core S&P 500 · 歐元 → S&P 500)
function shortNote(txt){
  if(!txt) return "";
  let s=String(txt).split(" · ")[0].trim();
  s=s.replace(/^(iShares|Amundi|Xtrackers|Vanguard)\s+/i,"").replace(/^Core\s+/i,"");
  return s;
}
// 加碼/減碼在手機上收成小籤;兩級以上才標數字(加碼 2)
function mSignalTags(sym){
  const a=addLevelOf(sym), c=cutLevelOf(sym);
  let out="";
  if(a) out+=`<span class="mtag add">加碼${a.lv>1?" "+a.lv:""}</span>`;
  if(c) out+=`<span class="mtag cut">減碼${c.lv>1?" "+c.lv:""}</span>`;
  return out;
}
/* 手機清單列 v3:第一行 名稱 + 小籤 + 灰註記 + 右側五顆均線點,
   第二行 價格 + 當日漲跌 + 右側 vs 年線大字。點列開走勢彈窗。 */
function mRow(sym){
  const r=DATA[sym], e=wlEntry(sym);
  const name=e.dn||sym;
  if(!r||r.error){
    return `<div class="dm-row"><div class="dm-r1"><b>${name}</b>
      <span class="dm-note">${(r&&r.error)||"無資料"}</span></div></div>`;
  }
  const lev=Number(e.lev||1);
  const a=addLevelOf(sym), c=cutLevelOf(sym);
  const tags=(lev>1?`<span class="dm-tag lev">${lev>=3?"正三":"正二"} ${lev}x</span>`:"")
    +(a?`<span class="dm-tag add">加碼${a.lv>1?" "+a.lv:""}</span>`:"")
    +(c?`<span class="dm-tag cut">減碼${c.lv>1?" "+c.lv:""}</span>`:"");
  const note=shortNote(e.note||e.group||"");
  const px=r.price!=null?r.price.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}):"—";
  let chg="";
  if(r.hist&&r.hist.c&&r.hist.c.length>1){
    const cc=r.hist.c, d=(cc[cc.length-1]/cc[cc.length-2]-1)*100;
    chg=`<span class="chg ${d>=0?"up":"dn"}">${d>=0?"+":"−"}${Math.abs(d).toFixed(2)}%</span>`;
  }
  const m=maByK(r,240);
  const yr=(m&&m.v!=null)
    ? `<div class="dm-yr ${m.above?"up":"dn"}">${m.diff>=0?"+":"−"}${Math.abs(m.diff).toFixed(1)}%</div>`
    : `<div class="dm-yr na">—</div>`;
  const dots=[5,20,60,120,240].map(k=>`<i class="${dotCls(maByK(r,k))}"></i>`).join("");
  return `<div class="dm-row" data-sym="${sym}">
    <div class="dm-r1"><b>${name}</b>${tags}${note?`<span class="dm-note">${note}</span>`:""}</div>
    <div class="dm-dots">${dots}</div>
    <div class="dm-r2"><span class="px">${px}</span>${chg}</div>
    ${yr}
  </div>`;
}
// 把幾組(分區標題 + 標的清單)各包成一張清單卡,卡尾附均線點的說明
const M_LIST_FOOT="點列開走勢圖 · 圓點為 5 / 20 / 60 / 120 / 240 均線,實心站上、空心跌破,右側為 vs 年線";
function mListHtml(groups){
  const body=groups.map(g=>{
    const rows=g.list.filter(h=>DATA[h.s]).map(h=>mRow(h.s)).join("");
    if(!rows) return "";
    return (g.label?`<div class="dm-grp">${g.label}</div>`:"")
      +`<div class="dm-card dm-list">${rows}<div class="dm-foot">${M_LIST_FOOT}</div></div>`;
  }).join("");
  if(!body) return `<div class="dm-card dm-list"><div class="mempty">這個篩選條件下沒有標的</div></div>`;
  return body;
}

// 分隔線列表容器:欄位標頭 + 各列(完稿)
function blistHtml(rowsHtml){
  return `<div class="blist">
    <div class="bhead"><span class="c1">TICKER · 價格</span>
      <span class="c2">均線位置　5 · 20 · 60 · 120 · 240　●站上 ○跌破</span>
      <span class="c3">狀態</span></div>
    ${rowsHtml}
  </div>`;
}
function indexCard(sym){
  const meta=IDX_META[sym]||{short:sym,full:""};
  const r=DATA[sym];
  if(!r||r.error){
    return `<div class="icard"><div class="top"><span class="short">${meta.short}</span><span class="full">${meta.full}</span></div>
      <div class="naidx">${(r&&r.error)||"無資料"}</div></div>`;
  }
  const px=r.price!=null?r.price.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}):"—";
  if(sym==="^VIX"){
    const v=r.price;
    let txt,col;
    if(v>30){txt="高波動";col="var(--red)";}
    else if(v>=20){txt="偏高";col="var(--yellow)";}
    else {txt="平靜";col="var(--green)";}
    return `<div class="icard">
      <div class="top"><span class="short">${meta.short}</span><span class="full">${meta.full}</span></div>
      <div class="px">${px}</div>
      <div><span style="display:inline-block;margin-top:4px;font-size:13px;font-weight:800;color:#fff;padding:4px 12px;border-radius:8px;background:${col}">${txt}</span></div>
    </div>`;
  }
  const m240=maByK(r,240);
  const yr=(m240&&m240.v!=null)?`<span class="yr ${m240.above?'up':'dn'}"><span class="lbl">vs 年線 </span>${m240.diff>=0?'+':''}${m240.diff.toFixed(1)}%</span>`
                               :`<span class="yr"><span class="lbl">vs 年線 </span>—</span>`;
  const fb=r.fallback?`<span class="fb">指數免費方案未支援,以 ${r.src} 代替</span>`:"";
  const ip=interpret(r);
  const ipHtml=ip?`<div class="interp">↳ ${ip}</div>`:"";
  const X=r.score, Y=r.valid;
  const pillBg = (X===Y)?"var(--green)":(X===0)?"var(--red)":"var(--yellow)";
  const pillHtml=`<span class="mapill" style="background:${pillBg}">站上 ${X}/${Y} 均線</span>`;
  return `<div class="icard">
    <div class="top"><span class="short">${meta.short}</span><span class="full">${meta.full}</span></div>
    <div class="px">${px}</div>
    <div>${yr}</div>
    <div class="dots">${dotsHtml(r)}</div>
    <div class="foot">${pillHtml}</div>
    ${fb}
    ${ipHtml}
  </div>`;
}
/* 檔位表:NDX 距高點回落越深,目標水位越高。基準水位自己調這裡 */
const LADDER_BASE = 1.3;                       // 平常站的基準倍率
const LADDER = [ {dd:30, lev:2.0}, {dd:22.5, lev:1.75}, {dd:15, lev:1.5} ];  // 回落 % 由深到淺
const LADDER_EPS = 0.05;                       // 實際與目標差距在這個範圍內就算「到位」
/* 券商 TWD margin 年利率(基準 2.203% + 1.5%,LYNX 對照表 2026-08-12)。利率變了改這裡 */

/* 倍率顯示:1.3 / 1.5 / 1.75 / 2.0,不補多餘的零 */
function fmtLev(v){ return (Math.round(v*100)%10===0)?v.toFixed(1):v.toFixed(2); }

/* NDX 距高點回落 %:高點取歷史序列裡的最高收盤。序列只回看約兩年,
   所以嚴格說是「資料窗內高點」,不是歷史最高點。
   指數本身沒有 hist 時(舊 data.json)退回全球型 ETF 的序列,並標明來源。 */
const NDX_HIST_PROXY = "IWDA.AS";
function ndxDrawdown(){
  // DATA 是 let 宣告的,不能用 window.DATA 判斷(永遠 undefined,檔位會整組失效)
  if(typeof DATA==="undefined"||!DATA) return null;
  const pick=s=>{ const r=DATA[s];
    return (r&&!r.error&&r.price!=null&&r.hist&&r.hist.c&&r.hist.c.length)?r:null; };
  const own=pick("^NDX"), use=own||pick(NDX_HIST_PROXY);
  if(!use) return null;
  const hi=Math.max(...use.hist.c, use.price);
  if(!(hi>0)) return null;
  return { dd:(1-use.price/hi)*100, hi, proxy:!own };
}
/* 依檔位表換算目標水位:回落不到最淺一檔就是基準倍率 */
function ladderTarget(dd){
  const hit=LADDER.find(x=>dd>=x.dd);
  return hit?hit.lev:LADDER_BASE;
}
/* 全帳戶槓桿口徑(asset_build.py 算好放在 ASSET_DATA.leverage):
   所有帳戶加起來算,股數沒更新就視為不變,價格每天自動重抓。沒有就回 null。 */
function hhLev(){
  const L=window.ASSET_DATA&&ASSET_DATA.leverage;
  return (L&&L.lev!=null&&L.liquid>0)?L:null;
}
/* 目前實際倍率:優先用全帳戶口徑;沒有資產資料才退回 券商 帳戶的敞口(rkNorm + rkExpo)。 */
function actualLeverage(){
  const hh=hhLev(); if(hh) return hh.lev;
  const s=rkSnaps()[0]; if(!s) return null;
  const e=rkExpo(rkNorm(s));
  return (e.effRatio!=null&&isFinite(e.effRatio))?e.effRatio:null;
}
/* 檔位卡要顯示的東西整包算好:沒有槓桿資料時 act / gapTxt 為空,卡片自動少一段 */
function ladderState(){
  const d=ndxDrawdown(); if(!d) return null;
  const target=ladderTarget(d.dd);
  const act=actualLeverage();
  let gap=null, gapTxt="", kind="up";
  if(act!=null){
    gap=target-act;
    if(act<0.995){ gapTxt="先補到 1.0"; kind="warn"; }   // 階段一:滿倉之前不談 1.3 目標
    else if(Math.abs(gap)<=LADDER_EPS){ gapTxt="到位"; kind="up"; }
    else if(gap>0){ gapTxt=`可補 +${gap.toFixed(2)}`; kind="warn"; }
    else { gapTxt=`超出 +${(-gap).toFixed(2)}`; kind="dn"; }
  }
  return {dd:d.dd, proxy:d.proxy, target, act, gap, gapTxt, kind};
}

// 「(持)」與 dn 顯示涵蓋 market_holdings + holdings（兩清單合併建 SET / DN Map）
let HOLD_SET = new Set(), HOLD_DN = new Map();
function buildHoldMaps(){
  const held = [...(((WL&&WL.market_holdings)||[])), ...(((WL&&WL.holdings)||[]))];
  HOLD_SET = new Set(held.map(h=>h.s));
  HOLD_DN  = new Map(held.map(h=>[h.s, h.dn||h.s]));
}
function allTracked(){ return [...(WL.market_holdings||[]), ...(WL.holdings||[]), ...(WL.watch||[])]; }
function symLabel(s){ return HOLD_SET.has(s) ? `${HOLD_DN.get(s)}(持)` : s; }

function crossSignals(){
  const bull=[], bear=[];
  allTracked().forEach(h=>{
    const r=DATA[h.s]; if(!r||r.error||!r.mas) return;
    r.mas.forEach(m=>{ if(m.cross==="bull") bull.push({s:h.s,l:m.label});
                       else if(m.cross==="bear") bear.push({s:h.s,l:m.label}); });
  });
  return {bull,bear};
}
function nearSignals(){
  const arr=[];
  const NM={60:"季",120:"半年",240:"年"};
  allTracked().forEach(h=>{
    const r=DATA[h.s]; if(!r||r.error||!r.mas) return;
    r.mas.forEach(m=>{ if(m.near===true && m.cross==null && NM[m.k])
      arr.push({s:h.s,lbl:NM[m.k]}); });
  });
  return arr;
}
// 訊號區的標的名:省略「(持)」文字,持有與觀察改用深淺區分,滑過有 title
function symPlain(s){
  const held=HOLD_SET.has(s);
  const e=(typeof wlEntry==="function")?wlEntry(s):{};
  const name=held?(HOLD_DN.get(s)||s):(e.dn||s);
  return `<span class="sy${held?"":" wl"}" title="${held?"持有":"觀察清單"}">${name}</span>`;
}
// 合併同一標的的多條均線,並省略重複的「線」字(週線+月線 → 週/月)
function mergeSym(arr){
  const map=new Map();
  arr.forEach(x=>{ if(!map.has(x.s)) map.set(x.s,[]); map.get(x.s).push(x.l.replace("線","")); });
  return [...map.entries()].map(([s,ls])=>`${symPlain(s)} ${ls.join("/")}`);
}
function mergeNear(arr){
  const map=new Map();
  arr.forEach(x=>{ if(!map.has(x.s)) map.set(x.s,[]); map.get(x.s).push(x.lbl); });
  return [...map.entries()].map(([s,ls])=>`${symPlain(s)} ${ls.join("/")}`);
}

/* 加碼訊號:持有部位跌破季線/半年線/年線就是加碼點,跌得越深訊號越強。
   只看持有的部位(大盤 + 個股),觀察清單還沒進場不談加碼。 */
const ADD_LV={60:{n:1,lbl:"季線"},120:{n:2,lbl:"半年線"},240:{n:3,lbl:"年線"}};
// 單一標的的加碼判定,給卡片標記用(未持有回傳 null)
function addLevelOf(sym){
  const held=(WL.market_holdings||[]).some(h=>h.s===sym);   // 加減碼只看大盤,個股不算
  if(!held) return null;
  const r=DATA[sym];
  if(!r||r.error||!r.mas) return null;
  let best=null;
  [60,120,240].forEach(k=>{
    const m=maByK(r,k);
    if(!m||m.v==null||m.above) return;
    if(!best||ADD_LV[k].n>best.lv) best={k,lv:ADD_LV[k].n,lbl:ADD_LV[k].lbl,diff:m.diff};
  });
  return best;
}
function addBadgeFor(sym){
  const a=addLevelOf(sym);
  return a?`<span class="addbadge" title="跌破${a.lbl} ${a.diff.toFixed(1)}%">加碼 ${"●".repeat(a.lv)}</span>`:"";
}

/* 減碼訊號:加碼的鏡像。要求「站上所有均線」(趨勢還在)且年線乖離拉開,
   漲多了才減。已經回檔跌破均線的不算減碼,那是加碼區。
   門檻依 2026-08 持股乖離分布設定,要調整改這裡。 */
const CUT_TH=[{d:80,n:3},{d:60,n:2},{d:40,n:1}];
function cutLevelOf(sym){
  const held=(WL.market_holdings||[]).some(h=>h.s===sym);   // 加減碼只看大盤,個股不算
  if(!held) return null;
  const r=DATA[sym];
  if(!r||r.error||!r.mas||r.valid===0) return null;
  if(r.score!==r.valid) return null;                 // 沒站上全部均線就不是減碼點
  const m=maByK(r,240);
  if(!m||m.v==null) return null;
  const hit=CUT_TH.find(t=>m.diff>=t.d);
  return hit?{lv:hit.n,diff:m.diff,th:hit.d}:null;
}
function cutBadgeFor(sym){
  const c=cutLevelOf(sym);
  return c?`<span class="cutbadge" title="站上所有均線,年線乖離 +${c.diff.toFixed(1)}%">減碼 ${"●".repeat(c.lv)}</span>`:"";
}
function cutSignals(){
  const held=(WL.market_holdings||[]);   // 加減碼只看大盤,個股不算
  return held.map(h=>{
    const c=cutLevelOf(h.s);
    return c?{s:h.s,dn:h.dn||h.s,...c}:null;
  }).filter(Boolean).sort((a,b)=>b.lv-a.lv||b.diff-a.diff);
}
function cutSignalsHtml(){
  const list=cutSignals();
  if(!list.length) return "";
  const txt=list.map(x=>
    `<span class="cutit"><b>${x.dn}</b> 年線 +${x.diff.toFixed(0)}%<span class="lv">${"●".repeat(x.lv)}</span></span>`
  ).join("");
  return `<div class="sigrow addrow"><span class="tag c">減碼 ⤒</span><span class="sigtxt">${txt}</span></div>`;
}
function addSignals(){
  const held=(WL.market_holdings||[]);   // 加減碼只看大盤,個股不算
  const out=[];
  held.forEach(h=>{
    const r=DATA[h.s];
    if(!r||r.error||!r.mas) return;
    let best=null;
    [60,120,240].forEach(k=>{
      const m=maByK(r,k);
      if(!m||m.v==null||m.above) return;              // 站上就不是加碼點
      if(!best||ADD_LV[k].n>best.lv) best={k,lv:ADD_LV[k].n,lbl:ADD_LV[k].lbl,diff:m.diff};
    });
    if(best) out.push({s:h.s,dn:h.dn||h.s,...best});
  });
  return out.sort((a,b)=>b.lv-a.lv||a.diff-b.diff);   // 訊號強的在前,同級跌最深的在前
}
function addSignalsHtml(){
  const list=addSignals();
  if(!list.length) return "";
  const txt=list.map(x=>
    `<span class="addit"><b>${x.dn}</b> 跌破${x.lbl}<span class="lv">${"●".repeat(x.lv)}</span></span>`
  ).join("");
  return `<div class="sigrow addrow"><span class="tag a">加碼 ⤓</span><span class="sigtxt">${txt}</span></div>`;
}

/* 手機脈搏卡:2x2 格 + 今日訊號 chips + 一句摘要,展開才列分組明細 */
function mPulseCard(){
  const {bull,bear}=crossSignals();

  const chip=(lbl,n,on)=>n?`<span class="dm-chip${on?" on":""}">${lbl} ${n}</span>`:"";

    +chip("跌破",bearM.length)+chip("接近",nearM.length);

// 個股/觀察清單的分類:bull=站上全部均線、bear=全部跌破、na=無資料或均線未成形
function trendOf(sym){
  const r=DATA[sym];
  if(!r||r.error||r.valid===0) return "na";
  if(r.score===r.valid && r.valid>0) return "bull";
  if(r.score===0) return "bear";
  return "mid";
}
// 目前的篩選狀態(依分頁各自記憶):all=全部
const FILTER={ stocks:"all", watch:"all", macro:"all" };
function summaryHtml(list, pane){
  let bull=0, bear=0;
  list.forEach(h=>{ const t=trendOf(h.s); if(t==="bull") bull++; else if(t==="bear") bear++; });
  const cur=FILTER[pane]||"all";
  const btn=(kind,label,n)=>
    `<button class="fbtn ${kind}${cur===kind?" on":""}" data-filter="${kind}" data-pane="${pane}"
       aria-pressed="${cur===kind}">${label}<span class="fn">${n}</span></button>`;
  return `<div class="filterbar" role="group" aria-label="篩選">
    ${btn("all","全部",list.length)}
    ${btn("bull","多頭排列",bull)}
    ${btn("bear","空頭排列",bear)}
  </div>`;
}
// 依目前篩選取子集
function applyFilter(list, pane){
  const f=FILTER[pane]||"all";
  return f==="all"?list:list.filter(h=>trendOf(h.s)===f);
}
const FILTER_LBL={ bull:"多頭排列", bear:"空頭排列" };
function detailHtml(r){
  const rows=[5,20,60,120,240].map(k=>{
    const m=maByK(r,k);
    if(!m||m.v==null) return `<div class="mrow"><div class="ml">${({5:'週線 5',20:'月線 20',60:'季線 60',120:'半年線 120',240:'年線 240'})[k]}MA</div><div class="mv">—</div></div>`;
    const cls=m.above?"up":"dn", s=m.diff>=0?"+":"";
    const v=m.v.toLocaleString(undefined,{maximumFractionDigits:2});
    return `<div class="mrow ${cls}"><div class="ml">${({5:'週線 5',20:'月線 20',60:'季線 60',120:'半年線 120',240:'年線 240'})[k]}MA</div>
      <div class="mv">${v}</div><div class="md">${m.above?'站上':'跌破'} ${s}${m.diff.toFixed(1)}%</div></div>`;
  }).join("");
  return rows;
}

/* ---------- 觀察清單分頁（清單順序，group 顯示在代號下方小字） ---------- */
/* 觀察清單 = AI 產業鏈視圖(來自 Obsidian 心智圖,2026-08-17)。
   chips 是上/中/下游的「切段」,不是多空篩選;訊號計算不含這些觀察股。 */
let CHAINF="全部";

/* 一段(上游/中游/下游)的體檢數字。
   代號跨子分組去重(同一檔出現在兩個子分組時只算一次),
   DATA 沒資料或 error 的略過,分母用實際有資料的支數。
   今日漲跌沿用大卡的算法(hist 末兩筆收盤),vs 年線用 mas 裡 k=240 的 diff,不自己重算均線。 */
function chainStats(seg){
  const syms=[...new Set((WL.ai_chain||[]).filter(g=>g.chain===seg).flatMap(g=>g.syms||[]))];
  const items=[];
  syms.forEach(s=>{
    const r=DATA[s];
    if(!r||r.error) return;
    let day=null;
    if(r.hist&&r.hist.c&&r.hist.c.length>1){ const c=r.hist.c; day=(c[c.length-1]/c[c.length-2]-1)*100; }
    const m=maByK(r,240);
    items.push({s, day, yr:(m&&m.v!=null)?m.diff:null, score:Number(r.score||0), valid:Number(r.valid||0)});
  });
  if(!items.length) return null;
  const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
  const withDay=items.filter(x=>x.day!=null).sort((a,b)=>b.day-a.day);
  const valids=items.filter(x=>x.valid>0);
  return {
    seg, n:items.length,
    day:avg(withDay.map(x=>x.day)),
    yr:avg(items.filter(x=>x.yr!=null).map(x=>x.yr)),
    bull:valids.filter(x=>x.score===x.valid).length,
    bear:valids.filter(x=>x.score===0).length,
    ma:avg(valids.map(x=>x.score)),
    best:withDay[0]||null,
    worst:withDay.length>1?withDay[withDay.length-1]:null
  };
}
// 帶正負號與漲跌色的百分比,缺資料印連字號
function csPct(v,dp){
  if(v==null) return `<b class="na">-</b>`;
  return `<b class="${v>=0?"up":"dn"}">${v>=0?"+":"−"}${Math.abs(v).toFixed(dp)}%</b>`;
}
/* 觀察清單頂部的族群總結卡:
   選了某一段 → 該段體檢(平均今日 / 平均 vs 年線 / 多空排列 / 最強最弱)
   選「全部」 → 三段一行一段的對比,一眼看出哪段最熱 */
function chainSumCard(){
  const segs=[...new Set((WL.ai_chain||[]).map(g=>g.chain))];
  if(CHAINF!=="全部"){
    const t=chainStats(CHAINF);
    if(!t) return "";
    const nm=s=>{ const e=wlEntry(s); return e.dn||s; };
    const ext=(t.best&&t.worst)
      ? `<div class="cs-ext">最強 ${nm(t.best.s)} ${csPct(t.best.day,1)} · 最弱 ${nm(t.worst.s)} ${csPct(t.worst.day,1)}</div>`
      : "";
    return `<div class="chain-sum">
      <div class="cs-h">${t.seg} · ${t.n} 支</div>
      <div class="cs-kpis">
        <div class="cs-kpi">${csPct(t.day,2)}<span>平均今日漲跌</span></div>
        <div class="cs-kpi">${csPct(t.yr,1)}<span>平均 vs 年線</span></div>
      </div>
      <div class="cs-chips">
        <span class="cs-chip up">多頭排列 <b>${t.bull}</b> 支</span>
        <span class="cs-chip dn">空頭排列 <b>${t.bear}</b> 支</span>
        <span class="cs-chip">平均站上 <b>${t.ma!=null?t.ma.toFixed(1):"-"}</b>/5</span>
      </div>
      ${ext}
    </div>`;
  }
  const rows=segs.map(c=>chainStats(c)).filter(Boolean);
  if(!rows.length) return "";
  return `<div class="chain-sum">
    <div class="cs-h">AI 產業鏈 · 三段對比<span class="cs-sub">各段平均,點上方切段看細節</span></div>
    <div class="cs-tbl">
      <div class="cs-tr cs-thead"><span class="cs-seg"></span><span>平均今日</span><span>平均 vs 年線</span><span>多頭排列</span></div>
      ${rows.map(t=>`<div class="cs-tr">
        <span class="cs-seg">${t.seg}</span>
        <span>${csPct(t.day,2)}</span>
        <span>${csPct(t.yr,1)}</span>
        <span class="cs-bull"><b>${t.bull}</b>/${t.n}</span>
      </div>`).join("")}
    </div>
  </div>`;
}

/* ---------- 財報時間表分頁 ---------- */
function renderEarnings(){
  const list=(DATA._earnings||[]);
  const el=document.getElementById("earnings");
  if(!list.length){
    el.innerHTML=`<div class="blk"><div class="nd" style="padding:16px 4px">尚無財報日資料,等待下次自動更新。</div></div>`;
    return;
  }
  // 以本地日期零點為基準算距今天數
  const today=new Date(); today.setHours(0,0,0,0);
  const dn=s=>{ const e=wlEntry(s); return e.dn||s; };
  const fmtDate=dt=>`${dt.getMonth()+1}/${dt.getDate()}`;
  const wk=["日","一","二","三","四","五","六"];
  // 點擊個股 → 開 Yahoo 奇摩股市該股「相關新聞」頁(繁體財報分析/法人評等/市場評論)。
  // 用 /news 而非行情頁,直接落在最近財報的中文分析。代號原樣,BRK-B 直接可用。
  const zhUrl=s=>`https://tw.stock.yahoo.com/quote/${s}/news`;
  // 依日期分組:同一天的股票合併成一張卡
  const byDate=new Map();
  list.forEach(e=>{
    if(!byDate.has(e.date)) byDate.set(e.date, []);
    byDate.get(e.date).push(e);
  });
  const groups=[...byDate.entries()].map(([date,items])=>{
    const dt=new Date(date+"T00:00:00");
    return {date, dt, days:Math.round((dt-today)/864e5), items};
  });
  const upcoming=groups.filter(g=>g.days>=0).sort((a,b)=>a.dt-b.dt);
  const past=groups.filter(g=>g.days<0).sort((a,b)=>b.dt-a.dt);  // 最近的在前
  const cardHtml=g=>{
    let badge;
    if(g.days<0){ badge=`<span class="ebadge past">${-g.days} 天前</span>`; }
    else if(g.days===0){ badge=`<span class="ebadge today">今天</span>`; }
    else if(g.days<=7){ badge=`<span class="ebadge soon">${g.days} 天後</span>`; }
    else { badge=`<span class="ebadge">${g.days} 天後</span>`; }
    const est=g.items.some(x=>x.est)?`<span class="eest">預估</span>`:"";
    const chips=g.items.map(x=>`<a class="echip" href="${zhUrl(x.s)}" target="_blank" rel="noopener">${dn(x.s)}<span class="ecode">${x.s}</span><span class="elink">↗</span></a>`).join("");
    return `<div class="ecard">
      <div class="ecard-top">
        <div class="edate"><b>${fmtDate(g.dt)}</b><span>週${wk[g.dt.getDay()]}</span></div>
        <div class="emeta">${est}${badge}</div>
      </div>
      <div class="echips">${chips}</div>
    </div>`;
  };
  // 桌面:卡片排成兩欄格線,已公布那組整體淡化(設計稿 B)。手機維持一天一張的直排。
  const wrap=(cards,past)=>isMobile()?cards:`<div class="egrid${past?" past":""}">${cards}</div>`;
  let html="";
  if(upcoming.length){
    html+=`<div class="blk"><h2>即將公布</h2>${wrap(upcoming.map(cardHtml).join(""),false)}</div>`;
  }
  if(past.length){
    html+=`<div class="blk"><h2>最近已公布</h2>${wrap(past.map(cardHtml).join(""),true)}</div>`;
  }
  el.innerHTML=html;
}

/* ══════ 桌面右欄(設計稿 B):脈搏卡 + 今日訊號 ══════
   資料來源與手機完全相同(ladderState / hhLev / addSignals / crossSignals…),

/* 自動待辦:檔位表 + 今日加碼,算成 {title, body} 陣列,接在 To-Do 卡最上面 */
function autoTodos(){
  const L=ladderState(), hh=hhLev();
  if(!L||!hh) return [];
  const liq=hh.liquid;
  const nextStep=LADDER.slice().reverse().find(x=>x.dd>L.dd);
  const add=addSignals();
  let head="", body="";
  if(L.act!=null&&L.act<0.995){
    // 階段一:全資產曝險先補滿 100%,基準 1.3 是滿倉之後的事(使用者 2026-08-17 定案)
    const money=Math.round((1-L.act)*liq/1000);
    head=`先把曝險補到 1.0 倍`;
    body=`全資產口徑,現在 ${fmtLev(L.act)} 倍,差約 <b>${money}K</b> 曝險。`
      +`路線:用融資買兩倍 ETF(每 1 塊算 2 塊,約需 <b>${(money/2).toFixed(1)}K</b>)。`
      +`融資借款守在淨值 40% 以內,天花板約 1.05 倍。`
      +`滿倉之後才用小回檔往基準 ${fmtLev(LADDER_BASE)} 爬,大跌照檔位表。`;
  }else if(L.gap>0.02){
    // 檔位未到位:要補倉
    const money=Math.round(L.gap*liq/1000);
    head=`把槓桿補到 ${fmtLev(L.target)} 倍`;
    body=`大盤距高點 -${L.dd.toFixed(1)}%,目標 ${fmtLev(L.target)} 倍,現在 ${fmtLev(L.act)} 倍。`
      +`買 <b>約 ${money}K</b> 的兩倍 ETF,或等值原型換過去。`;
  }else if(L.gap<-0.02){
    head=`收回到基準 ${fmtLev(LADDER_BASE)} 倍`;
    body=`現在 ${fmtLev(L.act)} 倍,超出基準。把超出的兩倍 ETF 賣回原型。`;
  }else{
    head=`維持現在的 ${fmtLev(L.act)} 倍`;
    body=nextStep
      ? `大盤距高點 -${L.dd.toFixed(1)}%,再跌到 <b>-${nextStep.dd}%</b> 才升到 ${fmtLev(nextStep.lev)} 倍(屆時約換 ${Math.round((nextStep.lev-LADDER_BASE)*liq/1000)}K)。`
      : `大盤距高點 -${L.dd.toFixed(1)}%,已在最高檔。`;
  }
  /* 「今日可加碼 N 檔」那條拿掉了(2026-08-21):他說今天要加碼什麼他自己判斷,
     to-do 永遠不要寫這種。addSignals 還留著給其他卡用 */
  return [{title:head, body:body}];
}

function railSigHtml(){
  const {bull,bear}=crossSignals();

  const add=addSignals(), cut=cutSignals();
  const bullM=mergeSym(bull), bearM=mergeSym(bear), nearM=mergeNear(near);
  const chip=(lbl,n,strong)=>n?`<span class="rl-sc${strong?" on":""}">${lbl} ${n}</span>`:"";
  const chips=chip("加碼",add.length,1)+chip("減碼",cut.length,1)
    +chip("站上",bullM.length)+chip("跌破",bearM.length)+chip("接近",nearM.length);
  const none=(!add.length&&!cut.length&&!bullM.length&&!bearM.length&&!nearM.length);
  const itemRow=(cls,lbl,items)=>items?`<div class="rl-row"><span class="rl-t ${cls}">${lbl}</span>
      <span class="rl-items">${items}</span></div>`:"";
  const addRow=itemRow("a","加碼 ⤓",add.map(x=>
    `<span class="rl-it a"><b>${x.dn}</b> 跌破${x.lbl}<span class="lv">${"●".repeat(x.lv)}</span></span>`).join(""));
  const cutRow=itemRow("c","減碼 ⤒",cut.map(x=>
    `<span class="rl-it c"><b>${x.dn}</b> 年線 +${x.diff.toFixed(0)}%<span class="lv">${"●".repeat(x.lv)}</span></span>`).join(""));
  const moveRow=(cls,lbl,arr)=>arr.length?`<div class="rl-mrow"><span class="rl-t ${cls}">${lbl}</span>
      <span class="rl-moves">${arr.map(t=>`<span class="mv">${t}</span>`).join("")}</span></div>`:"";
  const hasMoves=bullM.length||bearM.length||nearM.length;
  const moves=hasMoves
    ? ((add.length||cut.length)?`<div class="rl-divline"></div>`:"")
      +moveRow("b","站上 ↑",bullM)+moveRow("s","跌破 ↓",bearM)+moveRow("n","接近 ≈",nearM)
    : "";
  const parts=[];
  if(add.length) parts.push("加碼最強："+add.slice(0,2).map(x=>
    `<b>${x.dn}</b> 跌破${x.lbl} ${x.diff.toFixed(1)}%`).join("、"));
  if(cut.length) parts.push("減碼："+cut.slice(0,1).map(x=>
    `<b>${x.dn}</b> 高於年線 +${x.diff.toFixed(0)}%`).join("、"));
  const headline=parts.length?`<div class="rl-hl">${parts.join("　·　")}</div>`:"";
  return `<div class="rl-card rl-sig">
    <div class="rl-sh"><span class="rl-st">今日訊號</span>${chips}</div>
    ${none?`<div class="rl-none">今日無訊號</div>`:addRow+cutRow+moves}
    ${headline}
  </div>`;
}

/* ==========================================================
   槓桿風險面板:資料來自本機 leverage-data.js(window.MANUAL_SNAPSHOTS)。
   計算式移植自 ib-leverage-dashboard/public/app.js,單一真相同一套。

/* IB 帳戶內的借款紅線:2026-08-19 從 20% 放寬到 40%。
   理由:正2 只能在 IB 買,槓桿全壓這一個帳戶,而 IB 淨值只佔全帳戶不到兩成,
   20% 會在總曝險還不到 1.0x 就卡住。危險區維持 50%。
   「借款不超過總資產 20%」是另一條(分母是總資產),沒有改,在總曝險卡上。 */
const RK_LIMIT={safeMax:.4, watchMax:.5};
const RK_SEG={"IWDA":"#12a670","VWCE":"#1d6fd8","SGLD":"#e0a132","LVE":"#d16ba5","EMIM":"#7c5cd6","XDWT":"#d95f18"};
/* 券商 B持倉:資料來自 ASSET_DATA(每天自動重算),整理成跟 券商 快照一樣的欄位,
   兩張卡才能共用同一個渲染函式。券商 B目前全是原型(1x),沒有融資。 */
const IB_SYM={"IWDA":"IWDA.AS","VWCE":"VWCE.DE","SGLD":"SGLD.AS","LVE":"LVE.PA"};
const YUANTA_META={
  "0052.TW":{name:"富邦科技",ticker:"0052"},
  "00713.TW":{name:"元大高息低波",ticker:"00713"},
};
/* 個股(2026-08-20 定案):
   個股卡從資產分析搬到槓桿風險最下面。放在有融資那個帳戶裡的個股也算在這張,
   不算進「持倉曝險配置 · IB」,因為那張卡是拿來看 ETF 的。 */
function stockBlock(){
  const A=window.ASSET_DATA;
  return (A&&A.holdings&&A.holdings.find(h=>h.title.indexOf("個股")>=0))||null;
}
function stockSymSet(){
  const b=stockBlock();
  return new Set(b?b.rows.map(r=>r.sym).filter(Boolean):[]);
}
/* 一筆券商持倉是不是個股。快照只有簡稱(IWDA / VWCE),先用 IB_SYM 對回 Yahoo 代號 */
function isStockHold(h,set){
  const nm=String(h.name||"").toUpperCase();
  const sym=h.sym||IB_SYM[nm]||nm;
  return set.has(sym);
}
function yuantaHoldings(){
  const A=window.ASSET_DATA; if(!A||!A.holdings) return [];
  const out=[];
  A.holdings.forEach(b=>b.rows.forEach(r=>{
    const m=YUANTA_META[r.sym]; if(!m) return;
    out.push({name:m.name, ticker:m.ticker, sym:r.sym, market_value:r.value, leverage:m.lev||1});
  }));
  return out.sort((a,b)=>b.market_value-a.market_value);
}
const RK_FB=["#8b5cf6","#0891b2","#65a30d","#db2777","#ea580c"];
function rkSnaps(){ return Array.isArray(window.MANUAL_SNAPSHOTS)?window.MANUAL_SNAPSHOTS:[]; }
function rkHas(){ return rkSnaps().length>0; }
function rkNorm(s){
  const net=+s.net_liquidation||0;
  const settled=+(s.settled_cash ?? s.total_cash_value ?? 0);
  const cash=+(s.cash_value ?? settled);
  const gross=+(s.gross_position_value ?? Math.max(net-Math.max(cash,0),0));
  const loan=+(s.margin_loan ?? Math.max(-cash, gross-net, 0));
  return {...s, net, cash, gross, loan,
    exposureRatio: net>0?gross/net:null, borrowRatio: net>0?loan/net:null};
}
function rkExpo(s){
  let boost=0; (s.holdings||[]).forEach(h=>{ const mv=+h.market_value||0, lev=+h.leverage||1;
    if(lev>1) boost+=Math.max(mv*(lev-1),0); });
  const eff=s.gross+boost;
  return {book:s.gross, boost, eff,
    effRatio:s.net>0?eff/s.net:null, bookRatio:s.net>0?s.gross/s.net:null, boostRatio:s.net>0?boost/s.net:null};
}
function rkStress(s){
  const gross=s.gross, mm=+s.maintenance_margin||0, el=+s.excess_liquidity||0, net=s.net, loan=Math.max(s.loan,0);
  return {
    marginCallDrop: gross>mm&&el>0 ? el/(gross-mm) : null,        // 距券商追繳
    breachDrop: loan>0&&gross>0 ? (net-loan/RK_LIMIT.safeMax)/gross : null, // 碰 40% 警戒
    cushionRatio: net>0 ? el/net : null,                         // 強平安全墊
    cashBuffer: net>0 ? s.cash/net : null,                       // 現金緩衝
  };
}
function rkMoney(v,cur){ if(v==null||isNaN(+v)) return "—";
  return (+v).toLocaleString(undefined,{maximumFractionDigits:0})+(cur?" "+cur:""); }
function rkPct(v){ return v==null||isNaN(+v)?"—":(v*100).toFixed(0)+"%"; }
function rkRel(t){
  const d=new Date((t||"").replace(" ","T")); if(isNaN(d)) return t||"";
  const min=Math.max(Math.floor((Date.now()-d.getTime())/6e4),0);
  if(min<1) return "剛剛"; if(min<60) return min+" 分鐘前";
  const h=Math.floor(min/60); if(h<24) return h+" 小時前"; return Math.floor(h/24)+" 天前";
}
/* 正二與原型的比例。硬規則:原型市值要大於正二,也就是「正二占原型」不超過 100%。 */
function levMix(list){
  let two=0, one=0;
  (list||[]).forEach(h=>{ const mv=+h.market_value||0; if((+h.leverage||1)>1) two+=mv; else one+=mv; });
  return {two, one, pct: one>0?two/one*100:null};
}
function levMixHtml(list, empty){
  const m=levMix(list);
  if(!m.two) return `正二占原型 <b>0%</b><span class="nt">${empty||"上限 100%"}</span>`;
  const col=m.two<=m.one?"#0b7a55":"#c2373b";
  return `正二占原型 <b style="color:${col}">${m.pct.toFixed(0)}%</b><span class="nt">上限 100%</span>`;
}

/* ══ 資產面板:資料來自 asset-data.js(window.ASSET_DATA),make_asset_data.py 產生 ══ */
function assetPos(sym){
  const A=window.ASSET_DATA; if(!A||!sym) return null;
  for(const b of A.holdings) for(const r of b.rows) if(r.sym===sym) return r;
  return null;
}
/* 線圖彈窗裡的「持有市值 / 佔股票部位」一列,只有資產面板有這支才出現 */
function assetLineHTML(sym){
  const r=assetPos(sym); if(!r) return "";
  return `<div class="apos num">持有市值 ${r.value.toLocaleString("en-US")} TWD · 佔股票部位 ${r.pctAll}%
    <button class="aposlink" data-goasset>資產面板 ↗</button></div>`;
}

  const A=window.ASSET_DATA, el=document.getElementById("assetPanel");
  if(!A){ el.innerHTML=""; return; }
  const fmt=n=>Math.round(n).toLocaleString("en-US");
  const mob=isMobile();
  // 桌面把 delta(▲▼ vs 上次)接在 sub 後面同一行,手機維持獨立一行(設計稿 D1)
  const kpis=A.summary.map(k=>`
    <div class="as-kpi">
      <div class="k">${k.label}</div>
      <div class="v num">${k.value}${k.unit?`<span class="u">${k.unit}</span>`:""}</div>
      <div class="s num">${k.sub}${(!mob&&k.delta)?` · ${k.delta}`:""}</div>
      ${(mob&&k.delta)?`<div class="d ${k.deltaDir||""} num">${k.delta}</div>`:""}
